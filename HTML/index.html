<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Replace Tool</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e2e6ef;
    --accent: #4f6ef7;
    --accent-hover: #3b57d9;
    --text: #1e2a3a;
    --muted: #6b7a90;
    --code-bg: #111827;
    --code-fg: #d1fae5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  label.field { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%; height: 340px; padding: 12px;
    border: 1px solid var(--border); border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55; resize: vertical;
    background: #fafbfd; transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .options { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 12px; }
  .options label { font-size: 13px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); font-size: 13px; cursor: pointer; transition: all .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status {
    margin-top: 12px; padding: 12px 14px; border-radius: 10px;
    background: var(--code-bg); color: var(--code-fg);
    font-family: ui-monospace, monospace; font-size: 12px;
    white-space: pre-wrap; min-height: 22px; line-height: 1.6;
  }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-right: 4px; }
  .tag-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<h1>Auto Replace Tool</h1>
<div class="subtitle">Python / HTML などテキスト対応。「変更N: 探す / 置き換え / この直前に追加 / この直後に追加」形式で一括処理。</div>

<div class="card">
  <div class="grid">
    <div>
      <label class="field" for="code">最新コード</label>
      <textarea id="code" spellcheck="false" placeholder="ここに現在のコードを貼る"></textarea>
    </div>
    <div>
      <label class="field" for="instructions">置換指示</label>
      <textarea id="instructions" spellcheck="false" placeholder="変更1: 探す&#10;...&#10;変更1: 置き換え&#10;..."></textarea>
      <div class="tag-hint">コマンド: <code>探す</code> <code>置き換え</code> <code>この直前に追加</code> <code>この直後に追加</code></div>
    </div>
  </div>
</div>

<div class="card">
  <div class="options">
    <label><input type="checkbox" id="ignoreLeading" checked> 先頭空白の違いを無視</label>
    <label><input type="checkbox" id="ignoreTrailing" checked> 末尾空白の違いを無視</label>
    <label><input type="checkbox" id="trimBlocks" checked> ブロック端の空行を無視</label>
    <label><input type="checkbox" id="replaceAll" checked> すべて適用</label>
    <label><input type="checkbox" id="autoIndent" checked> インデント自動調整</label>
  </div>
  <div class="toolbar">
    <button id="applyButton" class="primary">実行</button>
    <button id="testButton">検索テスト</button>
    <button id="sampleButton">サンプル</button>
    <button id="copyButton">コピー</button>
    <button id="downloadButton">ダウンロード</button>
    <button id="undoButton" disabled>元に戻す</button>
  </div>
  <div id="status">準備完了</div>
</div>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const codeArea = $('code');
  const instrArea = $('instructions');
  const statusBox = $('status');
  const undoBtn = $('undoButton');
  const history = [];

  const COMMANDS = ['探す', '置き換え', 'この直前に追加', 'この直後に追加'];

  function normNL(t) { return t.replace(/\r\n?/g, '\n'); }
  function setStatus(h) { statusBox.innerHTML = h; }
  function pushHist(v) { history.push(v); if (history.length > 100) history.shift(); undoBtn.disabled = !history.length; }

  function trimEmpty(lines) {
    let s = 0; while (s < lines.length && lines[s].trim() === '') s++;
    let e = lines.length; while (e > s && lines[e-1].trim() === '') e--;
    return lines.slice(s, e);
  }

  function parseBlocks(text) {
    const lines = normNL(text).split('\n');
    const blocks = [];
    let cur = null;
    let mode = null;

    const LABEL_RE = /^変更(\d+)\s*[:：]\s*(.+)$/;

    for (const raw of lines) {
      const t = raw.trim();
      if (t.startsWith('```')) continue;

      const m = t.match(LABEL_RE);
      if (m) {
        const num = m[1];
        const cmd = m[2].trim();
        if (COMMANDS.includes(cmd)) {
          if (cmd === '探す') {
            if (cur) blocks.push(cur);
            cur = { label: num, search: [], replace: [], before: [], after: [] };
            mode = 'search';
          } else if (cur) {
            if (cmd === '置き換え') mode = 'replace';
            else if (cmd === 'この直前に追加') mode = 'before';
            else if (cmd === 'この直後に追加') mode = 'after';
          }
          continue;
        }
      }

      // 旧形式フォールバック
      if (/^探す\s*[:：]?$/.test(t)) {
        if (cur) blocks.push(cur);
        cur = { label: String(blocks.length + 1), search: [], replace: [], before: [], after: [] };
        mode = 'search'; continue;
      }
      if (cur && mode === 'search' && /^置き換え\s*[:：]?$/.test(t)) { mode = 'replace'; continue; }

      if (!cur || !mode) continue;
      if (mode === 'search') cur.search.push(raw);
      else if (mode === 'replace') cur.replace.push(raw);
      else if (mode === 'before') cur.before.push(raw);
      else if (mode === 'after') cur.after.push(raw);
    }
    if (cur) blocks.push(cur);
    return blocks;
  }

  function getIndent(l) { const m = l.match(/^[ \t]*/); return m ? m[0] : ''; }
  function normLine(l, o) { let s = l; if (o.ignoreLeading) s = s.replace(/^[ \t]+/, ''); if (o.ignoreTrailing) s = s.replace(/[ \t]+$/, ''); return s; }

  function matchAt(lines, start, search, o) {
    if (start + search.length > lines.length) return false;
    for (let i = 0; i < search.length; i++) if (normLine(lines[start+i], o) !== normLine(search[i], o)) return false;
    return true;
  }

  function adjustIndent(matched, contentLines, o) {
    if (!o.autoIndent) return contentLines.slice();
    if (!contentLines.length) return [];
    let base = '';
    for (const l of matched) if (l.trim()) { base = getIndent(l); break; }
    let baseC = '', found = false;
    for (const l of contentLines) if (l.trim()) { baseC = getIndent(l); found = true; break; }
    if (!found) return contentLines.map(() => '');
    return contentLines.map(l => {
      if (!l.trim()) return '';
      if (!baseC) return base + l;
      if (l.startsWith(baseC)) return base + l.slice(baseC.length);
      return base + l.replace(/^[ \t]+/, '');
    });
  }

  function applyBlock(lines, block, o, all) {
    const search = o.trimBlocks ? trimEmpty(block.search) : block.search.slice();
    if (!search.length) return { lines, count: 0, type: 'skip' };

    const hasReplace = block.replace.length > 0;
    const hasBefore = block.before.length > 0;
    const hasAfter = block.after.length > 0;
    if (!hasReplace && !hasBefore && !hasAfter) return { lines, count: 0, type: 'noop' };

    const repl = o.trimBlocks ? trimEmpty(block.replace) : block.replace.slice();
    const bef = o.trimBlocks ? trimEmpty(block.before) : block.before.slice();
    const aft = o.trimBlocks ? trimEmpty(block.after) : block.after.slice();

    if (!all) {
      for (let i = 0; i <= lines.length - search.length; i++) {
        if (matchAt(lines, i, search, o)) {
          const matched = lines.slice(i, i + search.length);
          const parts = [];
          if (hasBefore) parts.push(...adjustIndent(matched, bef, o));
          if (hasReplace) parts.push(...adjustIndent(matched, repl, o));
          else parts.push(...matched);
          if (hasAfter) parts.push(...adjustIndent(matched, aft, o));
          return { lines: lines.slice(0,i).concat(parts, lines.slice(i+search.length)), count: 1, type: 'ok' };
        }
      }
      return { lines, count: 0, type: 'miss' };
    }

    const out = []; let i = 0, cnt = 0;
    while (i < lines.length) {
      if (i + search.length <= lines.length && matchAt(lines, i, search, o)) {
        const matched = lines.slice(i, i + search.length);
        if (hasBefore) out.push(...adjustIndent(matched, bef, o));
        if (hasReplace) out.push(...adjustIndent(matched, repl, o));
        else out.push(...matched);
        if (hasAfter) out.push(...adjustIndent(matched, aft, o));
        cnt++; i += search.length;
      } else { out.push(lines[i]); i++; }
    }
    return { lines: out, count: cnt, type: cnt ? 'ok' : 'miss' };
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function logLine(label, ok, detail) {
    const c = ok ? 'background:#22c55e33;color:#4ade80' : 'background:#ef444433;color:#fca5a5';
    return `<div><span class="badge" style="${c}">変更${esc(label)}</span> ${esc(detail)}</div>`;
  }

  function run(replace) {
    const o = {
      ignoreLeading: $('ignoreLeading').checked,
      ignoreTrailing: $('ignoreTrailing').checked,
      trimBlocks: $('trimBlocks').checked,
      autoIndent: $('autoIndent').checked
    };
    const all = $('replaceAll').checked;
    const blocks = parseBlocks(instrArea.value);
    if (!blocks.length) { setStatus('<span style="color:#fca5a5">指示が見つかりません。</span>'); return; }

    let lines = normNL(codeArea.value).split('\n');
    const before = lines.join('\n');
    let logs = '', total = 0;

    for (const b of blocks) {
      const res = applyBlock(lines, b, o, all);
      lines = res.lines;
      total += res.count;
      const detail = res.type === 'skip' ? '検索内容が空' : res.type === 'noop' ? '操作なし' : res.count > 0 ? `${res.count}件適用` : '見つからない';
      logs += logLine(b.label, res.count > 0, detail);
    }

    const after = lines.join('\n');
    if (replace) {
      if (after !== before) { pushHist(before); codeArea.value = after; }
      setStatus(logs + `<div style="margin-top:6px;color:#94a3b8">合計: ${total}件</div>`);
    } else {
      setStatus(`<div style="margin-bottom:4px;color:#94a3b8">【検索テスト】</div>` + logs + `<div style="margin-top:6px;color:#94a3b8">合計: ${total}件</div>`);
    }
  }

  $('applyButton').onclick = () => run(true);
  $('testButton').onclick = () => run(false);
  $('undoBtn').onclick = () => { if (!history.length) return; codeArea.value = history.pop(); undoBtn.disabled = !history.length; setStatus('<span style="color:#4ade80">元に戻しました。</span>'); };
  $('copyButton').onclick = async () => { try { await navigator.clipboard.writeText(codeArea.value); setStatus('<span style="color:#4ade80">コピーしました。</span>'); } catch { codeArea.select(); document.execCommand('copy'); setStatus('<span style="color:#fbbf24">フォールバックでコピー。</span>'); } };
  $('downloadButton').onclick = () => { const n = prompt('ファイル名','code.txt'); if (!n) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([codeArea.value],{type:'text/plain;charset=utf-8'})); a.download = n; a.click(); URL.revokeObjectURL(a.href); };
  $('sampleButton').onclick = () => {
    codeArea.value = 'def greet(name):\n    if name:\n        print("Hello")\n    return None';
    instrArea.value = [
      '変更1: 探す','def greet(name):','変更1: 置き換え','def greet(name: str) -> str:',
      '','変更2: 探す','        print("Hello")','変更2: この直前に追加','        msg = f"Hello, {name}!"',
      '','変更3: 探す','    return None','変更3: この直後に追加','    # end of function'
    ].join('\n');
    setStatus('<span style="color:#4ade80">サンプル読込完了。</span>');
  };
})();
</script>
</body>
</html>
