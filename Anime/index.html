<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ネタバレなしアニメ紹介</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fc;
    --card: #ffffff;
    --card-border: #e7e9f2;
    --text: #1c2333;
    --muted: #667085;
    --accent-1: #7c3aed;
    --accent-2: #ec4899;
    --accent-3: #0e7490;
    --danger: #dc2626;
    --success: #16a34a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 64px 20px 72px;
    font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(900px 480px at 85% -10%, rgba(124, 58, 237, 0.10), transparent 60%),
      radial-gradient(800px 460px at -10% 110%, rgba(236, 72, 153, 0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  main {
    max-width: 880px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }

  .gear {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(28, 35, 51, 0.08);
    transition: color 0.2s, transform 0.2s;
  }

  .gear:hover {
    color: var(--accent-1);
    transform: rotate(30deg);
  }

  .hero {
    text-align: center;
    padding: 8px 0 4px;
  }

  .hero-eyebrow {
    margin: 0 0 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.35em;
    color: var(--accent-3);
  }

  h1 {
    margin: 0 0 12px;
    font-family: "Zen Old Mincho", serif;
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 900;
    background: linear-gradient(92deg, #312e81 10%, #7c3aed 55%, #db2777 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero-lead {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }

  .search-box {
    display: flex;
    gap: 10px;
    max-width: 620px;
    margin: 28px auto 0;
  }

  .search-box input {
    flex: 1;
    padding: 14px 20px;
    border: 1px solid #d7dbe7;
    border-radius: 999px;
    background: #ffffff;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    box-shadow: 0 6px 18px rgba(28, 35, 51, 0.06);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18);
  }

  @media (max-width: 560px) {
    .search-box {
      flex-direction: column;
    }

    .search-box .btn {
      width: 100%;
    }
  }

  .btn {
    padding: 14px 24px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.25);
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 28px rgba(236, 72, 153, 0.3);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: wait;
    transform: none;
  }

  .meta-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 32px;
  }

  .status {
    margin-top: 8px;
    min-height: 20px;
    font-size: 13px;
    color: var(--muted);
  }

  .error {
    color: var(--danger);
  }

  .success {
    color: var(--success);
  }

  .timer {
    margin-top: 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #eef2ff;
    color: #4338ca;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .timer[hidden] {
    display: none;
  }

  #result {
    padding: 20px;
    border: 1px solid #e9e4f6;
    border-left: 3px solid var(--accent-2);
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 12px 32px rgba(28, 35, 51, 0.06);
    white-space: pre-wrap;
    line-height: 1.9;
    font-size: 14.5px;
  }

  #result:empty {
    display: none;
  }

  #result.filled {
    animation: fadeUp 0.35s ease;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }

  dialog.settings-dialog {
    width: min(480px, calc(100vw - 32px));
    padding: 24px;
    border: none;
    border-radius: 20px;
    background: var(--card);
    color: var(--text);
    box-shadow: 0 24px 64px rgba(28, 35, 51, 0.25);
  }

  dialog.settings-dialog::backdrop {
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(2px);
  }

  .dialog-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .dialog-head h2 {
    margin: 0;
    font-size: 16px;
    color: #334155;
  }

  .icon-btn {
    border: 0;
    background: transparent;
    font-size: 22px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
  }

  .icon-btn:hover {
    color: var(--danger);
  }

  label {
    display: block;
    margin: 14px 0 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  input[type="text"],
  input[type="password"],
  select {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #d7dbe7;
    border-radius: 12px;
    background: #ffffff;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus,
  select:focus {
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18);
  }

  #modelId {
    margin-top: 8px;
  }

  .hint {
    margin: 6px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  .switch {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 0;
    cursor: pointer;
  }

  .switch input {
    display: none;
  }

  .slider {
    position: relative;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 999px;
    background: #d8dce8;
    transition: background 0.2s;
  }

  .slider::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }

  .switch input:checked + .slider {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  }

  .switch input:checked + .slider::after {
    transform: translateX(20px);
  }

  .switch-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  dialog .btn {
    margin-top: 18px;
    width: 100%;
  }
</style>
</head>
<body>
<button id="openSettings" class="gear" aria-label="設定を開く" title="設定">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<main>
  <header class="hero">
    <p class="hero-eyebrow">SPOILER-FREE ANIME GUIDE</p>
    <h1>ネタバレなしアニメ紹介</h1>
    <p class="hero-lead">見たいアニメ名を入力すると、ネタバレなしのあらすじ・魅力・登場人物をAIがまとめます。</p>

    <div class="search-box">
      <input
        id="animeTitle"
        type="text"
        placeholder="例：葬送のフリーレン"
      />
      <button id="generate" class="btn">ネタバレなしで調べる</button>
    </div>

    <div class="meta-line">
      <div id="generateStatus" class="status"></div>
      <div id="timer" class="timer" hidden></div>
    </div>
  </header>

  <div id="result"></div>

  <footer>生成結果は誤りを含む可能性があります。重要な情報は必ず自身でも確認してください。</footer>
</main>

<dialog id="settingsDialog" class="settings-dialog">
  <div class="dialog-head">
    <h2>設定</h2>
    <button id="closeSettings" class="icon-btn" aria-label="閉じる">×</button>
  </div>

  <label for="apiKey">Google APIキー</label>
  <input
    id="apiKey"
    type="password"
    placeholder="Google APIキー"
    autocomplete="off"
  />

  <label for="modelSelect">モデル</label>
  <select id="modelSelect">
    <option value="gemma-4-31b-it">Gemma 4 31B</option>
    <option value="gemma-4-26b-a4b-it">Gemma 4 26B (MoE)</option>
    <option value="gemma-4-27b-it">Gemma 4 27B</option>
    <option value="custom">カスタム</option>
  </select>
  <input
    id="modelId"
    type="text"
    placeholder="カスタムモデルID"
    hidden
  />
  <p class="hint">実際のモデルIDは環境により異なる可能性があります。エラーが出る場合はカスタムを選択してください。</p>

  <label for="apiBase">APIベースURL</label>
  <input
    id="apiBase"
    type="text"
    placeholder="https://generativelanguage.googleapis.com/v1beta"
  />
  <p class="hint">通常はデフォルトのままで問題ありません。</p>

  <label class="switch">
    <input id="useSearch" type="checkbox" checked />
    <span class="slider"></span>
    <span class="switch-label">Wikipedia検索を使う（APIキー不要）</span>
  </label>
  <p class="hint">
    日本語Wikipediaを検索して、その結果をAIに渡します。
    検索結果自体にネタバレが混ざる可能性はあります。
  </p>

  <button id="saveSettings" class="btn">設定を保存</button>
  <div id="settingsStatus" class="status"></div>
</dialog>

<script>
  const STORAGE_KEYS = {
    apiKey: "anime_intro_google_api_key",
    modelId: "anime_intro_model_id",
    apiBase: "anime_intro_api_base",
    useSearch: "anime_intro_use_wikipedia_search"
  };

  const DEFAULT_MODEL_ID = "gemma-4-31b-it";
  const DEFAULT_API_BASE = "https://generativelanguage.googleapis.com/v1beta";

  const openSettingsButton = document.getElementById("openSettings");
  const closeSettingsButton = document.getElementById("closeSettings");
  const settingsDialog = document.getElementById("settingsDialog");
  const apiKeyInput = document.getElementById("apiKey");
  const modelSelect = document.getElementById("modelSelect");
  const modelIdInput = document.getElementById("modelId");
  const apiBaseInput = document.getElementById("apiBase");
  const useSearchCheckbox = document.getElementById("useSearch");
  const saveSettingsButton = document.getElementById("saveSettings");
  const settingsStatus = document.getElementById("settingsStatus");
  const animeTitleInput = document.getElementById("animeTitle");
  const generateButton = document.getElementById("generate");
  const generateStatus = document.getElementById("generateStatus");
  const timerBox = document.getElementById("timer");
  const resultBox = document.getElementById("result");

  let timerInterval = null;
  let timerStart = 0;

  function startTimer() {
    stopTimer();
    timerStart = performance.now();
    timerBox.hidden = false;
    timerBox.textContent = "経過 0.0秒";
    timerInterval = setInterval(() => {
      timerBox.textContent = `経過 ${((performance.now() - timerStart) / 1000).toFixed(1)}秒`;
    }, 100);
  }

  function stopTimer() {
    if (timerInterval !== null) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function loadSettings() {
    apiKeyInput.value = localStorage.getItem(STORAGE_KEYS.apiKey) || "";
    apiBaseInput.value = localStorage.getItem(STORAGE_KEYS.apiBase) || DEFAULT_API_BASE;

    const savedModel = localStorage.getItem(STORAGE_KEYS.modelId) || DEFAULT_MODEL_ID;
    const presetValues = Array.from(modelSelect.options)
      .map(option => option.value)
      .filter(value => value !== "custom");

    if (presetValues.includes(savedModel)) {
      modelSelect.value = savedModel;
      modelIdInput.hidden = true;
      modelIdInput.value = savedModel;
    } else {
      modelSelect.value = "custom";
      modelIdInput.hidden = false;
      modelIdInput.value = savedModel;
    }

    const savedUseSearch = localStorage.getItem(STORAGE_KEYS.useSearch);
    useSearchCheckbox.checked = savedUseSearch === null ? true : savedUseSearch === "true";
  }

  function setSettingsStatus(message, isError = false) {
    settingsStatus.textContent = message;
    settingsStatus.className = isError ? "status error" : "status success";
  }

  function setGenerateStatus(message, isError = false, isSuccess = false) {
    generateStatus.textContent = message;
    generateStatus.className = isError ? "status error" : isSuccess ? "status success" : "status";
  }

  function getEffectiveModelId() {
    if (modelSelect.value === "custom") {
      return modelIdInput.value.trim() || DEFAULT_MODEL_ID;
    }
    return modelSelect.value;
  }

  function syncModelInput() {
    const isCustom = modelSelect.value === "custom";
    modelIdInput.hidden = !isCustom;

    if (!isCustom) {
      modelIdInput.value = modelSelect.value;
    }
  }

  function saveSettings() {
    localStorage.setItem(STORAGE_KEYS.apiKey, apiKeyInput.value.trim());
    localStorage.setItem(STORAGE_KEYS.modelId, getEffectiveModelId());
    localStorage.setItem(STORAGE_KEYS.apiBase, apiBaseInput.value.trim() || DEFAULT_API_BASE);
    localStorage.setItem(STORAGE_KEYS.useSearch, useSearchCheckbox.checked ? "true" : "false");

    setSettingsStatus("設定をlocalStorageに保存しました。");
  }

  function normalizeApiBase(value) {
    return (value || DEFAULT_API_BASE).trim().replace(/\/+$/, "");
  }

  function normalizeModelId(value) {
    return (value || DEFAULT_MODEL_ID).trim().replace(/^models\//, "");
  }

  function formatDuration(ms) {
    return `${(ms / 1000).toFixed(1)}秒`;
  }

  function stripHtml(html) {
    const doc = new DOMParser().parseFromString(html || "", "text/html");
    return doc.body.textContent || "";
  }

  function extractFinalJapanese(text) {
    const matches = [...text.matchAll(/(?:^|\n)[ \t]*【一言紹介】/g)];
    let body = text;

    if (matches.length) {
      const last = matches[matches.length - 1];
      body = text.slice(last.index);
    }

    return body
      .split("\n")
      .map(line => line.trimStart())
      .join("\n")
      .trim();
  }

  async function searchWikipedia(query) {
    const url = `https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=5&format=json&origin=*&srprop=snippet`;

    const response = await fetch(url, {
      method: "GET"
    });

    let data = null;

    try {
      data = await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {
      const apiMessage = data?.error?.info || `HTTP ${response.status}`;
      throw new Error(apiMessage);
    }

    return data?.query?.search || [];
  }

  async function getWikipediaSearchResults(animeTitle) {
    const normalizedTitle = animeTitle.trim();
    const queryWithAnime = normalizedTitle.includes("アニメ")
      ? normalizedTitle
      : `${normalizedTitle} アニメ`;

    let results = await searchWikipedia(queryWithAnime);

    if (!results.length) {
      results = await searchWikipedia(normalizedTitle);
    }

    return results;
  }

  function formatSearchResults(results) {
    if (!results.length) {
      return "";
    }

    return results.map((item, index) => {
      const title = item.title || "";
      const snippet = stripHtml(item.snippet || "").replace(/\s+/g, " ").trim();
      const url = item.pageid ? `https://ja.wikipedia.org/?curid=${item.pageid}` : "";

      return [
        `${index + 1}. タイトル: ${title}`,
        `   概要: ${snippet || "概要を取得できませんでした。"}`,
        url ? `   URL: ${url}` : ""
      ].filter(Boolean).join("\n");
    }).join("\n\n");
  }

  function buildPrompt(animeTitle, searchResultsText) {
    const lines = [
      "あなたはアニメ作品に詳しい紹介ライターです。",
      "以下のアニメについて、未視聴者向けに日本語でネタバレなしの紹介を作成してください。",
      "",
      "アニメ名:",
      animeTitle,
      "",
      "必須ルール:",
      "- 重大な結末、死亡、裏切り、犯人、どんでん返し、後半の重要な展開は書かないでください。",
      "- 登場人物の説明でもネタバレになる伏線や運命の確定は避けてください。",
      "- 作品を知らない人が「見るかどうか判断できる」情報に絞ってください。",
      "- 事実関係が不確実な場合は断定せず「要確認」と書いてください。",
      "- 存在しない作品や判断できない場合は、その旨を正直に書いてください。",
      "- 必ず日本語のみで回答してください。作品名や固有名詞の英字（Key、Na-Ga など）はそのまま使ってかまいません。",
      "- いきなり最終的な日本語出力だけを出力してください。",
      "- 【一言紹介】の行から直接始めてください。それより前に何も書かないでください。",
      "- 計画・思考過程・下書き・役割設定・確認事項を出力しないでください。",
      "- 出力は指定された見出しのみを使用してください。",
      "- 検索結果がある場合は、検索結果の表記と内容を優先してください。",
      "- 検索結果にない固有名詞・人物名・設定を勝手に作らないでください。"
    ];

    if (searchResultsText) {
      lines.push(
        "",
        "参考にできる検索結果:",
        searchResultsText,
        "",
        "検索結果を参考にする場合、検索結果にない情報を断定せず、不明な点は要確認としてください。",
        "検索結果にネタバレが含まれる可能性がある場合は、ネタバレ部分を無視してください。"
      );
    }

    lines.push(
      "",
      "出力形式:",
      "【一言紹介】",
      "1〜2文で作品の魅力を端的に書いてください。",
      "",
      "【あらすじ】",
      "冒頭〜序盤の設定を中心に、ネタバレなしで3〜5文で書いてください。",
      "",
      "【主な登場人物】",
      "主要キャラクターを5人以内で、各キャラクターを1行で書いてください。",
      "形式: キャラクター名 / 立場や特徴（ネタバレ禁止）",
      "",
      "【見どころ】",
      "作画、物語、キャラ、世界観など魅力を3〜5個の箇条書きで書いてください。",
      "",
      "【こんな人におすすめ】",
      "どんな気分や嗜好の人に向くか、2〜4個の箇条書きで書いてください。"
    );

    return lines.join("\n");
  }

  function extractModelText(data) {
    const candidate = data?.candidates?.[0];

    if (!candidate) {
      const blockReason = data?.promptFeedback?.blockReason;
      if (blockReason) {
        throw new Error(`安全性設定によりブロックされました: ${blockReason}`);
      }
      throw new Error("候補が返却されませんでした。");
    }

    const parts = candidate?.content?.parts;

    if (!Array.isArray(parts) || parts.length === 0) {
      throw new Error("本文が見つかりませんでした。");
    }

    return parts.map(part => part?.text ?? "").join("").trim();
  }

  async function generateAnimeIntro() {
    const apiKey = apiKeyInput.value.trim();
    const modelId = normalizeModelId(getEffectiveModelId());
    const apiBase = normalizeApiBase(apiBaseInput.value);
    const animeTitle = animeTitleInput.value.trim();

    resultBox.textContent = "";
    resultBox.classList.remove("filled");
    setGenerateStatus("");
    timerBox.hidden = true;
    stopTimer();

    if (!apiKey) {
      setGenerateStatus("APIキーがありません。右上の歯車から設定してください。", true);
      settingsDialog.showModal();
      return;
    }

    if (!animeTitle) {
      setGenerateStatus("アニメ名を入力してください。", true);
      return;
    }

    generateButton.disabled = true;
    startTimer();
    const totalStart = performance.now();
    let searchMs = null;
    let searchResultsText = "";

    if (useSearchCheckbox.checked) {
      setGenerateStatus("Wikipedia検索中...");
      const searchStart = performance.now();

      try {
        const results = await getWikipediaSearchResults(animeTitle);
        searchResultsText = formatSearchResults(results);

        if (!searchResultsText) {
          setGenerateStatus("検索結果がなかったので、AIのみで生成します。");
        }
      } catch (error) {
        console.error(error);
        setGenerateStatus(`Wikipedia検索に失敗したため、検索なしで続行します: ${error.message}`, true);
      }

      searchMs = performance.now() - searchStart;
    }

    setGenerateStatus("AIに送信中...");
    const aiStart = performance.now();

    try {
      const url = `${apiBase}/models/${encodeURIComponent(modelId)}:generateContent?key=${encodeURIComponent(apiKey)}`;

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: buildPrompt(animeTitle, searchResultsText)
                }
              ]
            }
          ],
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 8192
          }
        })
      });

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        const apiMessage = data?.error?.message || `HTTP ${response.status}`;
        throw new Error(apiMessage);
      }

      const rawText = extractModelText(data);
      const text = extractFinalJapanese(rawText);
      const finishReason = data?.candidates?.[0]?.finishReason || "";
      const truncated = finishReason === "MAX_TOKENS";

      resultBox.textContent = truncated
        ? `${text}\n\n（注意: 出力が途中で切れた可能性があります）`
        : text || "AIの応答が空でした。";
      resultBox.classList.add("filled");

      const aiMs = performance.now() - aiStart;
      const totalMs = performance.now() - totalStart;
      const searchLabel = searchMs === null ? "検索 -" : `検索 ${formatDuration(searchMs)}`;

      stopTimer();
      timerBox.textContent = `合計 ${formatDuration(totalMs)}`;
      setGenerateStatus(`生成しました。（${searchLabel} / AI ${formatDuration(aiMs)}）`, false, true);
    } catch (error) {
      const totalMs = performance.now() - totalStart;
      console.error(error);
      resultBox.textContent = "";
      stopTimer();
      timerBox.textContent = `${formatDuration(totalMs)} で停止`;
      setGenerateStatus(`失敗: ${error.message}`, true);
    } finally {
      generateButton.disabled = false;
    }
  }

  openSettingsButton.addEventListener("click", () => settingsDialog.showModal());
  closeSettingsButton.addEventListener("click", () => settingsDialog.close());
  saveSettingsButton.addEventListener("click", saveSettings);
  generateButton.addEventListener("click", generateAnimeIntro);
  modelSelect.addEventListener("change", syncModelInput);

  animeTitleInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      generateAnimeIntro();
    }
  });

  loadSettings();
</script>
</body>
</html>
