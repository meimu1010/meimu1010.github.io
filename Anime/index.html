<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ネタバレなしアニメ紹介</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light; --bg:#f6f7fc; --card:#fff; --card-border:#e7e9f2; --text:#1c2333; --muted:#667085; --accent-1:#7c3aed; --accent-2:#ec4899; --accent-3:#0e7490; --danger:#dc2626; --success:#16a34a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:64px 20px 72px; font-family:"Noto Sans JP",system-ui,sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
  main { max-width:1160px; margin:0 auto; display:grid; gap:20px; position:relative; z-index:1; }
  .hero-bg { position:fixed; top:0; left:0; right:0; height:62vh; background-size:cover; background-position:center 30%; opacity:0; transition:opacity .8s ease; pointer-events:none; z-index:0; }
  .hero-bg::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(246,247,252,.65) 0%, rgba(246,247,252,.8) 45%, var(--bg) 100%); }
  body.has-banner .hero-bg { opacity:1; }
  .orb { position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; }
  .orb-1 { width:420px; height:420px; background:rgba(124,58,237,.16); top:-120px; left:-120px; animation:drift 14s ease-in-out infinite alternate; }
  .orb-2 { width:380px; height:380px; background:rgba(236,72,153,.14); bottom:-100px; right:-100px; animation:drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform:translate(0,0) scale(1); } to { transform:translate(40px,30px) scale(1.15); } }
  .top-bar { position:fixed; top:16px; right:16px; z-index:10; display:flex; align-items:center; gap:10px; padding:8px; border-radius:16px; border:1px solid var(--card-border); background:rgba(255,255,255,.75); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 6px 18px rgba(28,35,51,.08); }
  .model-select { width:auto; max-width:52vw; padding:9px 12px; border-radius:12px; border:1px solid transparent; background:transparent; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text); outline:none; cursor:pointer; }
  .model-select:focus { border-color:var(--accent-1); }
  .gear { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:1px solid var(--card-border); border-radius:12px; background:var(--card); color:var(--muted); cursor:pointer; box-shadow:0 6px 18px rgba(28,35,51,.08); transition:color .2s, transform .2s; }
  .gear:hover { color:var(--accent-1); transform:rotate(30deg); }
  .hero { text-align:center; padding:8px 0 4px; }
  .hero-eyebrow { margin:0 0 14px; font-size:11px; font-weight:700; letter-spacing:.35em; color:var(--accent-3); }
  h1 { margin:0 0 12px; font-family:"Zen Old Mincho",serif; font-size:clamp(30px,5vw,44px); font-weight:900; background:linear-gradient(92deg,#312e81 10%,#7c3aed 55%,#db2777 90%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-lead { margin:0; font-size:14px; color:#47536b; text-shadow:0 1px 6px rgba(246,247,252,.9); }
  h1 { filter:drop-shadow(0 2px 6px rgba(255,255,255,.55)); }
  .search-box { display:flex; gap:10px; max-width:720px; margin:28px auto 0; }
  .search-box input { flex:1; padding:14px 20px; border:1px solid #d7dbe7; border-radius:999px; background:#fff; color:var(--text); font-size:16px; font-family:inherit; outline:none; box-shadow:0 6px 18px rgba(28,35,51,.06); transition:border-color .2s, box-shadow .2s; }
  .search-box input:focus { border-color:var(--accent-1); box-shadow:0 0 0 3px rgba(124,58,237,.18); }
  @media (max-width:560px) { .search-box { flex-direction:column; } .search-box .btn { width:100%; } }
  .btn { padding:14px 24px; border:0; border-radius:999px; background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#fff; font-family:inherit; font-size:14px; font-weight:700; letter-spacing:.04em; cursor:pointer; box-shadow:0 8px 24px rgba(124,58,237,.25); transition:transform .15s, box-shadow .2s, opacity .2s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 10px 28px rgba(236,72,153,.3); }
  .btn:disabled { opacity:.55; cursor:wait; transform:none; }
  .btn.small { padding:9px 16px; font-size:12.5px; margin-top:0; box-shadow:0 4px 14px rgba(124,58,237,.25); }
  .meta-line { display:flex; align-items:center; justify-content:center; gap:12px; min-height:32px; flex-wrap:wrap; width:max-content; max-width:92vw; margin:0 auto; padding:4px 16px; border-radius:999px; background:rgba(255,255,255,.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 4px 14px rgba(28,35,51,.08); }
  .meta-line[hidden] { display:none; }
  .meta-line .status, .meta-line .timer { margin-top:0; }
  .status { margin-top:8px; min-height:20px; font-size:13px; color:var(--muted); }
  .error { color:var(--danger); }
  .success { color:var(--success); }
  .timer { margin-top:8px; padding:4px 12px; border-radius:999px; background:#eef2ff; color:#4338ca; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .timer[hidden] { display:none; }
  .anime-meta { margin:26px auto 0; max-width:680px; }
  .anime-meta h2 { margin:0 0 4px; font-family:"Zen Old Mincho",serif; font-size:clamp(24px,4vw,34px); color:#1f2430; }
  .anime-meta .romaji { margin:0; font-size:12px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .chip { padding:4px 12px; border-radius:999px; background:#fff; border:1px solid var(--card-border); font-size:12px; font-weight:600; color:#47536b; box-shadow:0 2px 8px rgba(28,35,51,.06); }
  .chip.score { background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#fff; border:0; }
  .chip.genre { position:relative; cursor:help; background:#eef2ff; color:#4338ca; border-color:#e0e7ff; }
  .chip.genre::after { content:attr(data-tip); position:absolute; left:50%; top:calc(100% + 6px); transform:translateX(-50%); background:#1f2430; color:#fff; font-size:11px; font-weight:500; padding:6px 10px; border-radius:8px; width:max-content; max-width:220px; white-space:normal; opacity:0; pointer-events:none; transition:opacity .15s; z-index:20; }
  .chip.genre:hover::after, .chip.genre:focus::after { opacity:1; }
  #result { display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:14.5px; }
  #result:empty { display:none; }
  #result.filled { animation:fadeUp .35s ease; }
  .block { min-width:0; background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:20px 22px; box-shadow:0 12px 32px rgba(28,35,51,.06); animation:fadeUp .4s ease both; transition:transform .2s, box-shadow .2s, border-color .2s; }
  .block:hover { transform:translateY(-3px); box-shadow:0 16px 36px rgba(28,35,51,.10); border-color:#d9cffa; }
  .block-intro { grid-column:1 / -1; text-align:center; background:linear-gradient(120deg,#f5f1ff,#fdeff8); border-color:#e5defa; }
  .block-intro .res-h { justify-content:center; }
  .block-intro .res-p { font-size:16px; font-weight:600; margin:0; }
  .res-h { display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:15px; color:#334155; }
  .res-h::before { content:""; width:4px; height:16px; border-radius:2px; background:linear-gradient(180deg,var(--accent-1),var(--accent-2)); }
  .res-ico { font-size:15px; }
  .res-p { margin:0 0 8px; line-height:1.9; }
  .res-ul { margin:0; padding-left:1.2em; display:grid; gap:6px; line-height:1.7; }
  .res-p.warn { grid-column:1 / -1; color:var(--danger); font-size:12.5px; }
  .info-row { display:flex; gap:8px; margin:0 0 8px; font-size:13px; line-height:1.6; }
  .info-k { flex-shrink:0; min-width:88px; font-weight:700; color:#334155; }
  .info-v { min-width:0; }
  .link-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .link-pill { padding:8px 14px; border-radius:999px; background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; box-shadow:0 4px 14px rgba(124,58,237,.3); transition:filter .15s; }
  .link-pill:hover { filter:brightness(1.08); }
  @media (max-width:860px) { #result { grid-template-columns:1fr; } }
  .section-title { display:flex; align-items:center; gap:10px; margin:0 0 4px; font-size:16px; color:#334155; }
  .section-title .bar { width:4px; height:18px; border-radius:2px; background:linear-gradient(180deg,var(--accent-1),var(--accent-2)); }
  .cards-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  @media (max-width:900px) { .cards-grid { grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:600px) { .cards-grid { grid-template-columns:1fr; } }
  .char-card { min-width:0; display:flex; gap:12px; padding:12px; border:1px solid var(--card-border); border-radius:14px; background:var(--card); box-shadow:0 8px 24px rgba(28,35,51,.06); animation:fadeUp .35s ease both; transition:transform .2s, box-shadow .2s; }
  .char-card:hover { transform:translateY(-3px); box-shadow:0 12px 26px rgba(28,35,51,.12); }
  .char-img { position:relative; width:76px; height:76px; flex-shrink:0; border-radius:12px; background:#eef0f7; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .char-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .char-img.no-img { font-size:26px; font-weight:700; color:var(--muted); }
  .char-body { min-width:0; }
  .char-name { margin:0; font-size:13.5px; font-weight:700; line-height:1.4; }
  .char-sub { margin:1px 0 0; font-size:10.5px; color:var(--muted); }
  .char-desc { margin:4px 0 0; font-size:11.5px; line-height:1.6; color:#47536b; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  dialog.settings-dialog { width:min(480px,calc(100vw - 32px)); padding:24px; border:none; border-radius:20px; background:var(--card); color:var(--text); box-shadow:0 24px 64px rgba(28,35,51,.25); }
  dialog.settings-dialog::backdrop { background:rgba(15,23,42,.45); backdrop-filter:blur(2px); }
  .dialog-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .dialog-head h2 { margin:0; font-size:16px; color:#334155; }
  .icon-btn { border:0; background:transparent; font-size:22px; line-height:1; color:var(--muted); cursor:pointer; }
  .icon-btn:hover { color:var(--danger); }
  label { display:block; margin:14px 0 6px; font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--muted); }
  input[type="text"], input[type="password"], select { width:100%; padding:11px 14px; border:1px solid #d7dbe7; border-radius:12px; background:#fff; color:var(--text); font-size:15px; font-family:inherit; outline:none; transition:border-color .2s, box-shadow .2s; }
  input[type="text"]:focus, input[type="password"]:focus, select:focus { border-color:var(--accent-1); box-shadow:0 0 0 3px rgba(124,58,237,.18); }
  #modelId { margin-top:8px; }
  input:disabled { opacity:.6; background:#f0f1f6; cursor:not-allowed; }
  .hint { margin:6px 0 0; font-size:11.5px; color:var(--muted); }
  .switch { display:flex; align-items:center; gap:12px; margin:16px 0 0; cursor:pointer; }
  .switch input { display:none; }
  .slider { position:relative; width:46px; height:26px; flex-shrink:0; border-radius:999px; background:#d8dce8; transition:background .2s; }
  .slider::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; }
  .switch input:checked + .slider { background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); }
  .switch input:checked + .slider::after { transform:translateX(20px); }
  .switch-label { font-size:14px; font-weight:500; color:var(--text); }
  dialog .btn { margin-top:18px; width:100%; }
</style>
</head>
<body>
<div class="hero-bg" id="heroBg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="top-bar">
  <select id="modelSelect" class="model-select" aria-label="モデル">
    <option value="gemini-3.7-flash">Gemini 3.7 Flash（速い / 性能:高）</option>
    <option value="gemini-3.6-flash">Gemini 3.6 Flash（速い / 性能:中高）</option>
    <option value="gemini-3.5-flash">Gemini 3.5 Flash（速い / 性能:中）</option>
    <option value="gemma-4-31b-it">Gemma 4 31B（遅い / 性能:高）</option>
    <option value="gemma-4-26b-a4b-it">Gemma 4 26B（遅い / 性能:中）</option>
    <option value="custom">カスタム</option>
  </select>
  <button id="openSettings" class="gear" aria-label="設定を開く" title="設定">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>
</div>

<main>
  <header class="hero">
    <p class="hero-eyebrow">SPOILER-FREE ANIME GUIDE</p>
    <h1>ネタバレなしアニメ紹介</h1>
    <p class="hero-lead">見たいアニメ名を入力すると、ネタバレなしのあらすじ・魅力・登場人物をAIがまとめます。</p>
    <div class="search-box">
      <input id="animeTitle" type="text" placeholder="例：葬送のフリーレン" />
      <button id="generate" class="btn">ネタバレなしで調べる</button>
    </div>
    <div class="meta-line" id="metaLine" hidden>
      <div id="generateStatus" class="status"></div>
      <div id="timer" class="timer" hidden></div>
      <button id="saveImage" class="btn small" hidden>📸 画像として保存（16:9）</button>
    </div>
    <div id="animeMeta" class="anime-meta" hidden>
      <h2 id="animeTitleNative"></h2>
      <p id="animeTitleRomaji" class="romaji"></p>
      <div id="animeChips" class="chips"></div>
      <div id="animeGenres" class="chips"></div>
    </div>
  </header>

  <div id="result"></div>

  <section id="charactersSection" hidden>
    <h2 class="section-title"><span class="bar"></span>登場キャラクター</h2>
    <div id="characterCards" class="cards-grid"></div>
  </section>

  <footer>生成結果は誤りを含む可能性があります。重要な情報は必ず自身でも確認してください。</footer>
</main>

<dialog id="settingsDialog" class="settings-dialog">
  <div class="dialog-head">
    <h2>設定</h2>
    <button id="closeSettings" class="icon-btn" aria-label="閉じる">×</button>
  </div>
  <label for="apiKey">Google APIキー</label>
  <input id="apiKey" type="password" placeholder="Google APIキー" autocomplete="off" />
  <input id="modelId" type="text" placeholder="カスタムモデルID" hidden />
  <p class="hint">実際のモデルIDは環境により異なる可能性があります。エラーが出る場合はカスタムを選択してください。</p>
  <label for="apiBase">APIベースURL</label>
  <input id="apiBase" type="text" placeholder="https://generativelanguage.googleapis.com/v1beta" />
  <p class="hint">カスタムモデル選択時のみ編集可能です。</p>
  <label class="switch">
    <input id="useSearch" type="checkbox" checked />
    <span class="slider"></span>
    <span class="switch-label">Wikipedia検索を使う（APIキー不要）</span>
  </label>
  <p class="hint">日本語Wikipediaを検索して、その結果をAIに渡します。検索結果自体にネタバレが混ざる可能性はあります。</p>
  <button id="saveSettings" class="btn">設定を保存</button>
  <div id="settingsStatus" class="status"></div>
</dialog>

<script>
  const STORAGE_KEYS = { apiKey:"anime_intro_google_api_key", modelId:"anime_intro_model_id", apiBase:"anime_intro_api_base", useSearch:"anime_intro_use_wikipedia_search" };
  const DEFAULT_MODEL_ID = "gemma-4-31b-it";
  const DEFAULT_API_BASE = "https://generativelanguage.googleapis.com/v1beta";
  const ANILIST_ENDPOINT = "https://graphql.anilist.co";
  const JIKAN_BASE = "https://api.jikan.moe/v4";
  const HEAD_ICON = { "一言紹介":"✨", "あらすじ":"📖", "見どころ":"🌟", "こんな人におすすめ":"💡", "作品情報":"🎬", "紹介":"📺" };

  const heroBg = document.getElementById("heroBg");
  const openSettingsButton = document.getElementById("openSettings");
  const closeSettingsButton = document.getElementById("closeSettings");
  const settingsDialog = document.getElementById("settingsDialog");
  const apiKeyInput = document.getElementById("apiKey");
  const modelSelect = document.getElementById("modelSelect");
  const modelIdInput = document.getElementById("modelId");
  const apiBaseInput = document.getElementById("apiBase");
  const useSearchCheckbox = document.getElementById("useSearch");
  const saveSettingsButton = document.getElementById("saveSettings");
  const settingsStatus = document.getElementById("settingsStatus");
  const animeTitleInput = document.getElementById("animeTitle");
  const generateButton = document.getElementById("generate");
  const generateStatus = document.getElementById("generateStatus");
  const timerBox = document.getElementById("timer");
  const saveImageButton = document.getElementById("saveImage");
  const metaLine = document.getElementById("metaLine");
  const resultBox = document.getElementById("result");
  const animeMeta = document.getElementById("animeMeta");
  const animeTitleNative = document.getElementById("animeTitleNative");
  const animeTitleRomaji = document.getElementById("animeTitleRomaji");
  const animeChips = document.getElementById("animeChips");
  const animeGenres = document.getElementById("animeGenres");
  const charactersSection = document.getElementById("charactersSection");
  const characterCards = document.getElementById("characterCards");

  let timerInterval = null;
  let timerStart = 0;
  let shareData = null;

  async function fetchWithTimeout(url, options = {}, timeoutMs = 30000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      return response;
    } catch (error) {
      if (error.name === "AbortError") throw new Error(`タイムアウト（${timeoutMs / 1000}秒経過）`);
      throw error;
    } finally {
      clearTimeout(timeoutId);
    }
  }

  function startTimer() {
    stopTimer();
    timerStart = performance.now();
    timerBox.hidden = false;
    metaLine.hidden = false;
    timerBox.textContent = "経過 0.0秒";
    timerInterval = setInterval(() => {
      timerBox.textContent = `経過 ${((performance.now() - timerStart) / 1000).toFixed(1)}秒`;
    }, 100);
  }

  function stopTimer() {
    if (timerInterval !== null) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function loadSettings() {
    apiKeyInput.value = localStorage.getItem(STORAGE_KEYS.apiKey) || "";
    apiBaseInput.value = localStorage.getItem(STORAGE_KEYS.apiBase) || DEFAULT_API_BASE;
    const savedModel = localStorage.getItem(STORAGE_KEYS.modelId) || DEFAULT_MODEL_ID;
    const presetValues = Array.from(modelSelect.options).map(o => o.value).filter(v => v !== "custom");
    modelSelect.value = presetValues.includes(savedModel) ? savedModel : "custom";
    modelIdInput.value = savedModel;
    syncModelInput();
    const savedUseSearch = localStorage.getItem(STORAGE_KEYS.useSearch);
    useSearchCheckbox.checked = savedUseSearch === null ? true : savedUseSearch === "true";
  }

  function setSettingsStatus(message, isError = false) {
    settingsStatus.textContent = message;
    settingsStatus.className = isError ? "status error" : "status success";
  }

  function setGenerateStatus(message, isError = false, isSuccess = false) {
    generateStatus.textContent = message;
    generateStatus.className = isError ? "status error" : isSuccess ? "status success" : "status";
    if (message) metaLine.hidden = false;
  }

  function getEffectiveModelId() {
    if (modelSelect.value === "custom") return modelIdInput.value.trim() || DEFAULT_MODEL_ID;
    return modelSelect.value;
  }

  function syncModelInput() {
    const isCustom = modelSelect.value === "custom";
    modelIdInput.hidden = !isCustom;
    apiBaseInput.disabled = !isCustom;
    if (!isCustom) {
      modelIdInput.value = modelSelect.value;
      apiBaseInput.value = DEFAULT_API_BASE;
    }
  }

  function saveSettings() {
    localStorage.setItem(STORAGE_KEYS.apiKey, apiKeyInput.value.trim());
    localStorage.setItem(STORAGE_KEYS.modelId, getEffectiveModelId());
    localStorage.setItem(STORAGE_KEYS.apiBase, apiBaseInput.value.trim() || DEFAULT_API_BASE);
    localStorage.setItem(STORAGE_KEYS.useSearch, useSearchCheckbox.checked ? "true" : "false");

  function normalizeApiBase(value) { return (value || DEFAULT_API_BASE).trim().replace(/\/+$/, ""); }
  function normalizeModelId(value) { return (value || DEFAULT_MODEL_ID).trim().replace(/^models\//, ""); }
  function formatDuration(ms) { return `${(ms / 1000).toFixed(1)}秒`; }

  function stripHtml(html) {

  function seasonJa(s) { return ({ WINTER:"冬", SPRING:"春", SUMMER:"夏", FALL:"秋" })[s] || s; }

  const GENRE_INFO = {

  const SOURCE_JA = { ORIGINAL:"オリジナル", MANGA:"漫画", LIGHT_NOVEL:"ライトノベル", VISUAL_NOVEL:"ビジュアルノベル", VIDEO_GAME:"ゲーム", GAME:"ゲーム", NOVEL:"小説", COMIC:"コミック", BOOK:"書籍", OTHER:"その他" };

  const ANILIST_FULL_QUERY = `
    query ($search: String) {
      Media(search: $search, type: ANIME) {
        title { romaji native }
        bannerImage
        coverImage { extraLarge large }
        format episodes season seasonYear averageScore genres
        source popularity favourites

    query ($search: String) {
      Media(search: $search, type: ANIME) {
        title { romaji native }
        bannerImage
        coverImage { extraLarge large }
        format episodes season seasonYear averageScore genres
        externalLinks { site url }

  async function queryAniList(query, animeTitle) {
    const response = await fetchWithTimeout(ANILIST_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query, variables: { search: animeTitle } })
    }, 15000);

    const data = await response.json().catch(() => null);

    if (!response.ok || data?.errors) {
      const msg = data?.errors?.[0]?.message || `AniList HTTP ${response.status}`;
      throw new Error(msg);
    }

    return data?.data?.Media || null;
  }

  async function fetchAniListMedia(animeTitle) {
    let media;

    try {
      media = await queryAniList(ANILIST_FULL_QUERY, animeTitle);
    } catch (error) {
      console.error("AniList詳細クエリ失敗（基本クエリにフォールバック）:", error.message);
      media = await queryAniList(ANILIST_BASIC_QUERY, animeTitle);
    }

    if (!media) return null;

    const edges = media.characters?.edges || [];
    const seen = new Set();
    const chars = [];

    for (const edge of edges) {
      if (edge?.role !== "MAIN") continue;
      const node = edge?.node || {};
      const name = node?.name?.full || "";
      const native = node?.name?.native || "";
      const key = native || name;
      if (!key || seen.has(key)) continue;
      seen.add(key);
      chars.push({ id: node?.id || 0, name, native, img: node?.image?.large || null });
    }

    chars.sort((a, b) => a.id - b.id);

    return {
      native: media.title?.native || "",
      romaji: media.title?.romaji || "",
      banner: media.bannerImage || media.coverImage?.extraLarge || media.coverImage?.large || null,
      format: media.format, episodes: media.episodes, season: media.season,
      seasonYear: media.seasonYear, averageScore: media.averageScore,
      genres: media.genres || [],
      source: media.source || null,
      popularity: media.popularity || null,
      favourites: media.favourites || null,
      studios: (media.studios?.nodes || []).map(n => n?.name).filter(Boolean),
      staff: (media.staff?.edges || []).map(e => ({ role: e?.role || "", name: e?.node?.name?.native || e?.node?.name?.full || "" })).filter(s => s.name),
      relations: (media.relations?.edges || []).map(e => ({ type: e?.relationType || "", title: e?.node?.title?.native || e?.node?.title?.romaji || "" })).filter(r => r.title),
      links: media.externalLinks || [],
      chars
    };
  }

  function buildInfoRows(media) {

  function formatCharactersForPrompt(chars) {

  function parseCharacterDescs(text) {
    const map = new Map();
    let inSection = false;

    for (const raw of text.split("\n")) {
      const t = raw.trim();

      if (/^【.+】$/.test(t)) {
        inSection = t.includes("キャラ紹介");
        continue;
      }

      if (!inSection || !t) continue;

      const m = t.match(/^(.+?)\s*[/／]\s*(.+)$/);
      if (!m) continue;

      let name = m[1].trim();
      let reading = "";
      const rm = name.match(/^(.+?)[（(]([^)）]*)[)）]$/);

      if (rm) {
        name = rm[1].trim();
        reading = rm[2].trim();
      }

      map.set(name.replace(/\s+/g, ""), { desc: m[2].trim(), reading });
    }

    return map;
  }

  function sortCharsByDesc(chars, descMap) {
    const keys = [...descMap.keys()];

    const orderOf = (c) => {
      const native = (c.native || "").replace(/\s+/g, "");
      const full = (c.name || "").replace(/\s+/g, "");
      let i = native ? keys.indexOf(native) : -1;
      if (i === -1 && full) i = keys.indexOf(full);
      return i === -1 ? Number.MAX_SAFE_INTEGER : i;
    };

    return [...chars].sort((a, b) => orderOf(a) - orderOf(b));
  }

  function renderCharacterCards(chars, descMap = new Map()) {

    chars.forEach((c, i) => {

      if (c.img) {

        img.onerror = () => {
          img.remove();
          imgWrap.classList.add("no-img");

      const body = document.createElement("div");

      const entry = descMap.get((c.native || c.name).replace(/\s+/g, "")) || descMap.get(c.name.replace(/\s+/g, "")) || null;
      const desc = entry?.desc || "";
      const reading = entry?.reading || "";

      if (reading) {
        nameEl.textContent = `${c.native || c.name}(${reading})`;

      if (desc) {

      card.appendChild(imgWrap);

  function renderResult(text) {
    resultBox.innerHTML = "";
    let block = null;
    let blockIndex = 0;
    let swallow = false;

    const addBlock = (title) => {
      block = document.createElement("section");
      block.className = "block";
      block.style.animationDelay = `${blockIndex * 60}ms`;
      blockIndex++;

      if (title.includes("一言紹介")) {
        block.classList.add("block-intro");

      const h = document.createElement("h3");
      h.className = "res-h";
      const ico = document.createElement("span");

      ico.textContent = HEAD_ICON[title.replace(/[【】]/g, "")] || "📺";
      h.appendChild(ico);
      h.appendChild(document.createTextNode(title));
      block.appendChild(h);
      resultBox.appendChild(block);
    };

    for (const rawLine of text.split("\n")) {
      const t = rawLine.trim();

      if (!t) continue;

      if (/^【.+】$/.test(t)) {
        if (t.includes("キャラ紹介")) {
          block = null;
          swallow = true;
        } else {
          swallow = false;
          addBlock(t);
        }
        continue;
      }

      if (swallow) continue;

      if (!block) addBlock("【紹介】");

      if (/^[・\-•]/.test(t)) {
        let ul = block.lastElementChild;

        if (!ul || ul.tagName !== "UL") {
          ul = document.createElement("ul");
          ul.className = "res-ul";
          block.appendChild(ul);
        }

        const li = document.createElement("li");
        li.textContent = t.replace(/^[・\-•]\s*/, "");
        ul.appendChild(li);
      } else {
        const p = document.createElement("p");
        p.className = "res-p";
        p.textContent = t;
        block.appendChild(p);
      }
    }
  }

  function getSectionLines(text, heading) {
    const out = [];
    let on = false;

    for (const raw of text.split("\n")) {
      const t = raw.trim();
      if (/^【.+】$/.test(t)) { on = t.includes(heading); continue; }
      if (on && t) out.push(t);
    }

    return out;
  }

  function wrapCanvasText(ctx, text, maxWidth) {
    const lines = [];
    let line = "";

    for (const ch of [...(text || "")]) {
      if (ctx.measureText(line + ch).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else {
        line += ch;
      }
    }

    if (line) lines.push(line);
    return lines;
  }

  function loadImgSafe(url, timeoutMs = 5000) {
    return new Promise((resolve) => {
      if (!url) return resolve(null);

      const candidates = [
        url,
        `https://images.weserv.nl/?url=${encodeURIComponent(url.replace(/^https?:\/\//, ""))}`
      ];
      let idx = 0;

      const tryNext = () => {
        if (idx >= candidates.length) return resolve(null);
        const src = candidates[idx++];
        const img = new Image();
        let done = false;
        const finish = (v) => { if (!done) { done = true; v ? resolve(v) : tryNext(); } };
        img.crossOrigin = "anonymous";
        img.onload = () => finish(img);
        img.onerror = () => finish(null);
        setTimeout(() => finish(null), timeoutMs);
        img.src = src;
      };

      tryNext();
    });
  }

  function drawHeading(ctx, text, x, y) {
    ctx.fillStyle = "#ec4899";
    ctx.fillRect(x, y - 22, 6, 26);
    ctx.fillStyle = "#334155";
    ctx.font = "700 26px 'Noto Sans JP', sans-serif";
    ctx.fillText(text, x + 18, y);
    return y + 42;
  }

  function drawWrapped(ctx, text, x, y, maxW, lh, maxLines, maxY) {
    const all = wrapCanvasText(ctx, text, maxW);
    const lines = all.slice(0, maxLines);
    if (all.length > lines.length) lines[lines.length - 1] += "…";
    for (const line of lines) {
      if (y > maxY) break;
      ctx.fillText(line, x, y);
      y += lh;
    }
    return y;
  }

  async function generateShareImage() {
    if (!shareData) return;

    const { media, intro, synopsis, highlights, recommends, infoRows, officialUrl, charNames, portraits } = shareData;
    const W = 1920, H = 1080;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#f8f7ff");
    bg.addColorStop(0.6, "#f3eefe");
    bg.addColorStop(1, "#fdeef7");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const banner = await loadImgSafe(media?.banner);

    if (banner) {
      const scale = Math.max(W / banner.width, H / banner.height);
      const bw = banner.width * scale, bh = banner.height * scale;
      ctx.drawImage(banner, (W - bw) / 2, (H - bh) / 2, bw, bh);

      const veil = ctx.createLinearGradient(0, 0, 0, H);
      veil.addColorStop(0, "rgba(248,247,255,.62)");
      veil.addColorStop(0.45, "rgba(248,247,255,.86)");
      veil.addColorStop(0.8, "rgba(248,247,255,.97)");
      veil.addColorStop(1, "rgba(248,247,255,1)");
      ctx.fillStyle = veil;
      ctx.fillRect(0, 0, W, H);
    }

    const acc = ctx.createLinearGradient(90, 0, 700, 0);
    acc.addColorStop(0, "#8b5cf6");
    acc.addColorStop(1, "#ec4899");
    ctx.fillStyle = acc;
    ctx.fillRect(90, 78, 120, 8);

    ctx.fillStyle = "#0e7490";
    ctx.font = "700 24px 'Noto Sans JP', sans-serif";
    ctx.fillText("S P O I L E R - F R E E   A N I M E   G U I D E", 90, 128);

    ctx.textAlign = "right";
    ctx.fillStyle = "#667085";
    ctx.font = "700 26px 'Noto Sans JP', sans-serif";
    ctx.fillText("ネタバレなしアニメ紹介", W - 90, 118);
    ctx.textAlign = "left";

    ctx.fillStyle = "#1f2430";
    ctx.font = "900 64px 'Zen Old Mincho', serif";
    ctx.fillText(media?.native || media?.romaji || "", 90, 208);

    ctx.fillStyle = "#667085";
    ctx.font = "500 22px 'Noto Sans JP', sans-serif";
    ctx.fillText((media?.romaji || "").toUpperCase(), 92, 246);

    let cx = 90;
    const chipTexts = [];
    if (media?.seasonYear && media?.season) chipTexts.push(`${media.seasonYear}年${seasonJa(media.season)}`);
    if (media?.episodes) chipTexts.push(`全${media.episodes}話`);
    if (media?.format) chipTexts.push(formatJa(media.format));
    const scoreText = media?.averageScore ? `★ ${(media.averageScore / 10).toFixed(1)}` : "";
    ctx.font = "600 24px 'Noto Sans JP', sans-serif";

    for (const t of chipTexts) {
      const w = ctx.measureText(t).width + 36;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(cx, 272, w, 48, 24); else ctx.rect(cx, 272, w, 48);
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.fill();
      ctx.strokeStyle = "#e7e9f2";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "#47536b";
      ctx.fillText(t, cx + 18, 305);
      cx += w + 12;
    }

    if (scoreText) {
      const w = ctx.measureText(scoreText).width + 36;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(cx, 272, w, 48, 24); else ctx.rect(cx, 272, w, 48);
      const sg = ctx.createLinearGradient(cx, 0, cx + w, 0);
      sg.addColorStop(0, "#7c3aed");
      sg.addColorStop(1, "#ec4899");
      ctx.fillStyle = sg;
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.fillText(scoreText, cx + 18, 305);
    }

    ctx.font = "700 30px 'Noto Sans JP', sans-serif";
    const introLines = wrapCanvasText(ctx, intro, W - 270).slice(0, 2);
    const boxH = introLines.length * 46 + 34;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(90, 348, W - 180, boxH, 18); else ctx.rect(90, 348, W - 180, boxH);
    ctx.fillStyle = "rgba(255,255,255,.78)";
    ctx.fill();
    ctx.strokeStyle = "#e5defa";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#1f2430";
    introLines.forEach((l, i) => ctx.fillText(l, 130, 348 + 52 + i * 46));

    const colTop = 348 + boxH + 56;
    const colBottom = 930;

    let ly = drawHeading(ctx, "あらすじ", 90, colTop + 20);
    ctx.fillStyle = "#374151";
    ctx.font = "500 24px 'Noto Sans JP', sans-serif";

    for (const para of synopsis) {
      if (ly > colBottom) break;
      ly = drawWrapped(ctx, para, 90, ly, 900, 38, 12, colBottom);
      ly += 10;
    }

    if (ly + 80 <= colBottom) {
      ly = drawHeading(ctx, "こんな人におすすめ", 90, ly + 26);
      ctx.font = "500 22px 'Noto Sans JP', sans-serif";

      for (const rline of recommends.slice(0, 3)) {
        if (ly > colBottom) break;
        ctx.fillStyle = "#7c3aed";
        ctx.fillText("◆", 90, ly);
        ctx.fillStyle = "#4b5563";
        ly = drawWrapped(ctx, rline.replace(/^[・\-•]\s*/, ""), 124, ly, 866, 30, 2, colBottom);
        ly += 6;
      }
    }

    const RX = 1050, RW = 780;
    let ry = drawHeading(ctx, "見どころ", RX, colTop + 20);
    ctx.font = "500 22px 'Noto Sans JP', sans-serif";

    for (const hline of highlights.slice(0, 4)) {
      if (ry > colBottom) break;
      ctx.fillStyle = "#ec4899";
      ctx.fillText("★", RX, ry);
      ctx.fillStyle = "#4b5563";
      ry = drawWrapped(ctx, hline.replace(/^[・\-•]\s*/, ""), RX + 34, ry, RW - 40, 30, 2, colBottom);
      ry += 6;
    }

    if (ry + 60 <= colBottom && infoRows.length) {
      ry = drawHeading(ctx, "作品情報", RX, ry + 26);
      ctx.font = "500 20px 'Noto Sans JP', sans-serif";

      for (const [k, v] of infoRows.slice(0, 4)) {
        if (ry > colBottom) break;
        ctx.fillStyle = "#6b7280";
        ctx.fillText(k, RX, ry);
        ctx.fillStyle = "#374151";
        drawWrapped(ctx, v, RX + 130, ry, RW - 140, 28, 1, colBottom);
        ry += 30;
      }
    }

    const loadedPortraits = await Promise.all((portraits || []).slice(0, 6).map(u => loadImgSafe(u)));
    let px = 90;
    const py = H - 96;

    for (const p of loadedPortraits) {
      if (!p) continue;
      ctx.save();
      ctx.beginPath();
      ctx.arc(px + 40, py, 40, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(p, px, py - 40, 80, 80);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(px + 40, py, 40, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(124,58,237,.45)";
      ctx.lineWidth = 3;
      ctx.stroke();
      px += 94;
    }

    ctx.fillStyle = "#4b5563";
    ctx.font = "500 20px 'Noto Sans JP', sans-serif";
    const castX = px + 20;
    drawWrapped(ctx, charNames.slice(0, 8).join(" / "), castX, py - 8, W - 90 - castX, 30, 2, H - 40);

    if (officialUrl) {
      ctx.textAlign = "right";
      ctx.fillStyle = "#9ca3af";
      ctx.font = "500 18px 'Noto Sans JP', sans-serif";
      ctx.fillText(officialUrl, W - 90, H - 30);
      ctx.textAlign = "left";
    }

    try {
      const a = document.createElement("a");
      a.download = `${(media?.native || "anime").replace(/[\\/:*?"<>|]/g, "_")}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    } catch (error) {
      console.error(error);
      alert("画像の保存に失敗しました。");
    }
  }

  async function searchWikipedia(query) {
    const url = `https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=5&format=json&origin=*&srprop=snippet`;

    const response = await fetchWithTimeout(url, { method: "GET" }, 10000);

    let data = null;

    try {
      data = await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {
      const apiMessage = data?.error?.info || `HTTP ${response.status}`;
      throw new Error(apiMessage);
    }

    return data?.query?.search || [];
  }

  async function fetchJikanData(animeTitle) {
    const searchRes = await fetchWithTimeout(`${JIKAN_BASE}/anime?q=${encodeURIComponent(animeTitle)}&limit=1&sfw=true`, { method: "GET" }, 10000);

    if (!searchRes.ok) throw new Error(`Jikan HTTP ${searchRes.status}`);

    const searchData = await searchRes.json().catch(() => null);
    const anime = searchData?.data?.[0];

    if (!anime) return null;

    const result = {
      japaneseTitle: (anime.titles || []).find(t => t.type === "Japanese")?.title || anime.title || "",
      synopsis: anime.synopsis || "",
      characters: []
    };

    try {
      const charRes = await fetchWithTimeout(`${JIKAN_BASE}/anime/${anime.mal_id}/characters`, { method: "GET" }, 10000);

      if (charRes.ok) {
        const charData = await charRes.json().catch(() => null);
        result.characters = (charData?.data || [])
          .filter(e => e?.role === "Main")
          .slice(0, 10)
          .map(e => ({ name: e?.character?.name || "", kanji: e?.character?.name_kanji || "" }))
          .filter(c => c.name);
      }
    } catch (error) {
      console.error("Jikanキャラ取得失敗:", error.message);
    }

    return result;
  }

  function formatJikanForPrompt(j) {
    if (!j) return "";

    const parts = [];
    if (j.japaneseTitle) parts.push(`日本語タイトル: ${j.japaneseTitle}`);
    if (j.synopsis) parts.push(`synopsis(en): ${j.synopsis.slice(0, 1200)}`);
    if (j.characters.length) parts.push(`characters: ${j.characters.map(c => c.kanji ? `${c.name} (${c.kanji})` : c.name).join(", ")}`);
    return parts.join("\n");
  }

  async function getWikipediaSearchResults(animeTitle) {
    const normalizedTitle = animeTitle.trim();
    const queryWithAnime = normalizedTitle.includes("アニメ")
      ? normalizedTitle
      : `${normalizedTitle} アニメ`;

    let results = await searchWikipedia(queryWithAnime);

    if (!results.length) {
      results = await searchWikipedia(normalizedTitle);
    }

    return results;
  }

  function formatSearchResults(results) {
    if (!results.length) return "";

    return results.map((item, index) => {
      const title = item.title || "";
      const snippet = stripHtml(item.snippet || "").replace(/\s+/g, " ").trim();
      const url = item.pageid ? `https://ja.wikipedia.org/?curid=${item.pageid}` : "";

      return [
        `${index + 1}. タイトル: ${title}`,
        `   概要: ${snippet || "概要を取得できませんでした。"}`,
        url ? `   URL: ${url}` : ""
      ].filter(Boolean).join("\n");
    }).join("\n\n");
  }

  function buildPrompt(animeTitle, searchResultsText, charactersText, jikanText) {
    const lines = [
      "あなたはアニメ作品に詳しい紹介ライターです。",
      "以下のアニメについて、未視聴者向けに日本語でネタバレなしの紹介を作成してください。",
      "",
      "アニメ名:",
      animeTitle,
      "",
      "必須ルール:",
      "- 重大な結末、死亡、裏切り、犯人、どんでん返し、後半の重要な展開は書かないでください。",
      "- 登場人物の説明でもネタバレになる伏線や運命の確定は避けてください。",
      "- 作品を知らない人が「見るかどうか判断できる」情報に絞ってください。",
      "- 事実関係が不確実な場合は断定せず「要確認」と書いてください。",
      "- 存在しない作品や判断できない場合は、その旨を正直に書いてください。",
      "- 必ず日本語のみで回答してください。固有名詞は日本語表記を優先してください。",
      "- 登場するキャラクター名には、初出時のみひらがなで読みを括弧付けしてください。実在しない地名・造語・当て字など初見で読めない語にも初出時のみ読みを付けてください。",
      "- 2回目以降の登場には読みを付けないでください。日常的に読める一般的な語（雪、街、記憶など）には絶対に読みを付けないでください。",
      "- いきなり最終的な日本語出力だけを出力してください。",
      "- 【一言紹介】の行から直接始めてください。それより前に何も書かないでください。",
      "- 計画・思考過程・下書き・役割設定・確認事項を出力しないでください。",
      "- 出力は指定された見出しのみを使用してください。",
      "- 検索結果がある場合は、検索結果の表記と内容を優先してください。",
      "- AniListのキャラクター一覧がある場合は、登場人物の名前としてその表記を最優先で使ってください。"
    ];

    if (searchResultsText) {
      lines.push(
        "",
        "参考にできる検索結果:",
        searchResultsText,
        "",
        "検索結果を参考にする場合、検索結果にない情報を断定せず、不明な点は要確認としてください。",
        "検索結果にネタバレが含まれる可能性がある場合は、ネタバレ部分を無視してください。",
        "登場人物などの情報が検索結果に不足している場合は、自分の知識で補ってかまいません。その場合、不確実な情報には（要確認）を付けてください。"
      );
    }

    if (charactersText) {
      lines.push(
        "",
        "AniListのキャラクター一覧:",
        charactersText
      );
    }

    if (jikanText) {
      lines.push(
        "",
        "参考情報（MyAnimeList）:",
        jikanText,
        "",
        "上記は英語の参考情報です。事実関係の補強にのみ使い、出力は必ず日本語で書いてください。"
      );
    }

    lines.push(
      "",
      "出力形式:",
      "【一言紹介】",
      "物語・世界観・キャラクターの魅力が伝わるように1〜2文で端的に書いてください。監督・脚本・制作会社などの制作スタッフを主語にした文にしないでください。",
      "",
      "【あらすじ】",
      "冒頭〜序盤の設定を中心に、ネタバレなしで4〜6文で書いてください。",
      "",
      "【キャラ紹介】",
      "AniListのキャラクター一覧の各キャラについて、「キャラクター名（ひらがなの読み） / ネタバレなしの一行説明（約50文字）」の形式で1行ずつ書いてください。読みが分からない場合は名前だけでかまいません。",
      "順番は必ず主人公（最も中心的な人物）を1行目にし、その後は物語への重要度順にしてください。上記一覧の並び順には従わないでください。",
      "キャラクター名はAniListの表記をそのまま使ってください。説明にネタバレを含めないでください。",
      "",
      "【見どころ】",
      "作画、物語、キャラ、世界観など魅力を4〜5個の箇条書きで書いてください。",
      "",
      "【こんな人におすすめ】",
      "どんな気分や嗜好の人に向くか、3〜4個の箇条書きで書いてください。"
    );

    return lines.join("\n");
  }

  function extractModelText(data) {
    const candidate = data?.candidates?.[0];

    if (!candidate) {
      const blockReason = data?.promptFeedback?.blockReason;
      if (blockReason) {
        throw new Error(`安全性設定によりブロックされました: ${blockReason}`);
      }
      throw new Error("候補が返却されませんでした。");
    }

    const parts = candidate?.content?.parts;

    if (!Array.isArray(parts) || parts.length === 0) {
      throw new Error("本文が見つかりませんでした。");
    }

    return parts.map(part => part?.text ?? "").join("").trim();
  }

  function extractFinalJapanese(text) {
    const marker = "【一言紹介】";
    const requiredHeadings = ["【あらすじ】", "【キャラ紹介】", "【見どころ】", "【こんな人におすすめ】"];
    let best = -1;
    let searchFrom = 0;
    let idx = text.indexOf(marker, searchFrom);

    while (idx !== -1) {
      const rest = text.slice(idx);
      let prev = 0;
      let ok = true;

      for (const heading of requiredHeadings) {
        const pos = rest.indexOf(heading, prev);

        if (pos === -1) {
          ok = false;
          break;
        }

        prev = pos + heading.length;
      }

      if (ok) {
        best = idx;
      }

      searchFrom = idx + marker.length;
      idx = text.indexOf(marker, searchFrom);
    }

    const body = best !== -1 ? text.slice(best) : text;

    return body
      .split("\n")
      .map(line => line.trimStart())
      .join("\n")
      .trim();
  }

  async function generateAnimeIntro() {
    const apiKey = apiKeyInput.value.trim();
    const modelId = normalizeModelId(getEffectiveModelId());
    const apiBase = normalizeApiBase(apiBaseInput.value);
    const animeTitle = animeTitleInput.value.trim();

    resultBox.innerHTML = "";
    resultBox.classList.remove("filled");
    renderCharacterCards([]);
    resetMediaInfo();
    setGenerateStatus("");
    timerBox.hidden = true;
    saveImageButton.hidden = true;
    metaLine.hidden = true;
    shareData = null;
    stopTimer();

    if (!apiKey) {
      setGenerateStatus("APIキーがありません。右上の歯車から設定してください。", true);
      settingsDialog.showModal();
      return;
    }

    if (!animeTitle) {
      setGenerateStatus("アニメ名を入力してください。", true);
      return;
    }

    generateButton.disabled = true;
    startTimer();
    const totalStart = performance.now();
    let searchMs = null;
    let charMs = null;
    let jikanMs = null;
    let searchResultsText = "";
    let charactersText = "";
    let jikanText = "";
    let aniChars = [];
    let aniMedia = null;

    if (useSearchCheckbox.checked) {
      setGenerateStatus("Wikipedia検索中...");
      const searchStart = performance.now();

      try {
        const results = await getWikipediaSearchResults(animeTitle);
        searchResultsText = formatSearchResults(results);

        if (!searchResultsText) {
          setGenerateStatus("検索結果がなかったので、AIのみで生成します。");
        }
      } catch (error) {
        console.error(error);
        setGenerateStatus(`Wikipedia検索失敗: ${error.message}`, true);
      }

      searchMs = performance.now() - searchStart;
    }

    setGenerateStatus("Jikan（MyAnimeList）取得中...");
    const jikanStart = performance.now();

    try {
      jikanText = formatJikanForPrompt(await fetchJikanData(animeTitle));
    } catch (error) {
      console.error(error);
      setGenerateStatus(`Jikan取得に失敗したため、なしで続行します: ${error.message}`, true);
    }

    jikanMs = performance.now() - jikanStart;

    setGenerateStatus("AniList取得中...");
    const charStart = performance.now();

    try {
      const media = await fetchAniListMedia(animeTitle);

      if (media) {
        applyMediaInfo(media);
        aniMedia = media;
        aniChars = media.chars;
        charactersText = formatCharactersForPrompt(media.chars);

        if (!media.chars.length) {
          setGenerateStatus("AniListからキャラを取得できませんでした。");
        }
      } else {
        setGenerateStatus("AniListで作品が見つかりませんでした。");
      }
    } catch (error) {
      console.error(error);
      setGenerateStatus(`AniList取得失敗: ${error.message}`, true);
    }

    charMs = performance.now() - charStart;

    setGenerateStatus("AI生成中（数分かかる場合があります）...");
    const aiStart = performance.now();

    try {
      const url = `${apiBase}/models/${encodeURIComponent(modelId)}:generateContent?key=${encodeURIComponent(apiKey)}`;

      const response = await fetchWithTimeout(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: buildPrompt(animeTitle, searchResultsText, charactersText, jikanText)
                }
              ]
            }
          ],
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 8192
          }
        })
      }, 180000);

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        const apiMessage = data?.error?.message || `HTTP ${response.status}`;
        throw new Error(apiMessage);
      }

      const rawText = extractModelText(data);
      const text = extractFinalJapanese(rawText);
      const finishReason = data?.candidates?.[0]?.finishReason || "";
      const truncated = finishReason === "MAX_TOKENS";

      renderResult(text || "AIの応答が空でした。");
      const descMap = parseCharacterDescs(text);
      const sortedChars = sortCharsByDesc(aniChars, descMap);
      renderCharacterCards(sortedChars, descMap);
      appendInfoBlock(aniMedia);

      if (truncated) {
        const warn = document.createElement("p");
        warn.className = "res-p warn";
        warn.textContent = "（注意: 出力が途中で切れた可能性があります）";
        resultBox.appendChild(warn);
      }

      resultBox.classList.add("filled");

      const intro = getSectionLines(text, "一言紹介").join(" ") || getSectionLines(text, "紹介").join(" ");
      const highlights = getSectionLines(text, "見どころ");
      const charNames = sortedChars.map(c => c.native || c.name);
      const portraits = sortedChars.map(c => c.img).filter(Boolean);

      shareData = {
        media: aniMedia,
        intro,
        synopsis: getSectionLines(text, "あらすじ"),
        highlights,
        recommends: getSectionLines(text, "こんな人におすすめ"),
        infoRows: buildInfoRows(aniMedia),
        officialUrl: (aniMedia?.links || []).find(l => /official site/i.test(l.site || ""))?.url || "",
        charNames,
        portraits
      };
      saveImageButton.hidden = false;
      metaLine.hidden = false;

      const aiMs = performance.now() - aiStart;
      const totalMs = performance.now() - totalStart;
      const searchLabel = searchMs === null ? "検索 -" : `検索 ${formatDuration(searchMs)}`;
      const jikanLabel = `Jikan ${formatDuration(jikanMs)}`;
      const charLabel = `AniList ${formatDuration(charMs)}`;

      stopTimer();
      timerBox.textContent = `合計 ${formatDuration(totalMs)}`;
      setGenerateStatus(`生成しました。（${searchLabel} / ${jikanLabel} / ${charLabel} / AI ${formatDuration(aiMs)}）`, false, true);
    } catch (error) {
      const totalMs = performance.now() - totalStart;
      console.error("AI生成エラー:", error);
      resultBox.innerHTML = "";
      stopTimer();
      timerBox.textContent = `${formatDuration(totalMs)} で停止`;
      setGenerateStatus(`AI生成失敗: ${error.message}`, true);
    } finally {
      generateButton.disabled = false;
    }
  }

  openSettingsButton.addEventListener("click", () => settingsDialog.showModal());
  closeSettingsButton.addEventListener("click", () => settingsDialog.close());
  saveSettingsButton.addEventListener("click", saveSettings);
  generateButton.addEventListener("click", generateAnimeIntro);
  saveImageButton.addEventListener("click", generateShareImage);
  modelSelect.addEventListener("change", () => {
    syncModelInput();
    localStorage.setItem(STORAGE_KEYS.modelId, getEffectiveModelId());
  });

  animeTitleInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      generateAnimeIntro();
    }
  });

  loadSettings();
</script>
