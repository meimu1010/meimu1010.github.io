<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5/japanese-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5/japanese-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5/japanese-700.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Segoe UI Variable','Segoe UI','Noto Sans JP',sans-serif;font-size:14px;--accent:#0067c0;--taskbar-h:48px;
  --text:#1a1a1a;--win-bg:rgba(246,246,246,.92);--sys-bg:rgba(243,243,243,.86);--hover:rgba(0,0,0,.06);
  --border:rgba(0,0,0,.12);--sub:#5a5a5a;--input:rgba(255,255,255,.8);--shadow:0 12px 40px rgba(0,0,0,.28)}
body[data-theme="dark"]{--text:#f2f2f2;--win-bg:rgba(32,32,32,.9);--sys-bg:rgba(28,28,28,.86);--hover:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.14);--sub:#a5a5a5;--input:rgba(255,255,255,.08);--shadow:0 12px 40px rgba(0,0,0,.55)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--accent);color:#fff}

#wallpaper{position:fixed;inset:0;z-index:0;background:#0a1a33 center/cover no-repeat}

/* デスクトップアイコン */
#deskIcons{position:fixed;top:8px;left:8px;z-index:2;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;height:calc(100% - 70px);align-content:flex-start}
.dicon{width:84px;padding:8px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:1px solid transparent;user-select:none}
.dicon:hover{background:rgba(255,255,255,.14)}
.dicon.sel{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.dicon .di{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.dicon .di svg{width:100%;height:100%}
.dicon span.lb{color:#fff;font-size:12px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8);line-height:1.3;word-break:break-all}

/* ウィンドウ */
#winLayer{position:fixed;inset:0 0 var(--taskbar-h) 0;z-index:10;pointer-events:none}
.win{position:absolute;min-width:320px;min-height:200px;background:var(--win-bg);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;color:var(--text);pointer-events:auto;overflow:hidden}
.win.openAnim{animation:winIn .2s cubic-bezier(.2,.9,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .14s forwards}
@keyframes winOut{to{opacity:0;transform:scale(.95)}}
.win.anim{transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}
.win.min{opacity:0;transform:scale(.6) translateY(120px);transition:all .18s ease;pointer-events:none}
.win.focused{box-shadow:0 18px 60px rgba(0,0,0,.45);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tbar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:8px;padding-left:12px;user-select:none;cursor:default}
.tbar .ti{width:16px;height:16px}
.tbar .ti svg{width:100%;height:100%}
.tbar .tt{flex:1;font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;height:100%}
.tbtn{width:46px;height:100%;display:grid;place-items:center;color:var(--text)}
.tbtn:hover{background:var(--hover)}
.tbtn.close:hover{background:#e81123;color:#fff}
.win:not(.focused) .tbar{opacity:.75}
.wbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:9}
.rz[data-d="n"]{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz[data-d="s"]{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz[data-d="e"]{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz[data-d="w"]{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz[data-d="ne"]{top:-4px;right:-4px;width:12px;height:12px;cursor:nesw-resize}
.rz[data-d="nw"]{top:-4px;left:-4px;width:12px;height:12px;cursor:nwse-resize}
.rz[data-d="se"]{bottom:-4px;right:-4px;width:12px;height:12px;cursor:nwse-resize}
.rz[data-d="sw"]{bottom:-4px;left:-4px;width:12px;height:12px;cursor:nesw-resize}
body.dragging{user-select:none;cursor:default}
#snapPrev{position:fixed;z-index:9;display:none;background:color-mix(in srgb,var(--accent) 22%,transparent);border:2px solid var(--accent);border-radius:10px;transition:all .12s ease;pointer-events:none}

/* タスクバー */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);z-index:9000;background:var(--sys-bg);
  -webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 8px;color:var(--text)}
#tbCenter{display:flex;align-items:center;gap:4px;position:absolute;left:50%;transform:translateX(-50%);height:100%}
#startBtn{width:42px;height:40px;display:grid;place-items:center;border-radius:6px}
#startBtn:hover,#tbSearch:hover,.tb-btn:hover{background:var(--hover)}
#startBtn svg{width:22px;height:22px}
#tbSearch{height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:18px;background:var(--input);border:1px solid var(--border);font-size:12.5px;color:var(--sub);margin:0 6px}
.tb-btn{width:44px;height:40px;border-radius:6px;display:grid;place-items:center;position:relative}
.tb-btn .ind{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:var(--sub);transition:all .15s}
.tb-btn.open .ind{background:var(--sub)}
.tb-btn.active .ind{width:16px;background:var(--accent)}
.tb-btn.active{background:var(--hover)}
#tbRight{display:flex;align-items:center;height:100%;gap:2px;margin-left:auto}
#trayBtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:6px}
#trayBtn:hover,#tbClock:hover{background:var(--hover)}
#tbClock{height:38px;padding:0 10px;border-radius:6px;font-size:12px;line-height:1.5;text-align:right}
#showDesk{width:8px;height:100%;border-left:1px solid var(--border);margin-left:4px}
#showDesk:hover{background:var(--hover)}

/* スタートメニュー */
#startMenu{position:fixed;bottom:calc(var(--taskbar-h) + 10px);left:50%;transform:translateX(-50%) translateY(24px);width:600px;max-height:calc(100vh - 70px);
  z-index:9100;background:var(--sys-bg);-webkit-backdrop-filter:blur(40px) saturate(1.5);backdrop-filter:blur(40px) saturate(1.5);
  border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:24px 28px 0;display:none;flex-direction:column;color:var(--text);overflow:hidden}
#startMenu.show{display:flex;animation:smIn .2s cubic-bezier(.2,.9,.3,1)}
@keyframes smIn{from{opacity:0;transform:translateX(-50%) translateY(36px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#smSearch{height:36px;border-radius:18px;border:1px solid var(--border);background:var(--input);padding:0 16px;width:100%;outline:none;font-size:13px;color:var(--text)}
#smSearch:focus{border-color:var(--accent)}
.sm-h{font-size:13px;font-weight:700;margin:20px 4px 10px}
#smGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sm-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:6px;font-size:11.5px}
.sm-tile:hover{background:var(--hover)}
.sm-tile .aic{width:32px;height:32px}
.sm-tile .aic svg{width:100%;height:100%}
#smRec{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding-bottom:18px}
.sm-rec{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:12px;text-align:left}
.sm-rec:hover{background:var(--hover)}
.sm-rec .aic{width:26px;height:26px;flex:0 0 26px}
.sm-rec .aic svg{width:100%;height:100%}
.sm-rec small{display:block;color:var(--sub);font-size:11px}
#smFoot{margin:0 -28px;padding:12px 28px;background:rgba(0,0,0,.14);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)}
body[data-theme="dark"] #smFoot{background:rgba(0,0,0,.3)}
#smUser{display:flex;align-items:center;gap:10px;font-size:13px}
#smUser .av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
#smPower{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;position:relative}
#smPower:hover{background:var(--hover)}
#powerPop{position:absolute;bottom:44px;right:0;width:170px;background:var(--sys-bg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:none}
#powerPop.show{display:block}
#powerPop button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:5px;font-size:12.5px;text-align:left}
#powerPop button:hover{background:var(--hover)}

/* クイック設定 */
#quickPanel{position:fixed;bottom:calc(var(--taskbar-h) + 10px);right:10px;width:340px;z-index:9100;background:var(--sys-bg);
  -webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px;display:none;color:var(--text)}
#quickPanel.show{display:block;animation:qpIn .18s ease}
@keyframes qpIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.qs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.qs-t{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:6px;background:var(--input);border:1px solid var(--border);font-size:11px;color:var(--text)}
.qs-t.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qs-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.qs-row input[type=range]{flex:1;accent-color:var(--accent)}

/* コンテキストメニュー */
#ctxMenu{position:fixed;z-index:9500;min-width:220px;background:var(--sys-bg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:none;color:var(--text)}
#ctxMenu.show{display:block;animation:qpIn .12s ease}
#ctxMenu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:5px;font-size:12.5px;text-align:left}
#ctxMenu button:hover{background:var(--hover)}
#ctxMenu .sep{height:1px;background:var(--border);margin:4px 8px}

/* 通知 */
#toasts{position:fixed;right:14px;bottom:calc(var(--taskbar-h) + 14px);z-index:9600;display:flex;flex-direction:column;gap:10px}
.toast{width:340px;background:var(--sys-bg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:8px;
  box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;color:var(--text);animation:tIn .25s cubic-bezier(.2,.9,.3,1)}
@keyframes tIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.toast.out{animation:tOut .2s forwards}
@keyframes tOut{to{opacity:0;transform:translateX(60px)}}
.toast b{font-size:13px;display:block;margin-bottom:2px}
.toast p{font-size:12px;color:var(--sub);line-height:1.5}

#brightOv{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9990;transition:opacity .2s}
#nightOv{position:fixed;inset:0;background:rgba(255,147,41,.14);pointer-events:none;z-index:9989;display:none}

/* 電源 / 起動 / ロック */
#boot{position:fixed;inset:0;background:#000;z-index:9995;display:none;flex-direction:column;align-items:center;justify-content:center;gap:70px;transition:opacity .5s}
#boot.show{display:flex}
#boot.hide{opacity:0;pointer-events:none}
#bootLogo{display:grid;grid-template-columns:34px 34px;grid-template-rows:34px 34px;gap:5px}
#bootLogo div{background:#0078d4;border-radius:2px}
.spinRing{width:44px;height:44px;position:relative}
.spinRing i{position:absolute;inset:0;animation:spin 2.2s linear infinite}
.spinRing i::before{content:'';position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff}
.spinRing i:nth-child(2){animation-delay:.18s}.spinRing i:nth-child(3){animation-delay:.36s}
.spinRing i:nth-child(4){animation-delay:.54s}.spinRing i:nth-child(5){animation-delay:.72s}
@keyframes spin{to{transform:rotate(360deg)}}
#lock{position:fixed;inset:0;z-index:9980;background:#0a1a33 center/cover no-repeat;display:none;align-items:center;justify-content:center;flex-direction:column;transition:transform .5s cubic-bezier(.6,0,.3,1),opacity .5s;cursor:pointer}
#lock.show{display:flex}
#lock::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.25)}
#lock.hide{transform:translateY(-100%);opacity:.4}
#lockTop{display:flex;flex-direction:column;align-items:center;transition:transform .4s ease,opacity .4s}
#lock.stage2 #lockTop{transform:translateY(-46vh);opacity:0}
#lockClock{font-size:96px;font-weight:700;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.5)}
#lockDate{font-size:20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);margin-top:-6px}
#login{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock.stage2 #login{display:flex}
#login .av{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:40px;font-weight:700}
#login .un{color:#fff;font-size:17px}
#login .pwrow{display:flex;gap:6px}
#login input{width:220px;height:36px;border-radius:4px;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);color:#fff;padding:0 12px;outline:none;font-size:13px}
#login input:focus{border-color:#fff}
#login .go{width:36px;height:36px;border-radius:4px;background:rgba(255,255,255,.85);color:#111;display:grid;place-items:center}
#login .hint{color:rgba(255,255,255,.65);font-size:11.5px}
#poweroff{position:fixed;inset:0;background:#000;z-index:9996;display:none;align-items:center;justify-content:center;cursor:pointer}
#poweroff.show{display:flex}
#poweroff .pwr{width:64px;height:64px;color:#3a3a3a;transition:color .2s,transform .2s}
#poweroff:hover .pwr{color:#0078d4;transform:scale(1.06)}
#shutOv{position:fixed;inset:0;background:#000;z-index:9997;display:none;align-items:center;justify-content:center;flex-direction:column;gap:40px;color:#fff;font-size:15px}
#shutOv.show{display:flex}

/* アプリ共通 */
.abar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);flex:0 0 auto}
.abar button{padding:6px 10px;border-radius:5px;font-size:12px}
.abar button:hover{background:var(--hover)}
.astatus{padding:4px 12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;flex:0 0 auto}

.np-area{flex:1;resize:none;border:none;outline:none;background:transparent;color:var(--text);padding:12px 14px;font-size:14px;line-height:1.8;font-family:Consolas,'Noto Sans JP',monospace}

.calc{flex:1;display:flex;flex-direction:column;padding:10px;gap:6px;outline:none}
.c-expr{height:22px;text-align:right;font-size:13px;color:var(--sub);padding:0 6px;overflow:hidden}
.c-disp{height:56px;display:flex;align-items:center;justify-content:flex-end;font-size:36px;font-weight:500;padding:0 6px;overflow:hidden}
.c-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:4px}
.c-grid button{border-radius:5px;background:var(--input);font-size:15px;border:1px solid var(--border)}
.c-grid button:hover{background:var(--hover)}
.c-grid button.op{background:transparent}
.c-grid button.eq{background:var(--accent);color:#fff;border-color:var(--accent)}

.term{flex:1;background:#0c0c0c;color:#cccccc;font-family:Consolas,'Courier New',monospace;font-size:13px;padding:10px;overflow-y:auto;cursor:text}
.term .t-line{display:flex;gap:6px;align-items:center}
.term input{flex:1;background:transparent;border:none;outline:none;color:inherit;font:inherit}
.t-prompt{color:#61d4ff;white-space:pre}

.ex{flex:1;display:flex;overflow:hidden}
.ex-side{width:170px;border-right:1px solid var(--border);padding:8px 4px;overflow-y:auto;flex:0 0 auto}
.ex-side button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 12px;border-radius:5px;font-size:12.5px;text-align:left}
.ex-side button:hover{background:var(--hover)}
.ex-side button.on{background:var(--hover)}
.ex-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ex-items{flex:1;overflow-y:auto;padding:10px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.ex-it{width:92px;padding:10px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-align:center;cursor:default}
.ex-it:hover{background:var(--hover)}
.ex-it.sel{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.ex-it .fi{width:36px;height:36px}
.ex-it .fi svg{width:100%;height:100%}
.ex-it .fn{word-break:break-all;line-height:1.35}
.ex-crumb{display:flex;align-items:center;gap:2px;flex:1;padding:0 8px;font-size:12.5px;overflow:hidden}
.ex-crumb button{padding:4px 7px;border-radius:4px;display:flex;align-items:center;gap:5px}
.ex-crumb button:hover{background:var(--hover)}

.br-bar{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--border)}
.br-bar button{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text)}
.br-bar button:hover{background:var(--hover)}
.br-addr{flex:1;height:32px;border-radius:16px;border:1px solid var(--border);background:var(--input);padding:0 16px;font-size:12.5px;outline:none;color:var(--text)}
.br-addr:focus{border-color:var(--accent)}
.br-load{height:3px;background:transparent;position:relative;overflow:hidden;flex:0 0 3px}
.br-load.on::before{content:'';position:absolute;inset:0;background:var(--accent);animation:load .5s ease}
@keyframes load{from{transform:translateX(-100%)}to{transform:none}}
.br-page{flex:1;overflow-y:auto;padding:28px 36px}
.br-page h1{font-size:26px;margin-bottom:16px}
.br-page h2{font-size:17px;margin:18px 0 8px}
.br-page p{line-height:1.9;margin:8px 0;color:var(--sub)}
.br-page a{color:var(--accent);cursor:pointer;text-decoration:none}
.br-page a:hover{text-decoration:underline}
.br-res{margin:14px 0}
.br-res .u{font-size:12px;color:#4a9e5c}
.br-quick{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.br-qt{width:96px;padding:16px 8px;border-radius:10px;background:var(--input);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12px;color:var(--text)}
.br-qt:hover{border-color:var(--accent)}

.set{flex:1;display:flex;overflow:hidden}
.set-side{width:190px;padding:10px 6px;border-right:1px solid var(--border);flex:0 0 auto}
.set-side button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:5px;font-size:12.5px;text-align:left}
.set-side button:hover{background:var(--hover)}
.set-side button.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.set-main{flex:1;overflow-y:auto;padding:22px 26px}
.set-main h1{font-size:22px;margin-bottom:18px}
.set-card{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.set-card .lab b{font-size:13px;display:block}
.set-card .lab small{color:var(--sub);font-size:11.5px}
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.wp-th{height:90px;border-radius:8px;background-size:cover;background-position:center;border:2px solid transparent;cursor:pointer}
.wp-th.on{border-color:var(--accent)}
.acc-row{display:flex;gap:10px;flex-wrap:wrap}
.acc{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.acc.on{border-color:var(--text)}

.pt-tools{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.pt-tools .sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.pt-tools .sw.on{border-color:var(--text)}
.pt-tools input[type=range]{width:90px;accent-color:var(--accent)}
.pt-tools button{padding:6px 10px;border-radius:5px;font-size:12px}
.pt-tools button:hover{background:var(--hover)}
.pt-tools button.on{background:var(--accent);color:#fff}
#ptCanvas{flex:1;cursor:crosshair;background:#fff;touch-action:none}

.tm{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px}
.tm table{width:100%;border-collapse:collapse;font-size:12px}
.tm th{text-align:left;padding:7px 10px;color:var(--sub);font-weight:500;border-bottom:1px solid var(--border)}
.tm td{padding:6px 10px;border-bottom:1px solid var(--border)}
.tm tr.row:hover td{background:var(--hover)}
.tm .kill{padding:3px 10px;border-radius:4px;background:var(--input);border:1px solid var(--border);font-size:11px}
.tm .kill:hover{background:#e81123;color:#fff;border-color:#e81123}

.ph-grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.ph-th{height:100px;border-radius:8px;background-size:cover;background-position:center;cursor:pointer;border:2px solid transparent}
.ph-th:hover{border-color:var(--accent)}
.ph-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
.ph-view img{max-width:100%;max-height:calc(100% - 60px);border-radius:8px;object-fit:contain}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub)}
.empty .ei{width:56px;height:56px;opacity:.6}
.empty .ei svg{width:100%;height:100%}
</style>
</head>

let wid=0,Z=100;const wins=[];
const W_MIN='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.1"/></svg>';

const W_RES='<svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="3.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M4 3.5V1.5h6.5V8H8.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>';
const W_CLS='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.1"/></svg>';
function getFocused(){return wins.find(w=>w.el.classList.contains('focused'))}
function setMaxIcon(w){w.el.querySelector('.tbtn.max').innerHTML=(w.max||w.snap)?W_RES:W_MAX;}
function createWin(o){
  const w={id:++wid,app:o.app,title:o.title,icon:o.icon,min:false,max:false,snap:null,prev:null,onClose:o.onClose};
  const el=document.createElement('div');el.className='win openAnim';w.el=el;
  const W=o.w||560,H=o.h||400,off=(wins.length%6)*28;
  el.style.width=W+'px';el.style.height=H+'px';
  el.style.left=clamp((innerWidth-W)/2-80+off,8,Math.max(8,innerWidth-W-8))+'px';
  el.style.top=clamp((innerHeight-48-H)/2-50+off*.7,8,Math.max(8,innerHeight-48-H-8))+'px';
  el.innerHTML=`<div class="tbar"><span class="ti">${icon(w.icon,16)}</span><span class="tt">${esc(w.title)}</span>
    <div class="tbtns"><button class="tbtn min" title="最小化">${W_MIN}</button><button class="tbtn max" title="最大化">${W_MAX}</button><button class="tbtn close" title="閉じる">${W_CLS}</button></div></div>
    <div class="wbody"></div>`+['n','s','e','w','ne','nw','se','sw'].map(d=>`<div class="rz" data-d="${d}"></div>`).join('');
  w.body=el.querySelector('.wbody');
  $('#winLayer').appendChild(el);
  el.addEventListener('pointerdown',()=>focusWin(w));
  el.querySelector('.tbtn.min').onclick=e=>{e.stopPropagation();minimizeWin(w)};
  el.querySelector('.tbtn.max').onclick=e=>{e.stopPropagation();toggleMax(w)};
  el.querySelector('.tbtn.close').onclick=e=>{e.stopPropagation();closeWin(w)};
  el.querySelector('.tbar').addEventListener('dblclick',e=>{if(!e.target.closest('.tbtns'))toggleMax(w)});
  initDrag(w);initResize(w);
  wins.push(w);ensureTbBtn(w.app);focusWin(w);
  setTimeout(()=>el.classList.remove('openAnim'),240);
  return w;
}
function focusWin(w){wins.forEach(x=>x.el.classList.remove('focused'));w.el.classList.add('focused');w.el.style.zIndex=++Z;refreshTaskbar();}
function minimizeWin(w){w.min=true;clearTimeout(w.minT);w.el.classList.add('min');w.minT=setTimeout(()=>{w.el.style.display='none'},190);refreshTaskbar();}
function restoreWin(w){if(!w.min)return;w.min=false;clearTimeout(w.minT);w.el.style.display='';void w.el.offsetWidth;w.el.classList.remove('min');}
function currentRect(w){return{x:w.el.offsetLeft,y:w.el.offsetTop,w:w.el.offsetWidth,h:w.el.offsetHeight}}
function setRect(w,r){w.el.style.left=r.x+'px';w.el.style.top=r.y+'px';w.el.style.width=r.w+'px';w.el.style.height=r.h+'px';}
function toggleMax(w){
  w.el.classList.add('anim');setTimeout(()=>w.el.classList.remove('anim'),220);
  if(w.max||w.snap){setRect(w,w.prev||{x:80,y:60,w:560,h:400});w.max=false;w.snap=null;w.prev=null;}
  else{w.prev=currentRect(w);setRect(w,{x:0,y:0,w:innerWidth,h:innerHeight-48});w.max=true;w.snap=null;}
  setMaxIcon(w);focusWin(w);
}
function snapWin(w,kind){
  w.el.classList.add('anim');setTimeout(()=>w.el.classList.remove('anim'),220);
  if(!w.prev)w.prev=currentRect(w);
  w.max=false;
  if(kind==='T'){setRect(w,{x:0,y:0,w:innerWidth,h:innerHeight-48});w.max=true;}
  else if(kind==='L')setRect(w,{x:0,y:0,w:innerWidth/2,h:innerHeight-48});
  else setRect(w,{x:innerWidth/2,y:0,w:innerWidth/2,h:innerHeight-48});
  w.snap=kind==='T'?null:kind;setMaxIcon(w);focusWin(w);
}
function closeWin(w){
  w.el.classList.add('closing');
  setTimeout(()=>{w.el.remove();const i=wins.indexOf(w);if(i>-1)wins.splice(i,1);
    if(!wins.some(x=>x.app===w.app)){const b=$('#tbApps').querySelector(`[data-app="${w.app}"]`);if(b)b.remove();}
    if(w.onClose)w.onClose();refreshTaskbar();},140);
}
function closeAll(){[...wins].forEach(closeWin);}
function initDrag(w){
  const tb=w.el.querySelector('.tbar');
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('.tbtns')||e.button!==0)return;
    focusWin(w);
    if(w.max||w.snap){
      const ratio=e.clientX/innerWidth;
      const pw=w.max?560:(w.prev?w.prev.w:560),ph=w.max?400:(w.prev?w.prev.h:400);
      setRect(w,{x:e.clientX-pw*ratio,y:Math.max(0,e.clientY-19),w:pw,h:ph});
      w.max=false;w.snap=null;w.prev=null;setMaxIcon(w);
    }
    const r=currentRect(w),sx=e.clientX,sy=e.clientY;
    document.body.classList.add('dragging');tb.setPointerCapture(e.pointerId);
    const sp=$('#snapPrev');
    const mv=ev=>{
      let nx=r.x+ev.clientX-sx,ny=r.y+ev.clientY-sy;
      ny=clamp(ny,0,innerHeight-48-34);
      setRect(w,{x:nx,y:ny,w:r.w,h:r.h});
      let kind=null;
      if(ev.clientY<=4)kind='T';else if(ev.clientX<=4)kind='L';else if(ev.clientX>=innerWidth-4)kind='R';
      if(kind){sp.style.display='block';
        if(kind==='T')Object.assign(sp.style,{left:'8px',top:'8px',width:innerWidth-16+'px',height:innerHeight-48-16+'px'});
        else if(kind==='L')Object.assign(sp.style,{left:'8px',top:'8px',width:innerWidth/2-12+'px',height:innerHeight-48-16+'px'});
        else Object.assign(sp.style,{left:innerWidth/2+4+'px',top:'8px',width:innerWidth/2-12+'px',height:innerHeight-48-16+'px'});
        sp.dataset.kind=kind;
      }else sp.style.display='none';
    };
    const up=()=>{tb.releasePointerCapture(e.pointerId);document.body.classList.remove('dragging');
      if(sp.style.display==='block'){snapWin(w,sp.dataset.kind);sp.style.display='none';}
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
function initResize(w){
  w.el.querySelectorAll('.rz').forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      e.stopPropagation();focusWin(w);if(w.max)return;
      const d=h.dataset.d,r0=currentRect(w),sx=e.clientX,sy=e.clientY;
      document.body.classList.add('dragging');h.setPointerCapture(e.pointerId);
      const mv=ev=>{
        const dx=ev.clientX-sx,dy=ev.clientY-sy;let{x,y,w:W,h:H}=r0;
        if(d.includes('e'))W=r0.w+dx;
        if(d.includes('s'))H=r0.h+dy;
        if(d.includes('w')){W=r0.w-dx;x=r0.x+dx;if(W<320){x-=(320-W);W=320;}}
        if(d.includes('n')){H=r0.h-dy;y=r0.y+dy;if(H<200){y-=(200-H);H=200;}}
        setRect(w,{x,y,w:Math.max(320,W),h:Math.max(200,H)});
      };
      const up=()=>{document.body.classList.remove('dragging');h.releasePointerCapture(e.pointerId);
        document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });
  });
}

  const show=()=>{disp.textContent=expr?expr.replace(/\*/g,'×').replace(/\//g,'÷'):'0';disp.style.fontSize=expr.length>14?'22px':'36px';};
  const calc=()=>{try{const s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;
    const r=Function('"use strict";return('+s+')')();if(!isFinite(r))throw 0;ex.textContent=expr+' =';expr=String(Math.round(r*1e10)/1e10);}catch(e){ex.textContent='エラー';expr='';}show();};

defApp('taskmgr','タスクマネージャー','taskmgr',640,480,w=>{
  w.body.innerHTML=`<div class="tm"><div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><b style="font-size:14px">タスクマネージャー</b><canvas class="spark" width="220" height="40" style="border:1px solid var(--border);border-radius:6px;background:var(--input)"></canvas><span class="cpu-l" style="font-size:12px;color:var(--sub)">CPU 0%</span></div>
  <div style="flex:1;overflow-y:auto"><table><thead><tr><th>名前</th><th>CPU</th><th>メモリ</th><th></th></tr></thead><tbody></tbody></table></div></div>`;
  const tb=w.body.querySelector('tbody'),spark=w.body.querySelector('.spark'),sctx=spark.getContext('2d');
  const cpuHist=new Array(55).fill(3);
  const base=[['System',.1,12],['Registry',0,8],['explorer.exe',.6,92],['dwm.exe',1.1,64],['SearchApp.exe',.3,41],['サービス ホスト: Windows Update',.2,28]];
  function renderRows(){
    const appRows=wins.map(x=>({label:APPS[x.app].title,cpu:Math.random()*3+.5,mem:Math.random()*180+60,win:x}));
    const all=[...base.map(b=>({label:b[0],cpu:b[1]+Math.random()*.4,mem:b[2],win:null})),...appRows];
    let tot=2;all.forEach(p=>tot+=p.cpu);
    tb.innerHTML=all.map(p=>`<tr class="row"><td>${p.label}</td><td>${p.cpu.toFixed(1)}%</td><td>${p.mem.toFixed(0)} MB</td><td>${p.win?`<button class="kill" data-w="${p.win.id}">タスクの終了</button>`:''}</td></tr>`).join('');
    w.body.querySelector('.cpu-l').textContent=`CPU ${tot.toFixed(1)}%`;
    cpuHist.push(clamp(tot,0,100));cpuHist.shift();
    sctx.clearRect(0,0,220,40);sctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent')||'#0067c0';sctx.beginPath();
    cpuHist.forEach((v,i)=>{const x=i*(220/54),y=38-v/100*36;i?sctx.lineTo(x,y):sctx.moveTo(x,y)});sctx.stroke();
  }
  renderRows();
  const iv=setInterval(renderRows,1000);
  tb.onclick=e=>{const k=e.target.closest('.kill');if(k){const x=wins.find(v=>v.id==k.dataset.w);if(x){closeWin(x);}}}
  w.onClose=()=>clearInterval(iv);
},{single:true});

defApp('photos','フォト','photos',640,460,(w,o)=>{
  let view=o.index??null;
  function render(){
    if(view===null)w.body.innerHTML=`<div class="abar"><b style="padding:0 8px;font-size:13px">コレクション</b></div><div class="ph-grid">${WALLS.map((x,i)=>`<div class="ph-th" data-i="${i}" style="background-image:url(${x.url})" title="${x.name}"></div>`).join('')}</div>`;
    else w.body.innerHTML=`<div class="abar"><button data-b>← 戻る</button><b style="font-size:13px">wallpaper_0${view+1}.jpg</b><span style="flex:1"></span><button data-set>背景として設定</button></div>
      <div class="ph-view"><img src="${WALLS[view].url}"></div>`;
    w.body.querySelectorAll('.ph-th').forEach(t=>t.onclick=()=>{view=+t.dataset.i;render();});
    const b=w.body.querySelector('[data-b]');if(b)b.onclick=()=>{view=null;render();};
    const s=w.body.querySelector('[data-set]');if(s)s.onclick=()=>{wallIdx=view;applyWall();toast('photos','個人用設定','デスクトップの背景を設定しました。');};
  }
  render();
});

defApp('recycle','ごみ箱','recycle',560,380,w=>{

  w.body.querySelectorAll('.abar button').forEach(b=>b.onclick=()=>{});
});

function openApp(id,opts={}){
  const A=APPS[id];if(!A)return;
  if(A.single){const ex=wins.find(x=>x.app===id);if(ex){restoreWin(ex);focusWin(ex);return ex;}}
  const w=createWin({app:id,title:A.title,icon:A.icon,w:A.w,h:A.h});
  A.launch(w,opts);addRecent(id);refreshTaskbar();
  return w;
}
