<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epic Account Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf0;--ink:#111c26;--sub:#5a6b7a;--band:#0f2236;--acc:#1f4fe0;--line:#c9d2da;--ok:#12805c;--ng:#b3261e;--panel:#f7f9fa}
@media(prefers-color-scheme:dark){:root{--bg:#0b141d;--ink:#e6edf3;--sub:#8fa3b5;--band:#060d14;--acc:#6b93ff;--line:#223445;--panel:#101c27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Schibsted Grotesk",system-ui,sans-serif}
header{background:var(--band);color:#fff;padding:40px 20px 32px}
.wrap{max-width:860px;margin:0 auto}
h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.02em}
header p{margin:0 0 20px;color:#a9bccd}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-family:"JetBrains Mono",monospace;padding:12px 14px;border:2px solid transparent;border-radius:6px;background:#fff;color:#111c26}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;padding:12px 22px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
main{padding:24px 20px 60px}
section{margin:0 0 28px;padding-left:16px;border-left:4px solid var(--acc)}
h2{margin:0 0 10px;font-size:18px}
dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:4px 16px;margin:0}
dt{color:var(--sub)}
dd{margin:0;word-break:break-all;font-family:"JetBrains Mono",monospace;font-size:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:"JetBrains Mono",monospace}
th{color:var(--sub);font-weight:600}
.msg{padding:12px 14px;border-radius:6px;background:var(--panel)}
.err{color:var(--ng)}
.warn{color:var(--sub);font-size:14px}
pre{margin:8px 0 0;padding:12px;background:var(--panel);border-radius:6px;overflow:auto;max-height:420px;font:13px/1.5 "JetBrains Mono",monospace}
details{margin:0 0 12px}
summary{cursor:pointer;font-weight:600}
.copy{margin-left:8px;padding:2px 10px;font-size:13px;background:transparent;color:var(--acc);border:1px solid var(--acc)}
@media(max-width:560px){form{flex-direction:column}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Epic Account Lookup</h1>
  <p>表示名(16文字以内)またはアカウントID(32桁)で検索</p>
  <form id="f">
    <input id="q" autocomplete="off" spellcheck="false" placeholder="例: Ninja / 32桁のアカウントID" aria-label="表示名またはアカウントID" required>
    <button id="b">検索</button>
  </form>
</div></header>
<main><div class="wrap" id="out"></div></main>
<script>
const $ = (s) => document.querySelector(s);
const out = $('#out');
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.flat().forEach((k) => e.append(k));
  return e;
};
const fmt = (v) => v === null || v === undefined ? '—' : typeof v === 'object' ? JSON.stringify(v) : String(v);

function kv(obj) {
  const dl = el('dl');
  for (const [k, v] of Object.entries(obj)) {
    if (v && typeof v === 'object' && !Array.isArray(v)) continue;
    dl.append(el('dt', { textContent: k }), el('dd', { textContent: fmt(v) }));
  }
  return dl;
}
function sec(title, ...body) { return el('section', {}, el('h2', { textContent: title }), ...body); }
function copyBtn(text) {
  const b = el('button', { type: 'button', className: 'copy', textContent: 'コピー' });
  b.onclick = async () => { await navigator.clipboard.writeText(text); b.textContent = 'コピー済み'; setTimeout(() => (b.textContent = 'コピー'), 1200); };
  return b;
}
function table(rows, cols, firstLabel) {
  const t = el('table');
  t.append(el('thead', {}, el('tr', {}, el('th', { textContent: firstLabel }), cols.map((c) => el('th', { textContent: c })))));
  const tb = el('tbody');
  for (const [name, o] of Object.entries(rows)) tb.append(el('tr', {}, el('td', { textContent: name }), cols.map((c) => el('td', { textContent: fmt(o[c]) }))));
  t.append(tb);
  return el('div', { className: 'tw' }, t);
}
function raw(title, data) {
  const s = JSON.stringify(data, null, 2);
  return el('details', {}, el('summary', { textContent: title }, copyBtn(s)), el('pre', { textContent: s }));
}

function render(d) {
  out.replaceChildren();
  const a = d.account;
  const idRow = el('dl', {}, el('dt', { textContent: 'アカウントID' }), el('dd', { textContent: a.id }, copyBtn(a.id)));
  out.append(sec('アカウント', idRow, kv({ displayName: a.displayName, ...Object.fromEntries(Object.entries(a).filter(([k]) => !['id', 'displayName', 'externalAuths'].includes(k))) })));

  const ext = a.externalAuths && Object.keys(a.externalAuths).length;
  out.append(sec('連携アカウント', ext ? raw('externalAuths', a.externalAuths) : el('p', { className: 'warn', textContent: '公開情報として取得できませんでした(非公開、または認証トークンの権限不足)。' })));

  const fa = d.fortniteApi;
  if (fa) {
    const bp = fa.battlePass || {};
    const ov = (fa.stats && fa.stats.all && fa.stats.all.overall) || {};
    out.append(sec('バトルパス / 総合 (fortnite-api.com)', kv({ ...bp, ...ov })));
  }

  if (d.stats) {
    const s = d.stats.summary;
    const lv = s.latestSeasonLevel;
    out.append(sec('統計サマリー (Epic statsproxy)', kv({ ...s.totals, 最新シーズンBPレベル: lv ? `S${lv.season}: Lv${lv.level}` : null, 取得キー数: d.stats.rawKeyCount })));
    const cols = ['matchesplayed', 'placetop1', 'kills', 'kd', 'minutesplayed', 'score'];
    if (Object.keys(s.byMode).length) out.append(sec('モード別', table(s.byMode, cols, 'playlist')));
    if (Object.keys(s.byInput).length) out.append(sec('入力デバイス別', table(s.byInput, cols, 'input')));
    out.append(raw('stats 生データ', d.stats.raw));
  }

  if (d.errors.length) out.append(el('p', { className: 'warn', textContent: '取得できなかった項目: ' + d.errors.join(' / ') }));
  out.append(raw('全レスポンス(JSON)', d));
}

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return;
  $('#b').disabled = true;
  out.replaceChildren(el('p', { className: 'msg', textContent: '検索中…' }));
  try {
    const r = await fetch('/api/lookup?q=' + encodeURIComponent(q));
    const d = await r.json();
    if (!r.ok) out.replaceChildren(el('p', { className: 'msg err', textContent: d.error || `エラー (${r.status})` }), d.detail ? raw('詳細', d.detail) : '');
    else render(d);
  } catch (err) {
    out.replaceChildren(el('p', { className: 'msg err', textContent: '通信に失敗しました: ' + err.message }));
  } finally {
    $('#b').disabled = false;
  }
});
</script>
</body>
</html>
