<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全自動人狼 Ver5.9 - Gemini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== デザイントークン（ライトモード） ===== */
        :root {
            --bg: #eef1f6;
            --surface: #ffffff;
            --surface-2: #f7f9fc;
            --surface-3: #eef3f9;
            --border: #e2e8f0;
            --border-strong: #c9d4e0;
            --text: #16233a;
            --text-2: #44546a;
            --text-3: #7a8aa0;
            --accent: #3b5bdb;          /* インディゴ */
            --accent-soft: #e8edfc;
            --accent-hover: #2f49b8;
            --success: #1f8a5b;
            --success-soft: #e2f4ec;
            --warning: #b07514;
            --warning-soft: #fdf3dd;
            --danger: #c0392b;
            --danger-soft: #fbe9e7;
            --purple: #6d3bbf;
            --purple-soft: #f0e8fb;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-card: 0 1px 3px rgba(16,30,54,0.06), 0 4px 14px rgba(16,30,54,0.05);
            --shadow-lift: 0 4px 10px rgba(16,30,54,0.08), 0 12px 28px rgba(16,30,54,0.09);
            --shadow-app: 0 8px 30px rgba(16,30,54,0.07), 0 2px 8px rgba(16,30,54,0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 15% 0%, rgba(59,91,219,0.05), transparent 40%),
                              radial-gradient(circle at 85% 100%, rgba(176,117,20,0.04), transparent 40%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 20px 16px;
        }
        #app {
            max-width: 1280px; margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-app);
            border: 1px solid rgba(226,232,240,0.8);
            padding: 26px 34px 30px;
        }
        @media (max-width:600px){ #app { padding:16px 14px; border-radius:18px; } }

        /* ===== ヘッダー ===== */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .app-header h1 {
            font-weight: 800; font-size: 1.55rem; letter-spacing: -0.01em;
            color: var(--text); display: flex; align-items: center; gap: 10px;
        }
        .app-header h1 i { color: var(--warning); }
        .app-header h1 .ver { font-size: 0.62rem; font-weight: 600; color: var(--text-3); background: var(--surface-3); padding: 3px 10px; border-radius: 999px; }
        .app-header .sub {
            font-weight: 500; color: var(--text-2); font-size: 0.78rem;
            background: var(--surface-3); border: 1px solid var(--border);
            padding: 4px 14px; border-radius: 999px; margin-top: 6px; display: inline-block;
        }
        .api-area { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .api-area input {
            border: 1.5px solid var(--border); border-radius: 999px;
            padding: 8px 16px; font-size: 0.85rem; width: 200px;
            background: var(--surface-2); color: var(--text); transition: 0.2s;
            font-family: inherit;
        }
        .api-area input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(59,91,219,0.12); background: #fff; }
        .api-area .status { font-size: 0.75rem; color: var(--success); font-weight: 600; }

        /* ===== タブ ===== */
        .tabs {
            display: flex; gap: 4px;
            background: var(--surface-3); border: 1px solid var(--border);
            border-radius: 999px; padding: 4px; margin-bottom: 22px;
        }
        .tab-btn {
            flex: 1; padding: 9px 16px; border: none; background: transparent;
            border-radius: 999px; font-weight: 600; font-size: 0.9rem;
            color: var(--text-3); cursor: pointer; transition: 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 7px;
            font-family: inherit;
        }
        .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(16,30,54,0.08); }
        .tab-btn:hover:not(.active) { color: var(--text-2); background: rgba(255,255,255,0.6); }
        .tab-pane { display: none; animation: fadeUp 0.3s ease; }
        .tab-pane.active { display: block; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(6px);} 100%{opacity:1;transform:translateY(0);} }

        /* ===== ボタン ===== */
        .btn {
            border: none; border-radius: 999px; padding: 9px 22px;
            font-weight: 600; font-size: 0.85rem;
            display: inline-flex; align-items: center; gap: 7px;
            cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(59,91,219,0.25); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #177048; box-shadow: 0 4px 12px rgba(31,138,91,0.25); }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-warning:hover { background: #94630f; box-shadow: 0 4px 12px rgba(176,117,20,0.25); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #a02e21; box-shadow: 0 4px 12px rgba(192,57,43,0.25); }
        .btn-outline { background: var(--surface); border: 1.5px solid var(--border-strong); color: var(--text-2); }
        .btn-outline:hover { background: var(--surface-3); border-color: #a9b8c8; }
        .btn-sm { padding: 6px 14px; font-size: 0.78rem; }
        .btn-copy {
            background: var(--warning-soft); color: var(--warning);
            border: 1px solid #ecd9ae;
            border-radius: 999px; padding: 6px 14px; font-size: 0.75rem;
            font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .btn-copy:hover { background: #f7e8c8; }

        /* ===== キャラフォーム ===== */
        .char-form-area {
            background: var(--surface-2); border-radius: var(--radius-md);
            padding: 20px; border: 1.5px solid var(--border);
            margin-bottom: 22px; transition: border-color 0.3s, box-shadow 0.3s;
        }
        .char-form-area.editing { border-color: var(--warning); box-shadow: 0 0 0 3px rgba(176,117,20,0.10); }
        .char-form-area .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .char-form-area .form-row .full { grid-column: 1/-1; }
        .char-form-area label { display: block; font-size: 0.73rem; font-weight: 700; color: var(--text-2); margin-bottom: 4px; letter-spacing: 0.02em; }
        .char-form-area input, .char-form-area textarea {
            width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            padding: 8px 12px; font-size: 0.85rem; background: #fff; color: var(--text);
            transition: 0.2s; font-family: inherit;
        }
        .char-form-area input:focus, .char-form-area textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(59,91,219,0.10); }
        .char-form-area textarea { resize: vertical; min-height: 46px; }
        .char-form-area .form-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
        .char-form-area .edit-badge { display: none; font-size: 0.73rem; color: var(--warning); font-weight: 700; margin-left: 6px; }
        .char-form-area.editing .edit-badge { display: inline; }

        /* ===== ライブラリ ===== */
        .library-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .library-header .count { font-size: 0.83rem; color: var(--text-3); margin-left: 8px; }
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px,1fr)); gap: 12px; }
        .library-card {
            background: var(--surface-2); border-radius: var(--radius-md);
            padding: 14px 12px; border: 2px solid var(--border);
            text-align: center; cursor: pointer; transition: 0.22s; position: relative;
        }
        .library-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-card); }
        .library-card.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(59,91,219,0.10); }
        .library-card .avatar, .library-card .avatar-placeholder {
            width: 58px; height: 58px; border-radius: 50%;
            margin: 0 auto 6px; border: 2px solid var(--border-strong);
        }
        .library-card .avatar { object-fit: cover; background: #fff; }
        .library-card .avatar-placeholder {
            background: var(--surface-3); display: flex; align-items: center; justify-content: center;
            font-size: 1.55rem; font-weight: 800; color: var(--accent);
        }
        .library-card.selected .avatar, .library-card.selected .avatar-placeholder { border-color: var(--accent); }
        .library-card .lname { font-weight: 700; font-size: 0.88rem; }
        .library-card .lanime { font-size: 0.68rem; color: var(--text-3); margin-top: 1px; }
        .library-card .lbadge {
            display: inline-block; background: var(--surface-3); color: var(--text-3);
            font-size: 0.56rem; padding: 2px 10px; border-radius: 999px; margin-top: 5px; font-weight: 600;
        }
        .library-card.selected .lbadge { background: var(--accent); color: #fff; }
        .library-card .card-actions { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
        .library-card .card-actions button {
            border: none; border-radius: 999px; padding: 3px 10px; font-size: 0.66rem;
            cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px;
            font-weight: 600; font-family: inherit;
        }
        .library-card .card-actions .edit-btn { background: var(--warning-soft); color: var(--warning); }
        .library-card .card-actions .edit-btn:hover { background: #f7e8c8; }
        .library-card .card-actions .delete-btn { background: var(--danger-soft); color: var(--danger); }
        .library-card .card-actions .delete-btn:hover { background: #f5d4cf; }
        .library-card .select-badge {
            position: absolute; top: 8px; right: 8px;
            background: var(--accent); color: #fff;
            width: 22px; height: 22px; border-radius: 50%;
            font-size: 0.66rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(59,91,219,0.35);
        }

        /* ===== ゲーム画面 ===== */
        .game-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
        .phase-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--accent-soft); border: 1px solid #ccd7f5;
            color: var(--accent-hover);
            font-size: 0.95rem; font-weight: 700;
            padding: 7px 18px; border-radius: 999px;
        }
        .phase-badge.night { background: #eceafb; border-color: #d6cdf0; color: var(--purple); }
        .phase-badge.vote-phase { background: var(--warning-soft); border-color: #ecd9ae; color: var(--warning); }
        .phase-badge.end { background: var(--success-soft); border-color: #c4e6d6; color: var(--success); }
        .game-day {
            font-size: 0.82rem; color: var(--text-2);
            background: var(--surface-3); border: 1px solid var(--border);
            padding: 4px 16px; border-radius: 999px; font-weight: 700;
        }
        .game-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .game-controls .speed-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-2); }
        .game-controls .speed-wrap input[type="range"] { width: 84px; accent-color: var(--accent); }
        .game-controls .speed-wrap .speed-label { font-size: 0.64rem; color: var(--text-3); }

        .char-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px,1fr)); gap: 10px; margin: 14px 0; }
        .char-card {
            background: var(--surface-2); border-radius: var(--radius-md);
            padding: 12px 8px; border: 1.5px solid var(--border);
            text-align: center; transition: 0.25s; position: relative;
        }
        .char-card .avatar, .char-card .avatar-placeholder {
            width: 56px; height: 56px; border-radius: 50%;
            margin: 0 auto 5px; border: 2px solid var(--border-strong);
        }
        .char-card .avatar { object-fit: cover; background: #fff; }
        .char-card .avatar-placeholder {
            background: var(--surface-3); display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 800; color: var(--accent);
        }
        .char-card .name { font-weight: 700; font-size: 0.84rem; }
        .char-card .anime { font-size: 0.6rem; color: var(--text-3); }
        .char-card .role-badge { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 0.62rem; font-weight: 700; margin-top: 4px; }
        .role-badge.werewolf { background: var(--danger-soft); color: var(--danger); }
        .role-badge.villager { background: var(--accent-soft); color: var(--accent-hover); }
        .role-badge.fortuneteller { background: var(--purple-soft); color: var(--purple); }
        .role-badge.medium { background: #e2f0fa; color: #1a5a8a; }
        .role-badge.knight { background: #e6f4ea; color: #1f6b3f; }
        .role-badge.madman { background: #fce4e0; color: #8a3020; }
        .msg-conversation .bubble .role-tag { font-size: 0.7rem; color: var(--text-3); font-weight: 500; margin-left: 4px; }
        .char-card.dead { opacity: 0.5; filter: grayscale(0.85); }
        .char-card.dead .avatar, .char-card.dead .avatar-placeholder { border-color: #d8a8a2; }
        .char-card .dead-ribbon {
            position: absolute; top: 6px; left: 50%; transform: translateX(-50%) rotate(-4deg);
            background: var(--danger); color: #fff; font-size: 0.55rem; font-weight: 800;
            padding: 2px 10px; border-radius: 4px; letter-spacing: 0.08em;
            box-shadow: 0 2px 6px rgba(192,57,43,0.4); display: none;
        }
        .char-card.dead .dead-ribbon { display: block; }

        /* ===== メッセージエリア ===== */
        .message-area {
            background: var(--surface-2); border-radius: var(--radius-md);
            padding: 16px 18px; max-height: 440px; overflow-y: auto;
            border: 1px solid var(--border); margin-top: 12px;
            display: flex; flex-direction: column; gap: 9px;
        }
        .message-area::-webkit-scrollbar { width: 6px; }
        .message-area::-webkit-scrollbar-track { background: var(--surface-3); border-radius: 10px; }
        .message-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
        .message-area::-webkit-scrollbar-thumb:hover { background: #a9b8c8; }
        .msg-time { font-size: 0.6rem; color: var(--text-3); margin-right: 8px; white-space: nowrap; }
        .msg-system {
            text-align: center; font-size: 0.76rem; color: var(--text-2);
            background: var(--surface-3); border: 1px solid var(--border);
            padding: 5px 16px; border-radius: 999px; display: inline-block;
            margin: 2px auto; max-width: 92%; font-weight: 600;
        }
        .msg-system.death { background: var(--danger-soft); color: var(--danger); border-color: #f0cdc8; }
        .msg-system.reveal { background: var(--purple-soft); color: var(--purple); border-color: #ddc9f2; }
        .msg-system.info { background: var(--accent-soft); color: var(--accent-hover); border-color: #ccd7f5; }
        .msg-system.vote { background: var(--warning-soft); color: var(--warning); border-color: #ecd9ae; }
        .msg-system.win { background: var(--success-soft); color: var(--success); border-color: #c4e6d6; font-weight: 800; font-size: 0.85rem; }

        .msg-conversation { display: flex; align-items: flex-start; gap: 10px; margin: 2px 0; }
        .msg-conversation .avatar, .msg-conversation .avatar-placeholder {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--border-strong); flex-shrink: 0;
        }
        .msg-conversation .avatar { object-fit: cover; background: #fff; }
        .msg-conversation .avatar-placeholder {
            background: var(--surface-3); display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 800; color: var(--accent);
        }
        .msg-conversation .bubble {
            flex: 1; background: var(--surface); border-radius: 14px 14px 14px 5px;
            padding: 9px 15px; box-shadow: var(--shadow-card);
            border: 1px solid var(--border); max-width: calc(100% - 56px);
        }
        .msg-conversation .bubble .name {
            font-weight: 700; font-size: 0.8rem; color: var(--text);
            margin-bottom: 3px; display: flex; align-items: center; gap: 6px;
        }
        .msg-conversation .bubble .name .msg-time { font-weight: 400; font-size: 0.6rem; color: var(--text-3); }
        .msg-conversation .bubble .text { font-size: 0.9rem; color: var(--text); word-break: break-word; line-height: 1.55; }
        .msg-conversation .bubble .text strong { color: var(--danger); font-weight: 800; }

        .msg-vote {
            display: flex; align-items: center; gap: 8px;
            background: var(--warning-soft); border: 1px solid #ecd9ae;
            border-radius: var(--radius-sm); padding: 7px 15px;
            font-size: 0.82rem; color: #6a5424;
            border-left: 3px solid #d9b96a; margin: 2px 0; line-height: 1.5;
        }
        .msg-vote .msg-time { font-size: 0.6rem; color: var(--text-3); flex-shrink: 0; }
        .msg-vote .vote-icon { font-size: 0.9rem; flex-shrink: 0; }
        .msg-vote .voter { font-weight: 700; color: var(--text); }
        .msg-vote .vote-action { color: var(--text-2); font-weight: 400; }
        .msg-vote .target { font-weight: 700; color: var(--danger); }
        .msg-vote .target.abstain { color: var(--text-3); font-weight: 600; }

        /* ===== ローディング ===== */
        .ai-thinking {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.75rem; color: var(--text-3); font-weight: 600;
            background: var(--surface-3); border: 1px solid var(--border);
            padding: 5px 14px; border-radius: 999px; margin: 2px auto;
        }
        .ai-thinking .dots { display: inline-flex; gap: 3px; }
        .ai-thinking .dots span {
            width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
            animation: bounce 1.2s infinite;
        }
        .ai-thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
        .ai-thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

        @media (max-width:600px) {
            .app-header { flex-direction: column; align-items: stretch; }
            .api-area input { width: 100%; }
            .tabs { flex-direction: column; border-radius: 18px; }
            .char-form-area .form-row { grid-template-columns: 1fr; }
            .library-grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); }
            .char-cards { grid-template-columns: repeat(auto-fit, minmax(100px,1fr)); }
            .game-header { flex-direction: column; align-items: stretch; }
            .msg-conversation .bubble { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- ===== ヘッダー ===== -->
        <div class="app-header">
            <div>
                <h1><i class="fas fa-paw"></i> 全自動人狼 <span class="ver">Ver5.9</span></h1>
                <span class="sub"><i class="fas fa-robot"></i> Gemini — AIキャラ人狼シミュレーター</span>
            </div>
            <div class="api-area">
                <i class="fas fa-key" style="color:var(--text-3);"></i>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
                <button class="btn btn-primary btn-sm" id="saveApiKeyBtn"><i class="fas fa-save"></i> 保存</button>
                <span class="status" id="apiKeyStatus"></span>
            </div>
        </div>

        <!-- ===== タブ ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="library"><i class="fas fa-book"></i> キャラライブラリ</button>
            <button class="tab-btn" data-tab="game"><i class="fas fa-gamepad"></i> ゲーム観戦</button>
        </div>

        <!-- ========================================================= -->
        <!-- タブ1: ライブラリ -->
        <!-- ========================================================= -->
        <div id="tab-library" class="tab-pane active">
            <div class="char-form-area" id="charFormArea">
                <h3 style="margin-bottom:12px;font-size:1rem;">
                    <i class="fas fa-user-plus" style="color:var(--accent);"></i>
                    <span id="formTitle">新しいキャラクターを作成</span>
                    <span class="edit-badge"><i class="fas fa-pen"></i> 編集中</span>
                </h3>
                <div class="form-row">
                    <div>
                        <label>アニメ作品名</label>
                        <input type="text" id="newAnime" placeholder="例: SPY×FAMILY" />
                    </div>
                    <div>
                        <label>キャラクター名</label>
                        <input type="text" id="newName" placeholder="例: ロイド・フォージャー" />
                    </div>
                    <div>
                        <label>画像URL（imgurなど）</label>
                        <input type="text" id="newImage" placeholder="https://i.imgur.com/xxx.jpg" />
                    </div>
                    <div style="display:flex;gap:6px;align-items:flex-end;">
                        <div style="flex:1;">
                            <label>説明文（詳細に！）</label>
                            <textarea id="newDesc" rows="6" placeholder="「プロンプト」ボタンで生成した説明文を貼り付けると、より本人らしいセリフになります"></textarea>
                        </div>
                        <button class="btn-copy" id="copyPromptBtn" style="align-self:flex-end;margin-bottom:2px;"><i class="fas fa-copy"></i> プロンプト</button>
                    </div>
                </div>
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;">
                    <label style="font-size:0.78rem;font-weight:700;color:var(--text-2);">疑心度:</label>
                    <select id="newSuspicionLevel" style="border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:0.85rem;background:#fff;font-family:inherit;">
                        <option value="低">低（擁護型・場を和ませる）</option>
                        <option value="中" selected>中（バランス型）</option>
                        <option value="高">高（疑心暗鬼・積極的に疑う）</option>
                    </select>
                    <span style="font-size:0.72rem;color:var(--text-3);">キャラの性格に合わせて選択</span>
                </div>
                <div class="form-actions">
                    <button class="btn btn-success" id="addCharBtn"><i class="fas fa-plus"></i> <span id="submitBtnText">ライブラリに追加</span></button>
                    <button class="btn btn-outline" id="clearFormBtn"><i class="fas fa-undo"></i> クリア</button>
                    <button class="btn btn-outline" id="cancelEditBtn" style="display:none;"><i class="fas fa-times"></i> 編集キャンセル</button>
                </div>
            </div>

            <div class="library-header">
                <div>
                    <span style="font-weight:700;font-size:1rem;"><i class="fas fa-users" style="color:var(--accent);"></i> キャラクターライブラリ</span>
                    <span class="count" id="libraryCount">0 キャラ</span>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <span style="font-size:0.8rem;color:var(--text-2);display:flex;align-items:center;font-weight:600;">
                        <i class="fas fa-check-circle" style="color:var(--accent);margin-right:4px;"></i> 選択中: <span id="selectedCount">0</span>/10
                    </span>
                    <button class="btn btn-success btn-sm" id="startGameFromLibrary"><i class="fas fa-play"></i> 選択したキャラでゲーム開始</button>
                </div>
            </div>
            <div class="library-grid" id="libraryGrid"></div>
            <p style="margin-top:12px;font-size:0.75rem;color:var(--text-3);text-align:center;">
                <i class="fas fa-info-circle"></i> キャラをクリックで選択/解除（6〜10人）。✏️編集ボタンで情報を変更できます。
            </p>
        </div>

        <!-- ========================================================= -->
        <!-- タブ2: ゲーム -->
        <!-- ========================================================= -->
        <div id="tab-game" class="tab-pane">
            <div class="game-header">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <span class="phase-badge" id="phaseDisplay"><i class="fas fa-hourglass-half"></i> 待機中</span>
                    <span class="game-day" id="dayCounter">0日目</span>
                </div>
                <div class="game-controls">
                    <div class="speed-wrap">
                        <i class="fas fa-tachometer-alt"></i>
                        <span class="speed-label">遅い</span>
                        <input type="range" id="speedSlider" min="0" max="10" value="5" />
                        <span class="speed-label">速い</span>
                    </div>
                    <button class="btn btn-danger btn-sm" id="pauseBtn"><i class="fas fa-pause"></i> 一時停止</button>
                    <button class="btn btn-outline btn-sm" id="copyLogBtn"><i class="fas fa-copy"></i> ログコピー</button>
                    <button class="btn btn-outline btn-sm" id="resetBtn"><i class="fas fa-redo-alt"></i> リセット</button>
                </div>
            </div>
            <div class="char-cards" id="charCards"></div>
            <div class="message-area" id="messageArea"></div>
        </div>

    </div>

    <script>
        const MAX_PLAYERS = 10;
        const MIN_PLAYERS = 6;
        const VERSION = 'Ver5.9';

        const STATE = {
            apiKey: '',
            library: [],
            selectedIds: [],
            characters: [],
            day: 0,
            phase: 'setup',
            paused: false,
            running: false,
            log: [],
            speed: 0,
            aliveIndices: [],
            werewolfIndices: [],
            fortuneTellerIndex: -1,
            mediumIndex: -1,
            knightIndex: -1,
            madmanIndex: -1,
            villagerIndices: [],
            fortuneSecret: '',
            fortuneHistory: [], // {day, target, result} 占い履歴
            mediumHistory: [],  // {day, target, result} 霊媒履歴
            lastExecuted: -1,   // 前日の処刑者idx（霊媒判定用）
            lastGuardedIdx: -1, // 前夜の護衛先
            editingId: null,
            conversationLog: [],
            suspicion: {},
            fortuned: [],
            daySchedule: [], // その日の議論スケジュール [[ラウンド1の発言者idx...], [...], [...]]
            fullLog: [], // 全メッセージのコピー用ログ（**太字**マーカーを保持）
            coClaims: [], // CO宣言の記録 {idx, name, role, day}（追跡用）
            publicResults: [], // 発言で公開された占い/霊媒の判定ラベル（'名前 → 人狼' 等）
            nightDeaths: [], // 夜の襲撃で死んだidxの履歴
            lastNightVictim: null, // 直前の夜の犠牲者idx（翌日冒頭のリアクション用）
            gameToken: 0,
        };

        const STORAGE_KEY = 'werewolf_library';
        const API_KEY_STORAGE = 'gemini_api_key';

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function escapeRegExp(str) {
            return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 現在のゲームが有効か確認（リセット後の旧ループ書き込み防止）
        function isCurrentGame(token) {
            return STATE.running && token === STATE.gameToken;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem(API_KEY_STORAGE);
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                STATE.apiKey = savedKey;
                document.getElementById('apiKeyStatus').textContent = '✅ 読込完了';
            }

            loadLibrary();

            document.getElementById('speedSlider').value = 5;
            STATE.speed = 5;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                });
            });

            document.getElementById('saveApiKeyBtn').addEventListener('click', saveApiKey);
            document.getElementById('addCharBtn').addEventListener('click', handleSubmit);
            document.getElementById('clearFormBtn').addEventListener('click', clearForm);
            document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
            document.getElementById('startGameFromLibrary').addEventListener('click', startGameFromLibrary);
            document.getElementById('pauseBtn').addEventListener('click', togglePause);
            document.getElementById('resetBtn').addEventListener('click', resetGame);
            document.getElementById('copyLogBtn').addEventListener('click', copyGameLog);
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                STATE.speed = parseInt(e.target.value);
            });
            document.getElementById('copyPromptBtn').addEventListener('click', copyPromptFromInput);

            if (STATE.library.length === 0) {
                addSampleCharacters();
            }

            renderLibrary();
            updateSelectedCount();
        });

        function loadLibrary() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                STATE.library = data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('ライブラリの読み込みに失敗:', e);
                STATE.library = [];
            }
            STATE.library.forEach(c => {
                if (!c.id) c.id = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                if (!c.suspicionLevel) c.suspicionLevel = '中';
            });
        }

        function saveLibrary() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE.library));
        }

        function addSampleCharacters() {
            const samples = [
                { anime: 'ひぐらしのなく頃に', name: '前原圭一', imageUrl: '', suspicionLevel: '高', description: '都会から雛見沢に引っ越してきた少年。正義感が強く、口が達者で仲間を引っ張るリーダータイプ。ただし、疑われると極端に感情的になり、周りを威圧する傾向がある。口調は乱暴だが、根は仲間思い。人狼ゲームでは、リーダーシップを発揮する反面、疑われると怒り狂って自爆しやすい。' },
                { anime: 'ひぐらしのなく頃に', name: '竜宮レナ', imageUrl: '', suspicionLevel: '高', description: '雛見沢の少女。物腰は柔らかく「〜かな？」が口癖だが、直感が鋭く、危険を察知するのが得意。性格は一見おっとりしているが、真実を見抜く力に長けており、鋭い指摘で周囲を驚かせる。人狼ゲームでは、勘の良さを武器に村人を導くが、自分の意見を強く主張しないため、時折流されやすい。' },
                { anime: 'ひぐらしのなく頃に', name: '古手梨花', imageUrl: '', suspicionLevel: '中', description: '雛見沢の神社の娘。見た目は幼いが、どこか達観した口調で「み〜」「にぱ〜」が口癖。ミステリアスな雰囲気を纏い、物事を斜めに見る傾向がある。実は非常に賢く、他人の心理を読むのが上手い。人狼ゲームでは、クールに分析し、ミスリードを誘うような発言で人狼を追い詰めるのが得意。' },
                { anime: 'ひぐらしのなく頃に', name: '園崎詩音', imageUrl: '', suspicionLevel: '高', description: '園崎家の次女。姉の魅音とは対照的に、大人びた口調で他人をからかうのが好き。洞察力に優れ、人の嘘を見抜くのが得意。ただし、やや皮肉っぽい物言いをするため、村人からは疑われやすい。人狼ゲームでは、鋭いツッコミで人狼を追い詰めるが、その毒舌が仇になることも。' },
                { anime: 'ひぐらしのなく頃に', name: '園崎魅音', imageUrl: '', suspicionLevel: '中', description: '園崎家の長女で、クラスのリーダー的存在。姉御肌で、仲間をまとめるのが上手い。口調は軽妙で「おじさん」が口癖。冷静な判断力を持ち、感情的になりがちな圭一をなだめる役割を担う。人狼ゲームでは、公平な仲裁役として、皆の意見をまとめながら人狼を炙り出す。' },
                { anime: 'ひぐらしのなく頃に', name: '北条沙都子', imageUrl: '', suspicionLevel: '中', description: '雛見沢の少女。お嬢様口調で高飛車な態度を取るが、実はかなりの策士。トラップを仕掛けるのが得意で、他人を挑発して誤った行動を引き出すのが上手い。人狼ゲームでは、挑発的な発言で相手を動揺させ、真実を引き出す囮役として活躍。ただし、自信過剰になりがちで、時として大きなミスを犯すことも。' },
            ];
            samples.forEach(s => {
                STATE.library.push({
                    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    anime: s.anime,
                    name: s.name,
                    imageUrl: s.imageUrl,
                    description: s.description,
                    suspicionLevel: s.suspicionLevel || '中',
                });
            });
            saveLibrary();
        }

        function getFormData() {
            return {
                anime: document.getElementById('newAnime').value.trim(),
                name: document.getElementById('newName').value.trim(),
                imageUrl: document.getElementById('newImage').value.trim(),
                description: document.getElementById('newDesc').value.trim(),
                suspicionLevel: document.getElementById('newSuspicionLevel').value || '中',
            };
        }

        function setFormData(data) {
            document.getElementById('newAnime').value = data.anime || '';
            document.getElementById('newName').value = data.name || '';
            document.getElementById('newImage').value = data.imageUrl || '';
            document.getElementById('newDesc').value = data.description || '';
            document.getElementById('newSuspicionLevel').value = data.suspicionLevel || '中';
        }

        function clearForm() {
            clearFormInputs();
            cancelEdit();
        }

        function startEdit(id) {
            const char = STATE.library.find(c => c.id === id);
            if (!char) return;
            STATE.editingId = id;
            setFormData(char);
            document.getElementById('charFormArea').classList.add('editing');
            document.getElementById('formTitle').textContent = 'キャラクターを編集';
            const btn = document.getElementById('addCharBtn');
            btn.className = 'btn btn-warning';
            btn.innerHTML = '<i class="fas fa-save"></i> <span id="submitBtnText">更新</span>';
            document.getElementById('cancelEditBtn').style.display = 'inline-flex';
            document.getElementById('charFormArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelEdit() {
            STATE.editingId = null;
            document.getElementById('charFormArea').classList.remove('editing');
            document.getElementById('formTitle').textContent = '新しいキャラクターを作成';
            const btn = document.getElementById('addCharBtn');
            btn.className = 'btn btn-success';
            btn.innerHTML = '<i class="fas fa-plus"></i> <span id="submitBtnText">ライブラリに追加</span>';
            document.getElementById('cancelEditBtn').style.display = 'none';
            clearFormInputs();
        }

        function clearFormInputs() {
            document.getElementById('newAnime').value = '';
            document.getElementById('newName').value = '';
            document.getElementById('newImage').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newSuspicionLevel').value = '中';
        }

        function handleSubmit() {
            const data = getFormData();
            if (!data.anime || !data.name || !data.description) {
                alert('アニメ名・キャラ名・説明文は必須です。');
                return;
            }
            if (STATE.editingId) {
                const idx = STATE.library.findIndex(c => c.id === STATE.editingId);
                if (idx !== -1) {
                    STATE.library[idx] = { ...STATE.library[idx], ...data };
                    saveLibrary();
                    renderLibrary();
                    cancelEdit();
                    updateSelectedCount();
                }
            } else {
                STATE.library.push({
                    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    ...data,
                });
                saveLibrary();
                renderLibrary();
                clearFormInputs();
                updateSelectedCount();
            }
        }

        function copyPromptFromInput() {
            const anime = document.getElementById('newAnime').value.trim() || '（作品名未入力）';
            const name = document.getElementById('newName').value.trim() || '（キャラ名未入力）';
            const prompt = `あなたはアニメ・漫画・ゲームのキャラクター分析の第一人者であり、原作設定に極めて忠実な脚本家です。
以下のキャラクターが「人狼ゲーム」という極限の心理戦の中で、**完全に本人として喋り・考え・疑い・騙す**ために必要な言語プロファイルを、以下のテンプレート形式そのままで出力してください。

【作品名】：${anime}
【キャラ名】：${name}

---

必ず次のテンプレートの見出しと構成をそのまま使い、各項目を埋めてください。
見出し以外の前置き・後書き・説明は一切不要です。**冒頭に必ず「作品名: ${anime} / キャラ名: ${name}」の1行を入れてください**（AIが誰を演じているかを常に思い出すため）。

作品名: ${anime} / キャラ名: ${name}

【一人称】：
（原作で実際に使う一人称を全て列挙。状況による使い分けがあるなら「普段:◯◯ / 激昂時:◯◯ / 内心:◯◯」のように分けて記載）

【他者の呼び方】：
（具体的な呼び方のパターンを3つ以上。例：「仲間には◯◯くん、敵には呼び捨て、目上には◯◯さん付け」のように関係性ごとに記載）

【口調・語尾の具体パターン】：
（実際の語尾・接続詞・間投詞を5つ以上、そのままの形で列挙。関西弁・敬語・古語などの場合はその法則も一言で）

【口癖・決め台詞】：
（作中で実際に繰り返し使われるフレーズを2〜3個、原文そのままの形で。人狼ゲームAIが使う際は「数ラウンドに1回だけ」の頻度が適切と明記）

【感情表現の温度差】：
（このキャラが「平静時」「疑われた時」「追い詰められた時」「勝利を確信した時」にそれぞれどう喋るか、トーンの変化を具体的に）

【思考パターンの癖】：
（このキャラの推理・判断の傾向。例：「直感で動く」「証拠を積み上げてから結論」「他人の矛盾を突くのが得意」など）

【話し方のテンポとリズム】：
（文の長さ、間の取り方、畳み掛ける/ぼそっと言う等の物理的な喋り方の特徴）

【推奨疑心度】：
（このキャラを人狼ゲームで演じる時の疑心度を「低／中／高」から1つ選び、その理由を1行で。
- 低: 他人を疑うより擁護・場を和ませる方が本人らしい（例: 温厚系・お姫様系）
- 中: 状況に応じて疑ったり庇ったりバランスを取る（例: リーダー系・普通の主人公）
- 高: 常に他人を疑い、鋭く突っ込むのが本人らしい（例: 名探偵系・皮肉屋）
※このキャラを追加する時、UIの「疑心度」もこれに合わせて選ぶこと）

【人狼ゲームでの行動傾向】：
（役職ごとの立ち回りを3つ以上。村人時／人狼時／占い師などの役職時／疑われた時の反応など）

【実際の原作セリフ（引用）】：
**※超重要：AIによる創作は厳禁。**必ず原作（アニメ・漫画・ゲーム）で**実際にそのキャラクターが発言したセリフ**を**5つ以上**引用し、どのようなシーンでの発言か（感情や背景）を括弧書きで添えてください。このセリフの口調・語彙・テンポを、人狼ゲームでの発言生成の「絶対的なベースライン」とします。**ただし人狼ゲームの発言では、このセリフをそのまま繰り返すのではなく、口調・語尾・テンポだけを踏襲して自然な会話にしてください。**
1. 「（セリフ）」（シーン：〜）
2. 「（セリフ）」（シーン：〜）
3. 「（セリフ）」（シーン：〜）
4. 「（セリフ）」（シーン：〜）
5. 「（セリフ）」（シーン：〜）

---

注意事項：
- 独自解釈・二次創作・ファン理論は一切加えず、公式設定・原作の描写のみを根拠にしてください。
- **記憶が曖昧な項目は絶対に推測・創作で埋めず「不明（原作で明確な描写なし）」と正直に書いてください。間違った口癖や存在しない呼び方を書くくらいなら、空欄の方がマシです。**特に【実際の原作セリフ】は、正確に思い出せるものだけを書き、5つ書けない場合は書ける数だけで構いません（創作は厳禁）。
- 抽象的な性格形容詞（「優しい」「賢い」等）ではなく、**AIがそのままセリフを生成できるレベルの具体的言語情報**を優先してください。
- 全体で500〜800文字程度にまとめてください。`;

            const btn = document.getElementById('copyPromptBtn');
            const orig = btn.innerHTML;

            navigator.clipboard.writeText(prompt).then(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> 完了!';
                setTimeout(() => btn.innerHTML = orig, 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = prompt;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.innerHTML = '<i class="fas fa-check"></i> 完了!';
                setTimeout(() => btn.innerHTML = orig, 2000);
            });
        }

        function renderLibrary() {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '';
            STATE.library.forEach(c => {
                const card = document.createElement('div');
                card.className = `library-card ${STATE.selectedIds.includes(c.id) ? 'selected' : ''}`;
                card.dataset.id = c.id;
                const safeName = escapeHtml(c.name);
                const safeAnime = escapeHtml(c.anime);
                const safeImg = escapeHtml(c.imageUrl);

                let avatarHtml = '';
                if (c.imageUrl) {
                    avatarHtml = `<img class="avatar" src="${safeImg}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div class="avatar-placeholder" style="display:none;">${escapeHtml(c.name.charAt(0))}</div>`;
                } else {
                    avatarHtml = `<div class="avatar-placeholder">${escapeHtml(c.name.charAt(0))}</div>`;
                }

                const isSelected = STATE.selectedIds.includes(c.id);
                card.innerHTML = `
                    ${avatarHtml}
                    <div class="lname">${safeName}</div>
                    <div class="lanime">${safeAnime}</div>
                    <div class="lbadge">${isSelected ? '✅ 選択中' : 'クリックで選択'}</div>
                    <div class="card-actions">
                        <button class="edit-btn" data-id="${c.id}" title="編集"><i class="fas fa-pen"></i> 編集</button>
                        <button class="delete-btn" data-id="${c.id}" title="削除"><i class="fas fa-trash"></i></button>
                    </div>
                    ${isSelected ? '<div class="select-badge">' + (STATE.selectedIds.indexOf(c.id)+1) + '</div>' : ''}
                `;
                grid.appendChild(card);

                card.addEventListener('click', (e) => {
                    if (e.target.closest('.card-actions')) return;
                    toggleSelect(c.id);
                });
                card.querySelector('.edit-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    startEdit(c.id);
                });
                card.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`「${c.name}」を削除しますか？`)) {
                        deleteCharacter(c.id);
                    }
                });
            });
            document.getElementById('libraryCount').textContent = STATE.library.length + ' キャラ';
            updateSelectedCount();
        }

        function toggleSelect(id) {

            if (idx !== -1) {
                STATE.selectedIds.splice(idx, 1);
            } else {
                if (STATE.selectedIds.length >= MAX_PLAYERS) {
                    alert(`選択できるのは最大${MAX_PLAYERS}人までです。`);

                }
                STATE.selectedIds.push(id);
            }
            renderLibrary();
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = STATE.selectedIds.length;
        }

        function deleteCharacter(id) {
            STATE.library = STATE.library.filter(c => c.id !== id);
            STATE.selectedIds = STATE.selectedIds.filter(sid => sid !== id);
            if (STATE.editingId === id) cancelEdit();
            saveLibrary();
            renderLibrary();
            updateSelectedCount();
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                STATE.apiKey = key;
                localStorage.setItem(API_KEY_STORAGE, key);
                document.getElementById('apiKeyStatus').textContent = '✅ 保存しました';

        function startGameFromLibrary() {
            if (!STATE.apiKey) {
                alert('Gemini APIキーを入力して保存してください。');
                return;
            }
            if (STATE.selectedIds.length < MIN_PLAYERS) {
                alert(`最低${MIN_PLAYERS}人選択してください。現在 ${STATE.selectedIds.length} 人です。`);
                return;
            }

            const selectedChars = STATE.library.filter(c => STATE.selectedIds.includes(c.id));
            if (selectedChars.length < MIN_PLAYERS) {
                alert('選択されたキャラの取得に失敗しました。');

            }

            // 新しいゲーム世代を発行（旧ループを無効化）
