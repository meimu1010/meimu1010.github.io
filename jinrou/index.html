            STATE.characters = selectedChars.map((c, idx) => ({
                index: idx,
                anime: c.anime,
                name: c.name,
                imageUrl: c.imageUrl || '',
                description: c.description,
                suspicionLevel: c.suspicionLevel || '中',
                role: '',
                alive: true,
                speech: '',
            }));

            // 履歴類を初期化
            STATE.fortuneHistory = [];
            STATE.mediumHistory = [];
            STATE.lastExecuted = -1;
            STATE.lastGuardedIdx = -1;
            STATE.fullLog = [];
            STATE.coClaims = []; STATE.publicResults = [];
            STATE.nightDeaths = [];
            STATE.lastNightVictim = null;

            STATE.log = [];
            STATE.day = 0;
            STATE.running = true;
            STATE.paused = false;
            STATE.fortuneSecret = '';
            STATE.conversationLog = [];
            STATE.suspicion = {};
            STATE.fortuned = [];

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-tab="game"]').classList.add('active');
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.getElementById('tab-game').classList.add('active');

            renderCards();
            document.getElementById('messageArea').innerHTML = '';
            document.getElementById('dayCounter').textContent = '0日目';
            setPhase('⏳ 準備中…', '');
            const n = STATE.characters.length;
            addSystemMessage(`🐺 ${VERSION} ゲーム開始！（${n}人対戦）`, 'info');
            assignRoles();
            gameLoop(token).catch(handleGameLoopError);
        }

        // 総人数別の配役表 [人狼, 占い師, 霊媒師, 騎士, 村人, 狂人]
        // https://shiraberu.net/game/jinro/ を参考にした標準構成
        function getRoleComposition(n) {
            const table = {
                5:  [1, 1, 0, 0, 3, 0],
                6:  [1, 1, 0, 0, 4, 0],
                7:  [2, 1, 1, 0, 3, 0],
                8:  [2, 1, 1, 0, 4, 0],
                9:  [2, 1, 1, 1, 3, 1],
                10: [2, 1, 1, 1, 4, 1],
                11: [3, 1, 1, 1, 4, 1],
                12: [3, 1, 1, 1, 5, 1],
                13: [3, 1, 1, 1, 6, 1],
                14: [3, 1, 1, 1, 6, 2],
                15: [3, 1, 1, 1, 7, 2],
            };
            if (table[n]) return table[n];
            // 表にない大人数用フォールバック
            const wolves = Math.max(1, Math.floor(n / 5));
            const madmen = n >= 9 ? 1 : 0;
            const rest = n - wolves - 1 - (n >= 7 ? 1 : 0) - (n >= 9 ? 1 : 0) - madmen;
            return [wolves, 1, n >= 7 ? 1 : 0, n >= 9 ? 1 : 0, rest, madmen];
        }

        function assignRoles() {
            const n = STATE.characters.length;
            const [wolfCount, fortuneCount, mediumCount, knightCount, villagerCount, madmanCount] = getRoleComposition(n);

            const roles = [];
            for (let i = 0; i < wolfCount; i++) roles.push('werewolf');
            for (let i = 0; i < fortuneCount; i++) roles.push('fortuneteller');
            for (let i = 0; i < mediumCount; i++) roles.push('medium');
            for (let i = 0; i < knightCount; i++) roles.push('knight');
            for (let i = 0; i < madmanCount; i++) roles.push('madman');
            for (let i = 0; i < villagerCount; i++) roles.push('villager');
            // 足りない分は村人で埋める
            while (roles.length < n) roles.push('villager');
            // はみ出た分は削る
            roles.length = n;

            for (let i = roles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [roles[i], roles[j]] = [roles[j], roles[i]];
            }

            STATE.werewolfIndices = [];
            STATE.villagerIndices = [];
            STATE.fortuneTellerIndex = -1;
            STATE.mediumIndex = -1;
            STATE.knightIndex = -1;
            STATE.madmanIndex = -1;

            roles.forEach((role, idx) => {
                STATE.characters[idx].role = role;
                if (role === 'werewolf') STATE.werewolfIndices.push(idx);
                else if (role === 'villager') STATE.villagerIndices.push(idx);
                else if (role === 'fortuneteller') STATE.fortuneTellerIndex = idx;
                else if (role === 'medium') STATE.mediumIndex = idx;
                else if (role === 'knight') STATE.knightIndex = idx;
                else if (role === 'madman') STATE.madmanIndex = idx;
            });

            STATE.aliveIndices = Array.from({ length: n }, (_, i) => i);
            const parts = [];
            if (wolfCount) parts.push(`人狼${wolfCount}`);
            if (fortuneCount) parts.push(`占い師${fortuneCount}`);
            if (mediumCount) parts.push(`霊媒師${mediumCount}`);
            if (knightCount) parts.push(`騎士${knightCount}`);
            if (villagerCount) parts.push(`村人${villagerCount}`);
            if (madmanCount) parts.push(`狂人${madmanCount}`);
            addSystemMessage(`✅ 役職決定：${parts.join('・')}`, 'info');
            renderCards();
        }

        // ===== ゲームログのコピー（**太字**マーカーを保持したプレーンテキスト） =====
        function copyGameLog() {
            const lines = STATE.fullLog.map(e => {
                if (e.kind === 'speech') {
                    const role = e.role ? `(${e.role})` : '';
                    return `${e.time} ${e.name}${role}: 「${e.text}」`;
                } else if (e.kind === 'vote') {
                    const vr = e.role ? `(${e.role})` : '';
                    if (e.text === '見送り') return `${e.time} 🗳️ ${e.name}${vr} は投票を見送った`;
                    const tr = e.targetRole ? `(${e.targetRole})` : '';
                    return `${e.time} 🗳️ ${e.name}${vr} が ${e.text}${tr} に投票した`;
                }
                return `${e.time} ${e.text}`;
            });
            const out = `全自動人狼 ${VERSION} ゲームログ\n\n` + lines.join('\n');
            const btn = document.getElementById('copyLogBtn');
            const orig = btn.innerHTML;
            const done = () => {
                btn.innerHTML = '<i class="fas fa-check"></i> コピー完了';
                setTimeout(() => btn.innerHTML = orig, 2000);
            };
            navigator.clipboard.writeText(out).then(done).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = out;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                done();
            });
        }

        function handleGameLoopError(e) {
            console.error('ゲームループでエラーが発生しました:', e);
            addSystemMessage('⚠️ エラーが発生したためゲームを停止しました。APIキーや通信状況を確認してください。', 'info');
            STATE.running = false;
        }

        // 「思考中」インジケーター
        function showThinking(text) {
            const area = document.getElementById('messageArea');
            if (!area) return null;
            const div = document.createElement('div');
            div.className = 'ai-thinking';
            div.innerHTML = `<i class="fas fa-brain"></i> ${escapeHtml(text)} <span class="dots"><span></span><span></span><span></span></span>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            return div;
        }

        async function gameLoop(token) {
            if (!isCurrentGame(token)) return;
            try {
                // 0日目の夜（オープニング儀式）: 初回のみ
                if (STATE.day === 0) {
                    setPhase('🌙 0日目の夜（オープニング）', 'night');
                    await fastWait();
                    await openingNight(token);
                    if (!isCurrentGame(token)) return;
                }
                STATE.day++;
                document.getElementById('dayCounter').textContent = `${STATE.day}日目`;
                addSystemMessage(`🌅 ${STATE.day}日目が始まります。`, 'info');

                // --- 夜フェーズ（1日目は襲撃なし。2日目以降は襲撃・占い・霊媒・護衛）---
                setPhase('🌙 夜フェーズ', 'night');
                await fastWait();
                let nightVictim = null;
                if (STATE.day > 1) {
                    if (!isCurrentGame(token)) return;
                    nightVictim = await nightPhase(token);
                    STATE.lastNightVictim = nightVictim;
                }
                if (!isCurrentGame(token)) return;
                if (checkGameEnd()) return;

                // --- 昼フェーズ ---
                setPhase('☀️ 昼フェーズ（議論）', '');
                await fastWait();

                // Ver5.1: その日の議論スケジュールを生成
                // （3ターン合計で全員最低1回・1ターン内の同一キャラは最大2回）
                STATE.daySchedule = buildDaySchedule(STATE.aliveIndices);

                // Ver4.0 fix: 昨夜襲撃された人だけを発表する
                if (STATE.day > 1) {
                    if (nightVictim !== null) {
                        addSystemMessage(`💀 昨夜、${STATE.characters[nightVictim].name} が命を落としました。`, 'death');
                    } else {
                        addSystemMessage('😴 昨夜は誰も襲われませんでした。', 'info');
                    }
                }

                // Ver5.5: 日またぎで前日以前のログを要点化（昨日の会話がそのまま続くのを防ぐ）
                if (STATE.conversationLog.length > 0) {
                    const keep = STATE.conversationLog.slice(-6);
                    const older = STATE.conversationLog.slice(0, -6);
                    const lines = [];
                    if (older.length > 0) {
                        const digest = older.slice(-10).map(e => `${e.name}: 「${e.speech.slice(0, 30)}…」`).join(' / ');
                        lines.push({ name: '（前日までの議論の要点）', speech: digest });
                    }
                    keep.forEach(e => lines.push({ name: e.name, speech: e.speech }));
                    STATE.conversationLog = lines;
                }

                for (let round = 1; round <= 3; round++) {
                    if (!isCurrentGame(token)) return;
                    if (STATE.paused) await waitUntilResume();
                    if (!isCurrentGame(token)) return;
                    setPhase(`☀️ 議論 ${round}/3`, '');
                    addSystemMessage(`💬 議論ターン ${round}/3`, 'info', true); // ログコピー専用
                    await wait(STATE.speed);
                    await dayDiscussion(round, token);
                    renderCards();
                    if (checkGameEnd()) return;
                }

                setPhase('🗳️ 投票フェーズ', 'vote-phase');
                await fastWait();
                await votingPhase(token);
                renderCards();
                if (checkGameEnd()) return;

                addSystemMessage(`🌙 ${STATE.day}日目が終了しました。`, 'info');
                await fastWait();
                setTimeout(() => { if (isCurrentGame(token)) gameLoop(token).catch(handleGameLoopError); }, 100);
            } catch (e) {
                handleGameLoopError(e);
            }
        }

        // ============ Ver5.0: 0日目の夜（オープニング儀式） ============
        async function openingNight(token) {
            // 人狼同士の仲間確認（ナレーション）
            const wolves = STATE.werewolfIndices;
            if (wolves.length > 0) {
                if (wolves.length === 1) {
                    addSystemMessage(`🐺 人狼の${STATE.characters[wolves[0]].name}が村に潜んでいます…`, 'info');
                } else {
                    const names = wolves.map(i => STATE.characters[i].name).join('・');
                    addSystemMessage(`🐺 人狼たち（${names}）が闇の中で仲間の顔を確認し合いました。`, 'info');
                }
            }
            // 狂人の確認（本人だけの秘密として通知）
            if (STATE.madmanIndex !== -1) {
                addSystemMessage(`🎭 狂人が人狼陣営として密かに動き出します…`, 'info');
            }
            await fastWait();

            // 占い師の初回占い
            if (STATE.fortuneTellerIndex !== -1 && STATE.characters[STATE.fortuneTellerIndex].alive) {
                const thinking = showThinking('🔮 占い師が最初の一人を占っています…');
                let target = -1;
                try {
                    const resp = await callGemini(buildFortuneNightPrompt());
                    const j = JSON.parse(resp);
                    target = resolveAliveIndexByName(j.fortune_teller_target || '', STATE.fortuneTellerIndex);
                } catch (e) {}
                if (target === -1) {
                    const cands = STATE.aliveIndices.filter(i => i !== STATE.fortuneTellerIndex);
                    target = cands[Math.floor(Math.random() * cands.length)];
                }
                if (thinking) thinking.remove();
                // 狂人は人狼側だが占いでは「村人」判定
                const isWolf = STATE.werewolfIndices.includes(target);
                const targetName = STATE.characters[target].name;
                STATE.fortuneSecret = `${targetName} は ${isWolf ? '人狼' : '村人'} でした。`;
                STATE.fortuneHistory.push({ day: 0, target, targetName, result: isWolf ? '人狼' : '村人' });
                STATE.fortuned.push(target);
                addSystemMessage(`🔮 占い師が今夜、村の誰か一人を占いました。`, 'info');
            }
            await fastWait();
            addSystemMessage('🌅 朝が来ました。議論を始めましょう。', 'info');
        }

        async function nightPhase(token) {
            const alive = STATE.aliveIndices;
            const wolves = STATE.werewolfIndices.filter(idx => STATE.characters[idx].alive);
            const fortuneIdx = STATE.fortuneTellerIndex;
            const mediumIdx = STATE.mediumIndex;
            const knightIdx = STATE.knightIndex;

            // 人狼襲撃・占い・霊媒・護衛のAPI呼び出しを並列実行
            const thinking = showThinking('🌙 夜が更けていきます…');
            const wolfPromise = (wolves.length > 0 && alive.length > 0)
                ? callGemini(buildWolfNightPrompt())
                : Promise.resolve('{}');
            const fortunePromise = (fortuneIdx !== -1 && STATE.characters[fortuneIdx].alive)
                ? callGemini(buildFortuneNightPrompt())
                : Promise.resolve('{}');
            // 霊媒は結果が決定的に決まるためAPI不要
            const knightPromise = (knightIdx !== -1 && STATE.characters[knightIdx].alive)
                ? callGemini(buildKnightNightPrompt())
                : Promise.resolve('{}');

            let wolfResponse = '{}', fortuneResponse = '{}', knightResponse = '{}';
            try { [wolfResponse, fortuneResponse, knightResponse] = await Promise.all([wolfPromise, fortunePromise, knightPromise]); }
            catch (e) {
                try { wolfResponse = await wolfPromise; } catch (_) {}
                try { fortuneResponse = await fortunePromise; } catch (_) {}
                try { knightResponse = await knightPromise; } catch (_) {}
            }
            if (thinking) thinking.remove();

            // --- 人狼: 襲撃先決定 ---
            let attackTarget = -1;
            if (wolves.length > 0 && alive.length > 0) {
                if (!isCurrentGame(token)) return null;
                let votes = {};
                try { votes = JSON.parse(wolfResponse); }
                catch (e) {
                    wolves.forEach(idx => {
                        const cands = alive.filter(i => i !== idx && !STATE.werewolfIndices.includes(i));
                        if (cands.length > 0) votes[STATE.characters[idx].name] = STATE.characters[cands[Math.floor(Math.random() * cands.length)]].name;
                    });
                }
                const tally = {};
                for (const [, targetName] of Object.entries(votes)) {
                    const resolved = resolveAliveIndexByName(targetName);
                    if (resolved !== -1 && !STATE.werewolfIndices.includes(resolved)) {
                        tally[resolved] = (tally[resolved] || 0) + 1;
                    }
                }
                let maxVotes = 0;
                for (const [idx, count] of Object.entries(tally)) {
                    if (count > maxVotes) { maxVotes = count; attackTarget = parseInt(idx); }
                }
                if (attackTarget === -1) {
                    const cands = alive.filter(i => !STATE.werewolfIndices.includes(i));
                    if (cands.length > 0) attackTarget = cands[Math.floor(Math.random() * cands.length)];
                }
            }

            // --- 騎士: 護衛先決定 ---
            let guardTarget = -1;
            if (knightIdx !== -1 && STATE.characters[knightIdx].alive) {
                if (!isCurrentGame(token)) return null;
                try {
                    const j = JSON.parse(knightResponse);
                    const t = resolveAliveIndexByName(j.knight_target || '', knightIdx);
                    if (t !== -1) guardTarget = t;
                } catch (e) {}
                if (guardTarget === STATE.lastGuardedIdx) guardTarget = -1; // 連続護衛禁止
                if (guardTarget === -1) {
                    // 疑いが少ない=村人陣営っぽい人物を優先
                    const cands = STATE.aliveIndices.filter(i => i !== knightIdx && i !== STATE.lastGuardedIdx);
                    guardTarget = cands[Math.floor(Math.random() * cands.length)];
                }
                STATE.lastGuardedIdx = guardTarget;
            } else {
                STATE.lastGuardedIdx = -1;
            }

            // --- 占い師: 占い先決定 ---
            let fortuneTarget = -1;
            if (fortuneIdx !== -1 && STATE.characters[fortuneIdx].alive) {
                if (!isCurrentGame(token)) return null;
                try {
                    const j = JSON.parse(fortuneResponse);
                    let t = resolveAliveIndexByName(j.fortune_teller_target || '', fortuneIdx);
                    if (t !== -1 && STATE.fortuned.includes(t)) t = -1; // 占い済みの再占いは無効
                    if (t !== -1) fortuneTarget = t;
                } catch (e) {}
                if (fortuneTarget === -1) {
                    const cands = alive.filter(i => i !== fortuneIdx && !STATE.fortuned.includes(i));
                    const pool = cands.length ? cands : alive.filter(i => i !== fortuneIdx);
                    if (pool.length > 0) fortuneTarget = pool[Math.floor(Math.random() * pool.length)];
                }
            }

            // --- 襲撃実行（護衛で防げるかチェック） ---
            let victim = null;
            if (attackTarget !== -1 && STATE.characters[attackTarget].alive) {
                if (attackTarget === guardTarget) {
                    // 護衛成功: 誰も死なない（人狼側にも騎士側にも情報は出さない＝サイレント）
                    addSystemMessage(`😴 昨夜は誰も命を落としませんでした。`, 'info');
                } else {
                    STATE.characters[attackTarget].alive = false;
                    STATE.aliveIndices = STATE.aliveIndices.filter(i => i !== attackTarget);
                    STATE.characters[attackTarget].speech = '⚰️ 死亡';
                    victim = attackTarget;
                    STATE.nightDeaths.push(attackTarget);
                }
            }

            // --- 占い結果を秘密情報として保持 ---
            STATE.fortuneSecret = '';
            if (fortuneTarget !== -1 && STATE.characters[fortuneTarget] && fortuneIdx !== -1 && STATE.characters[fortuneIdx].alive) {
                const isWolf = STATE.werewolfIndices.includes(fortuneTarget);
                // 狂人は「村人」判定（人狼陣営だが占い結果は白）
                const result = isWolf ? '人狼' : '村人';
                const targetName = STATE.characters[fortuneTarget].name;
                STATE.fortuneSecret = `${targetName} は ${result} でした。`;
                STATE.fortuneHistory.push({ day: STATE.day, target: fortuneTarget, targetName, result });
                if (!STATE.fortuned.includes(fortuneTarget)) STATE.fortuned.push(fortuneTarget);
                addSystemMessage('🔮 占い師が今夜も村の誰かを占いました。', 'info');
            }

            // --- 霊媒: 前日処刑者の判定 ---
            if (mediumIdx !== -1 && STATE.characters[mediumIdx].alive && STATE.lastExecuted !== -1) {
                const t = STATE.lastExecuted;
                const isWolf = STATE.werewolfIndices.includes(t);
                const result = isWolf ? '人狼' : '村人';
                const targetName = STATE.characters[t].name;
                STATE.mediumHistory.push({ day: STATE.day, target: t, targetName, result });
                addSystemMessage('👻 霊媒師が処刑者の亡骸に語りかけました。', 'info');
            }

            renderCards();
            await fastWait();
            return victim;
        }

        // ===== Ver4.1: 発言順・疑い集計のヘルパー =====
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Ver5.1: 議論スケジュール生成
        // 全員が3ターン合計で最低1回発言。1ターン(ラウンド)内の同一キャラは最大2回。
        // 総発言数は生存者の約2倍にして、会話に強弱をつける。
        function buildDaySchedule(alive) {
            const n = alive.length;
            // 各キャラの発言回数: 全員1回 + 追加スロット（合計 ≒ alive*2.5、1人最大3回）
            const perChar = {};
            alive.forEach(i => perChar[i] = 1);
            let extra = Math.round(n * 1.5);
            const addOrder = shuffleArray(alive);
            let oi = 0, guard = 0;
            while (extra > 0 && guard < 1000) {
                guard++;
                const idx = addOrder[oi % n]; oi++;
                if (perChar[idx] < 3) { perChar[idx]++; extra--; }
            }
            const rounds = [[], [], []];
            // 第1パス: 全員の必須1回をラウンドロビンで分配 → 空ラウンドを防止
            shuffleArray(alive).forEach((idx, i) => {
                rounds[i % 3].push(idx);
                perChar[idx]--;
            });
            // 第2パス: 残りスロットをランダムに配る（1ラウンド内 同一キャラ最大2回）
            let rest = [];
            Object.entries(perChar).forEach(([i, c]) => { for (let k = 0; k < c; k++) rest.push(parseInt(i)); });
            rest = shuffleArray(rest);
            for (const idx of rest) {
                for (const r of shuffleArray([0, 1, 2])) {
                    if (rounds[r].filter(x => x === idx).length < 2) { rounds[r].push(idx); break; }
                }
            }
            // 修復: 総スロット数が3以上なのに空ラウンドがあれば、最も多いラウンドから1件移す
            const total = rounds[0].length + rounds[1].length + rounds[2].length;
            if (total >= 3) {
                for (let r = 0; r < 3; r++) {
                    if (rounds[r].length === 0) {
                        const src = [0, 1, 2].filter(x => x !== r)
                            .sort((a, b) => rounds[b].length - rounds[a].length)[0];
                        if (rounds[src].length >= 2) rounds[r].push(rounds[src].pop());
                    }
                }
            }
            // 同一キャラがラウンド内で連続しないよう並び替え（連続だとAIが同じセリフを複製しやすい）
            for (let i = 0; i < 3; i++) rounds[i] = deAdjacent(shuffleArray(rounds[i]));
            return rounds;
        }

        // 同じ要素が隣接しないよう貪欲に並び替える
        function deAdjacent(arr) {
            const a = [...arr];
            for (let i = 1; i < a.length; i++) {
                if (a[i] === a[i - 1]) {
                    let swapped = false;
                    for (let j = i + 1; j < a.length; j++) {
                        if (a[j] !== a[i - 1] && (j + 1 >= a.length || a[j + 1] !== a[i])) {
                            [a[i], a[j]] = [a[j], a[i]];
                            swapped = true;
                            break;
                        }
                    }
                    if (!swapped) break; // 入れ替え不能なら諦める（極少数人の終盤のみ）
                }
            }
            return a;
        }

        function suspicionRanking() {
            return Object.entries(STATE.suspicion)
                .map(([name, count]) => [name, count])
                .sort((a, b) => b[1] - a[1]);
        }

        // 発言テキストから「○○が怪しい」を検出してスコア加算（部分名・呼び捨ても検出）
        function recordSuspicion(text, speakerIdx) {
            if (!text) return;
            STATE.aliveIndices.forEach(i => {
                if (i === speakerIdx) return;
                const c = STATE.characters[i];
                const mentioned = nameAliases(c.name).some(a => a.length >= 2 && text.includes(a));
                if (mentioned && /怪しい|疑わ|人狼|黒(?:だ|っぽ|じゃ|の可能性)|白じゃない|信用できない/.test(text)) {
                    STATE.suspicion[c.name] = (STATE.suspicion[c.name] || 0) + 1;
                }
            });
        }

        // CO宣言を検出して記録（占い師/霊媒師/騎士を名乗ったか）
        function recordCO(text, speakerIdx) {
            if (!text) return;
            if (!/占い師|霊媒師|騎士/.test(text)) return;
            if (!/私は|ボクは|俺は|僕は|あたしは|わたくしは|わしは|自分は|拙者は/.test(text)) return;
            const m = text.match(/占い師|霊媒師|騎士/);
            if (!m) return;
            // 既に同じ人・同じ役職で記録済みなら追加しない
            const already = STATE.coClaims.some(c => c.idx === speakerIdx && c.role === m[0]);
            if (!already) {
                STATE.coClaims.push({ idx: speakerIdx, name: STATE.characters[speakerIdx].name, role: m[0], day: STATE.day });
            }
        }

        // 同一人物による口癖フレーズの使い回しを検出（12文字以上の部分文字列の再利用）
        function hasRepeatedPhrase(speech, speakerName) {
            const norm = speech.replace(/[\s\*。、！？!?…~ー「」『』]/g, '');
            const past = STATE.conversationLog.filter(e => e.name === speakerName);
            for (const e of past) {
                const en = e.speech.replace(/[\s\*。、！？!?…~ー「」『』]/g, '');
                // 過去の発言に含まれる12文字以上の部分文字列が今回の発言にも含まれるか
                for (let len = Math.min(20, en.length); len >= 12; len--) {
                    for (let st = 0; st + len <= en.length; st += 4) {
                        const sub = en.slice(st, st + len);
                        if (sub.length >= 12 && norm.includes(sub)) return true;
                    }
                }
            }
            return false;
        }

        // 疑いスコアに基づいて投票先を決める（フォールバック用）。
        // 全員が同じトップに収束しないよう、投票者ごとにランキングの参照位置をずらす
        function pickBySuspicion(voterIdx) {
            const isWolf = STATE.werewolfIndices.includes(voterIdx);
            const ranking = suspicionRanking()
                .map(([name]) => name)
                .filter(name => {
                    const idx = STATE.characters.findIndex(c => c.name === name);
                    return idx !== -1 && STATE.aliveIndices.includes(idx) && idx !== voterIdx
                        && !(isWolf && STATE.werewolfIndices.includes(idx));
                });
            if (ranking.length > 0) {
                // 上位3候補からランダムに選ぶ（全員が同じトップに収束するのを防ぐ）
                const pool = ranking.slice(0, Math.min(3, ranking.length));
                return pool[Math.floor(Math.random() * pool.length)];
            }
            const candidates = STATE.aliveIndices.filter(i =>
                i !== voterIdx && (!isWolf || !STATE.werewolfIndices.includes(i))
            );
            if (candidates.length === 0) return '';
            return STATE.characters[candidates[Math.floor(Math.random() * candidates.length)]].name;
        }

        // ===== Ver4.2: 名前のあいまい解決（投票・襲撃・占い・疑い集計用） =====
        function nameAliases(name) {
            const aliases = [name];
            if (name.length > 3) aliases.push(name.slice(-3));
            if (name.length > 2) aliases.push(name.slice(-2));
            return [...new Set(aliases)];
        }

        function nameMatches(input, fullName) {
            if (!input) return false;
            input = String(input).replace(/[「」『』（）()\s]/g, '').replace(/(お姉ちゃん|お兄ちゃん|さん|くん|君|ちゃん|様|さま|先生|殿|どの)+$/g, '');
            if (!input) return false;
            if (input === fullName) return true;
            if (input.length >= 2 && fullName.includes(input)) return true;
            return nameAliases(fullName).some(a => a === input || (input.length >= 2 && input.includes(a)));
        }

        // 名前表記から生存者のindexを特定（部分名・敬称付きも許容）
        function resolveAliveIndexByName(str, excludeIdx = -1) {
            if (!str) return -1;
            const exact = STATE.characters.find(c => c.name === str && STATE.aliveIndices.includes(c.index) && c.index !== excludeIdx);
            if (exact) return exact.index;
            for (const i of STATE.aliveIndices) {
                if (i === excludeIdx) continue;
                if (nameMatches(str, STATE.characters[i].name)) return i;
            }
            return -1;
        }

        // ===== Ver4.2: 発言の生成（3〜4人ずつのチャンク方式でAPI回数を削減） =====
        const SPEECH_CHUNK = 3;

        function pacingMs(speech) {
            // 長いセリフほど読む時間を確保（読み終わる前に次が出ないように）
            return Math.min(6200, Math.max(1900, speech.length * 95));
        }

        async function fetchSpeechChunk(chunkIdxs, round, roundSpokenSnapshot, priorLog, attempt = 0) {
            let thinking = null;
            try {
                // 名前を出さない汎用インジケーター（実際の発言者とズレて表示される問題を回避）
                thinking = showThinking('💬 発言を考えています…');
                const prompt = buildChunkPrompt(chunkIdxs, round, roundSpokenSnapshot, priorLog);
                const response = await callGemini(prompt, true, 4000);
                if (thinking) thinking.remove();
                let parsed = null;
                try { parsed = JSON.parse(response); } catch (e) { parsed = null; }
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                    if (attempt < 1) return fetchSpeechChunk(chunkIdxs, round, roundSpokenSnapshot, priorLog, attempt + 1);
                    return null;
                }
                return parsed;
            } catch (e) {
                if (thinking) thinking.remove();
                console.warn('発言チャンク生成失敗:', e);
                if (attempt < 1) return fetchSpeechChunk(chunkIdxs, round, roundSpokenSnapshot, priorLog, attempt + 1);
                return null;
            }
        }

        async function dayDiscussion(round, token) {
            const alive = STATE.aliveIndices;
            if (alive.length < 2) return;

            // Ver5.1: 事前生成されたスケジュールの発言者リストを使用
            // （このラウンドで喋るのはここに含まれる人だけ。同一キャラ最大2回まで）
            const order = (STATE.daySchedule[round - 1] || []).filter(i => STATE.characters[i].alive);
            if (order.length === 0) return;
            const priorLog = STATE.conversationLog.slice(-14);
            const roundSpoken = [];
            const messages = [];

            let pendingFetch = null;
            for (let k = 0; k < order.length; k += SPEECH_CHUNK) {
                if (!isCurrentGame(token)) break;
                const chunkIdxs = order.slice(k, k + SPEECH_CHUNK);

                if (pendingFetch === null) {
                    pendingFetch = fetchSpeechChunk(chunkIdxs, round, roundSpoken.slice(), priorLog);
                }
                let parsed = null;
                try { parsed = await pendingFetch; } catch (e) { parsed = null; }
                pendingFetch = null;
                if (!isCurrentGame(token)) break;

                const chunkMsgs = [];
                if (parsed) {
                    // JSONのキー順ではなく、こちらが決めた発言順で取り出す（並び替えバグ防止）
                    for (const sidx of chunkIdxs) {
                        const name = STATE.characters[sidx].name;
                        let speech = parsed[name];
                        if (speech === undefined) {
                            const key = Object.keys(parsed).find(kk => nameMatches(kk, name));
                            if (key) speech = parsed[key];
                        }
                        if (!speech) continue;
                        speech = String(speech).trim().replace(/^["'「『]+|["'」』]+$/g, '').trim();
                        if (speech.length < 2) continue;
                        if (speech.length > 220) speech = speech.slice(0, 220) + '…';
                        // 同一人物による同一・ほぼ同一セリフの複製をスキップ（全履歴で正規化比較・類似度もチェック）
                        const norm = speech.replace(/[\s\*。、！？!?…~ー「」『』]/g, '');
                        const allPast = roundSpoken.concat(STATE.conversationLog);
                        const isDup = allPast.some(e => {
                            if (e.name !== name) return false;
                            const en = e.speech.replace(/[\s\*。、！？!?…~ー「」『』]/g, '');
                            if (en === norm) return true;
                            const minLen = Math.min(en.length, norm.length);
                            // 短い方の全文が長い方の先頭と一致＝前文＋αの焼き直しリピート
                            if (minLen >= 18 && en.slice(0, minLen) === norm.slice(0, minLen)) return true;
                            // bigram（2文字組）Jaccard類似度：先頭を言い換えた焼き直し（「そうだな、…様子を見ようぜ」型）も語幹一致で捕捉
                            if (minLen >= 14) {
                                const grams = s => { const g = new Set(); for (let p = 0; p < s.length - 1; p++) g.add(s.slice(p, p + 2)); return g; };
                                const g1 = grams(en), g2 = grams(norm);
                                let inter = 0;
                                for (const g of g1) if (g2.has(g)) inter++;
                                // 包含率（overlap係数）: 短い方のbigramの8割以上が長い方に含まれれば焼き直しリピートとみなす
                                // （「そうだな、始まったばかりだし…様子を見ようぜ」が前文＋αの長文に包含される型を捕捉）
                                const smaller = Math.min(g1.size, g2.size);
                                if (smaller > 0 && inter / smaller >= 0.8) return true;
                            }
                            return false;
                        });
                        // リピート・口癖使い回し・同じ太字フレーズの再使用は「……。」で誤魔化さず発言自体をスキップ
                        if (isDup || hasRepeatedPhrase(speech, name) || hasRepeatedBold(speech, name)) {
                            continue;
                        }
                        // 自分自身の名前を含む太字（自爆表記）はマーカーだけ剥がす
                        speech = speech.replace(/\*\*([^*]+)\*\*/g, (mm, inner) =>
                            inner.includes(name) ? inner : mm);
                        STATE.characters[sidx].speech = speech;
                        recordSuspicion(speech, sidx);
                        recordCO(speech, sidx);
                        recordPublicResult(speech);
                        chunkMsgs.push({ idx: sidx, name, speech });
                        roundSpoken.push({ name, speech });
                    }
                } else {
                    addSystemMessage('⚠️ 発言の生成に失敗しました（このターンは一部スキップ）', 'info');
                }

                // 次のチャンクの生成を先読み（表示中にAPIを叩いて待ち時間を消す）
                if (k + SPEECH_CHUNK < order.length) {
                    pendingFetch = fetchSpeechChunk(order.slice(k + SPEECH_CHUNK, k + SPEECH_CHUNK * 2), round, roundSpoken.slice(), priorLog);
                }

                for (const m of chunkMsgs) {
                    if (!isCurrentGame(token)) break;
                    if (STATE.paused) await waitUntilResume();
                    if (!isCurrentGame(token)) break;
                    addConversationMessage(m.idx, m.speech);
                    renderCards();
                    await waitFor(pacingMs(m.speech));
                }

                messages.push(...chunkMsgs);
            }

            STATE.conversationLog = STATE.conversationLog.concat(
                messages.map(m => ({ name: m.name, speech: m.speech }))
            );
            await wait(STATE.speed);
        }

        function waitFor(ms) {
            return new Promise(r => {
                if (STATE.paused) {
                    const iv = setInterval(() => {
                        if (!STATE.paused) {
                            clearInterval(iv);
                            setTimeout(r, ms);
                        }
                    }, 100);
                } else {
                    setTimeout(r, ms);
                }
            });
        }

        async function votingPhase(token) {
            const alive = STATE.aliveIndices;
            if (alive.length < 2) return;

            const thinking = showThinking('投票先を決めています…');
            const prompt = buildVotePrompt();
            const response = await callGemini(prompt);
            if (thinking) thinking.remove();
            if (!isCurrentGame(token)) return;
            let votes = {};
            try {
                votes = JSON.parse(response);
            } catch (e) {
                // フォールバック：議論での疑いが高い生存者に投票
                alive.forEach(idx => {
                    votes[STATE.characters[idx].name] = pickBySuspicion(idx);
                });
            }

            const tally = {};
            const voteEntries = [];
            let abstainCount = 0;

            alive.forEach(idx => {
                const voterName = STATE.characters[idx].name;
                let targetName = votes[voterName] || '';

                const isAbstain = !targetName || ['見送り', 'なし', '棄権', 'abstain', 'none', 'わからない', '不明'].some(k => targetName.includes(k));

                if (isAbstain) {
                    // 見送りが出た場合の自動投票:
                    // - 終盤（生存5人以下）: 見送り＝敗北なので無条件で最も怪しい人物に自動投票
                    // - それ以外の2日目以降: 議論で明確に疑われた人物（2回以上言及）がいる時だけ自動投票
                    const top = suspicionRanking().filter(([nm]) => nm !== voterName);
                    const endgame = STATE.aliveIndices.length <= 5 && STATE.day >= 2;
                    if (endgame || (STATE.day >= 2 && top.length > 0 && top[0][1] >= 2)) {
                        targetName = pickBySuspicion(idx);
                    } else {
                        targetName = '';
                    }
                    const autoIdx = targetName ? resolveAliveIndexByName(targetName, idx) : -1;
                    if (autoIdx !== -1) {
                        tally[autoIdx] = (tally[autoIdx] || 0) + 1;
                    } else {
                        abstainCount++;
                        targetName = '見送り';
                    }
                } else {
                    const targetIdx = resolveAliveIndexByName(targetName, idx);
                    if (targetIdx !== -1) {
                        tally[targetIdx] = (tally[targetIdx] || 0) + 1;
                    } else {
                        abstainCount++;
                        targetName = '見送り';
                    }
                }
                voteEntries.push({ voter: voterName, target: targetName });
            });

            for (let i = 0; i < voteEntries.length; i++) {
                if (!isCurrentGame(token)) break;
                if (STATE.paused) await waitUntilResume();
                if (!isCurrentGame(token)) break;
                const e = voteEntries[i];
                addVoteMessage(e.voter, e.target);
                await waitFor(900);
            }

            if (Object.keys(tally).length === 0) {
                addSystemMessage('⚖️ 全員が投票を見送りました。処刑者は決まりませんでした。', 'vote');
                renderCards();
                await fastWait();
                return;
            }

            const maxVoteCount = Math.max(...Object.values(tally));
            const topCandidates = Object.entries(tally).filter(([, count]) => count === maxVoteCount);

            let executed = -1;
            if (topCandidates.length > 1) {
                // 同票の場合は処刑なし（人狼ゲームの標準ルール。疑いスコアでの独断処刑はしない）
                const names = topCandidates.map(([idx]) => STATE.characters[parseInt(idx)].name);
                addSystemMessage(`⚖️ 投票が ${names.join('・')} で同数（${maxVoteCount}票）のため、処刑者は決まりませんでした。`, 'vote');
            }
            else if (maxVoteCount <= abstainCount) {
                const topName = STATE.characters[parseInt(topCandidates[0][0])].name;
                addSystemMessage(`⚖️ ${topName}が${maxVoteCount}票を集めましたが、見送り（${abstainCount}票）を上回らなかったため、信任不足で処刑は見送られました。`, 'vote');
            }
            else {
                executed = parseInt(topCandidates[0][0]);
            }

            if (executed !== -1 && STATE.characters[executed].alive) {
                STATE.characters[executed].alive = false;
                STATE.aliveIndices = STATE.aliveIndices.filter(i => i !== executed);
                STATE.characters[executed].speech = '⚰️ 処刑';
                STATE.lastExecuted = executed;
                addSystemMessage(`⚖️ ${STATE.characters[executed].name}（${roleJa(STATE.characters[executed].role)}）が処刑されました。`, 'reveal');
            } else {
                STATE.lastExecuted = -1;
            }
            renderCards();
            await fastWait();
        }

        // 役職の日本語名
        function roleJa(role) {
            return {
                werewolf: '人狼', villager: '村人', fortuneteller: '占い師',
                medium: '霊媒師', knight: '騎士', madman: '狂人'
            }[role] || '不明';
        }

        // 陣営（狂人は人狼陣営）
        function factionOf(role) {
            return (role === 'werewolf' || role === 'madman') ? 'wolf' : 'village';
        }

        function checkGameEnd() {
            const aliveWolves = STATE.werewolfIndices.filter(idx => STATE.characters[idx].alive);
            // 人数カウントは標準ルール: 狂人も「人間」として数える（人狼数 >= 人間数で人狼勝利）
            const aliveVillageSide = STATE.aliveIndices.filter(i => STATE.characters[i].role !== 'werewolf');

            if (aliveWolves.length === 0) {
                addSystemMessage('🎉 村人陣営の勝利！人狼を全て退治しました！', 'win');
                STATE.running = false;
                setPhase('🏆 村人勝利！', 'end');
                return true;
            }
            // 人狼数 >= 村人陣営数 で人狼勝利
            if (aliveWolves.length >= aliveVillageSide.length) {
                addSystemMessage('🐺 人狼陣営の勝利！村人は絶滅しました。', 'win');
                STATE.running = false;
                setPhase('🏆 人狼勝利！', 'end');
                return true;
            }
            return false;
        }

        function addSystemMessage(text, type = 'info', copyOnly = false) {
            const area = document.getElementById('messageArea');
            const time = new Date().toLocaleTimeString();
            STATE.fullLog.push({ time, kind: 'system', text });
            if (copyOnly) return; // ログコピー専用メッセージ（画面には出さない）
            if (!area) return;
            const div = document.createElement('div');
            div.className = `msg-system ${type}`;
            div.innerHTML = `<span class="msg-time">${time}</span> `;
            const span = document.createElement('span');
            span.textContent = text;
            div.appendChild(span);
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addConversationMessage(charIdx, text) {
            const area = document.getElementById('messageArea');
            if (!area) return;
            const c = STATE.characters[charIdx];
            const div = document.createElement('div');
            div.className = 'msg-conversation';

            const avatarDiv = document.createElement('div');
            if (c.imageUrl) {
                const img = document.createElement('img');
                img.className = 'avatar';
                img.src = c.imageUrl;
                img.onerror = function() { this.style.display = 'none'; this.nextElementSibling.style.display = 'flex'; };
                avatarDiv.appendChild(img);
                const placeholder = document.createElement('div');
                placeholder.className = 'avatar-placeholder';
                placeholder.style.display = 'none';
                placeholder.textContent = c.name.charAt(0);
                avatarDiv.appendChild(placeholder);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'avatar-placeholder';
                placeholder.textContent = c.name.charAt(0);
                avatarDiv.appendChild(placeholder);
            }
            div.appendChild(avatarDiv);

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const nameSpan = document.createElement('div');
            nameSpan.className = 'name';
            const time = new Date().toLocaleTimeString();
            STATE.fullLog.push({ time, kind: 'speech', name: c.name, role: c.role ? roleJa(c.role) : '', text });
            const roleTag = c.role ? `<span class="role-tag">(${roleJa(c.role)})</span>` : '';
            nameSpan.innerHTML = `${escapeHtml(c.name)}${roleTag} <span class="msg-time">${time}</span>`;
            bubble.appendChild(nameSpan);
            const textSpan = document.createElement('div');
            textSpan.className = 'text';
            // **太字**マークダウンを <strong> に変換（escapeHtml後に変換するので安全）
            textSpan.innerHTML = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            bubble.appendChild(textSpan);
            div.appendChild(bubble);

            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addVoteMessage(voter, target) {
            const area = document.getElementById('messageArea');
            if (!area) return;
            const div = document.createElement('div');
            div.className = 'msg-vote';
            const time = new Date().toLocaleTimeString();

            const voterChar = STATE.characters.find(c => c.name === voter);
            const targetChar = STATE.characters.find(c => c.name === target);
            STATE.fullLog.push({
                time, kind: 'vote', name: voter, role: voterChar && voterChar.role ? roleJa(voterChar.role) : '',
                text: target === '見送り' ? '見送り' : target,
                targetRole: targetChar && targetChar.role ? roleJa(targetChar.role) : ''
            });
            const voterTag = voterChar && voterChar.role ? `<span class="role-tag">(${roleJa(voterChar.role)})</span>` : '';
            const targetTag = targetChar && targetChar.role ? `<span class="role-tag">(${roleJa(targetChar.role)})</span>` : '';

            const isAbstain = target === '見送り';
            const actionText = isAbstain
                ? `<span class="vote-action">は投票を</span> <span class="target abstain">見送った</span>`
                : `<span class="vote-action">が</span> <span class="target">${escapeHtml(target)}${targetTag}</span> <span class="vote-action">に投票した</span>`;

            div.innerHTML = `<span class="msg-time">${time}</span> <span class="vote-icon">🗳️</span> <span class="voter">${escapeHtml(voter)}${voterTag}</span> ${actionText}`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        // 発言内で言及された占い・霊媒の判定を「公開済み情報」として記録する
        function recordPublicResult(speech) {
            if (!/(占|霊媒|結果|判定)/.test(speech)) return;
            for (const c of STATE.characters) {
                if (!speech.includes(c.name)) continue;
                let res = null;
                if (speech.includes('人狼')) res = '人狼';
                else if (speech.includes('村人')) res = '村人';
                if (!res) continue;
                const label = c.name + ' → ' + res;
                if (!STATE.publicResults.includes(label)) STATE.publicResults.push(label);
            }
        }

        // 同一人物が過去と同じ太字フレーズを使い回したか（「沙都子のその攻撃的すぎる態度」2連発型の防止）
        function hasRepeatedBold(speech, name) {
            const bolds = speech.match(/\*\*[^*]{4,}\*\*/g);
            if (!bolds) return false;
            const past = STATE.conversationLog.filter(e => e.name === name).map(e => e.speech).join('\n');
            return bolds.some(b => past.includes(b));
        }

        // COしていた人物が夜に襲撃された場合の推理材料を生成
        function buildCOInference() {
            const lines = [];
            for (const claim of STATE.coClaims) {
                const c = STATE.characters[claim.idx];
                if (!c) continue;
                if (!c.alive && STATE.nightDeaths.includes(claim.idx)) {
                    // COしていた人が夜に殺された → 本物の可能性が高い
                    lines.push(`・${claim.name}は${claim.day}日目に「自分は${claim.role}」とCOしていましたが、その後夜に襲撃されました。**人狼が真実を語る${claim.role}を殺した可能性が高い**ため、${claim.name}が名指しで疑っていた人物は強く疑うべきです。`);
                } else if (c.alive) {
                    lines.push(`・${claim.name}は${claim.day}日目に「自分は${claim.role}」とCOしています（現在も生存中）。`);
                }
            }
            if (lines.length === 0) return '';
            return '\n## CO（役職カミングアウト）の記録と推理材料\n' + lines.join('\n');
        }

        // ================================================================
        //  ★ プロンプトビルダー（Ver4.2: チャンク生成・因果ルール強化）
        // ================================================================
        function buildChunkPrompt(chunkIdxs, round, roundSpoken, priorLog) {
            const alive = STATE.aliveIndices;
            const n = STATE.characters.length;
            const aliveNames = alive.map(i => STATE.characters[i].name);
            const deadNames = STATE.characters.filter(c => !c.alive).map(c => c.name);
            const deadInfo = deadNames.length ? `死亡者（退場済み・発言しない）: ${deadNames.join('、')}` : '死亡者: なし';

            // 人狼だけが知る仲間情報
            const wolfNames = STATE.werewolfIndices.map(i => STATE.characters[i].name).join('・');
            // 狂人は自分の役職は知っているが人狼が誰かは知らない

            const roleDescs = {
                werewolf: `人狼（人狼陣営）。仲間の人狼: ${wolfNames}。正体を隠して村人・占い師・霊媒師などの偽COも自由。**偽COする時は結果もでっち上げて具体的に言うこと**（例:「私は占い師です。○○は人狼でした」）。占い師や騎士っぽい人物を襲撃で狙う。占われるとバレるので、鋭い村人陣営を先に潰したい`,
                villager: '村人（村人陣営）。特別な能力はない。議論から人狼を推理して処刑に導く。**疑われた時・信頼を得たい時は「私は村人だ」と名乗ってよい**（「俺は本当に村人だから信じてくれ」など）。ただし役職（占い師・霊媒師・騎士）を騙るのは村人にはリスクが大きいので基本しない',
                fortuneteller: `占い師（村人陣営）。毎晩1人を占って人狼か村人かを知る。**COする（自ら名乗る）と信頼を得やすいが人狼に襲撃されやすくなる**。COするタイミングは戦略次第。**COは初回の1回だけ。一度名乗った後は「私は占い師です」と言い直さず、『○○を占ったら××だった』と結果だけを伝えること**。**COする時は必ず具体的な結果をセットで言うこと。名乗るだけ・予告だけで結果を言わないのは厳禁**。**自分以外に占い師を名乗る者が現れたら、その人物は偽物（人狼か狂人）なので、必ず「私が本物の占い師です」と対抗して主張し、相手の矛盾を突くこと**。狂人は占い結果では「村人」と出る点に注意。※既に発表済みの占い結果を「昨夜の新事実」のように再発表してはいけない。触れる場合は「昨日も言った通り」と既知の情報として述べること`,
                medium: `霊媒師（村人陣営）。前日処刑された人物が人狼だったかを知る。**COは初回の1回だけ。以降は名乗り直さず結果だけを伝えること**。**COする時は必ず具体的な結果をセットで言うこと（例:「私は霊媒師です。処刑された○○は村人でした」）。名乗るだけ・予告だけで結果を言わないのは厳禁。霊媒履歴が空の時はCO自体をしてはいけない**。**自分以外に霊媒師を名乗る者が現れたら偽物なので、必ず「私が本物の霊媒師です」と対抗して主張すること**`,
                knight: `騎士（村人陣営）。毎晩1人を選び、その人を人狼の襲撃から守る（自分は選べない）。**COは基本しない方が良い**（人狼にバレると先に殺される）。ただし終盤に必要なら判断する`,
                madman: `狂人（人狼陣営）。自分は人間だが人狼の勝利が自分の勝ちになる。**人狼が誰かは知らない**。村人のふりをしつつ議論を混乱させ、偽の占い師CO・偽の霊媒師COも有効（**偽COでは結果もでっち上げて具体的に言う**。「○○は人狼でした」と嘘の黒判定を振りまくのも手）。占いでは「村人」判定なので占われても白と出る`
            };

            // 占い履歴/霊媒履歴（該当役職本人のみ渡す）
            const fortuneHist = STATE.fortuneHistory.length
                ? STATE.fortuneHistory.map(h => `${h.day === 0 ? '初日夜' : h.day + '日目夜'}: ${h.targetName} → ${h.result}`).join(' / ')
                : 'まだ占っていない';
            const mediumHist = STATE.mediumHistory.length
                ? STATE.mediumHistory.map(h => `${h.day}日目: ${h.targetName} → ${h.result}`).join(' / ')
                : '【空・まだ誰も処刑されていないか結果が出ていない＝あなたは現在「言える結果」を何も持っていない。霊媒師COをしても中身を言えず嘘つきに見えるだけなので、結果が出るまでは絶対にCOしないこと】';

            const profiles = chunkIdxs.map((sidx, pos) => {
                const c = STATE.characters[sidx];
                let secret = '';
                if (sidx === STATE.fortuneTellerIndex && STATE.characters[sidx].alive) {
                    secret = `\n【${c.name}だけの秘密情報】占い履歴: ${fortuneHist}`;
                }
                if (sidx === STATE.mediumIndex && STATE.characters[sidx].alive) {
                    secret = `\n【${c.name}だけの秘密情報】霊媒履歴: ${mediumHist}`;
                }
                const roleLabel = roleDescs[c.role] || '村人';
                const sus = c.suspicionLevel || '中';
                // 既にCO済みのキャラには「再び名乗るな」と明記
                const coAgain = STATE.coClaims.some(cl => cl.idx === sidx)
                    ? `\n【${c.name}の注意】あなたは既に役職CO済みです。「私は占い師です」などと名乗り直さず、新しい結果や推理だけを話すこと。`
                    : '';
                return `■ 発言者${pos + 1}: ${c.name}（『${c.anime}』／役職: ${roleLabel}／疑心度: ${sus}）${secret}${coAgain}\n設定: ${c.description}`;
            }).join('\n\n');

            const transcript = roundSpoken.length > 0
                ? roundSpoken.map(e => `・${e.name}: 「${e.speech}」`).join('\n')
                : '（このラウンドではまだ誰も発言していません）';

            let pastDigest = '';
            if (priorLog.length > 0) {
                pastDigest = '\n## ここまでの議論の流れ（過去の発言）\n' + priorLog.map(e => `・${e.name}: 「${e.speech}」`).join('\n');
            }

            const aliveRank = suspicionRanking().filter(([name]) => aliveNames.includes(name));
            const publicLine = STATE.publicResults.length
                ? `\n## 既に公開済みの占い・霊媒の結果（全員が既に知っている既知情報）\n` + STATE.publicResults.map(r => '・' + r).join('\n') + '\n※これらに対して驚く・初めて聞く反応・「今すごいことを言った」などの初見の反応は厳禁。触れる場合は「さっき言っていた通り」のように既知の話題として扱うこと。'
                : '';
            const suspicionLine = aliveRank.length
                ? `\n## これまでに「怪しい」と疑われた人物（言及回数）\n` + aliveRank.map(([name, cnt]) => `・${name}: ${cnt}回`).join('\n')
                : '';

            const dayWord = STATE.day === 1 ? '初日' : `${STATE.day}日目`;
            // その日の最初の発言者（round=1 かつまだ誰も喋っていないチャンク先頭）だけが日付の挨拶をしてよい
            const isDayOpening = (round === 1 && roundSpoken.length === 0);

            // CO追跡: COしていた人が夜に殺された場合の推理材料
            const coNote = buildCOInference();

            // 新しい日の冒頭の注記（前日の議論の蒸し返し防止）
            const newDayNote = STATE.day > 1
                ? '\n- 今日は新しい日です。前日の議論をそのまま引用して会話を続けるのは不自然です。昨夜の出来事（死者の有無）への反応と、今日の新しい推理から始めてください。'
                : '';

            // チャンク内で同一キャラが複数回出る場合の注記（同じセリフの複製を防ぐ）
            const seenInChunk = {};
            const dupNames = [];
            chunkIdxs.forEach((i, pos) => {
                const nm = STATE.characters[i].name;
                if (seenInChunk[nm] !== undefined) dupNames.push(`発言者${seenInChunk[nm] + 1}と発言者${pos + 1}は同一人物（${nm}）`);
                else seenInChunk[nm] = pos;
            });
            const dupNote = dupNames.length
                ? `\n## 同一人物の複数回発言について\n${dupNames.join('、')}です。**2回目のセリフは1回目とは内容も言い回しも完全に変えること。同じ文・同じ趣旨の言い換えの複製は厳禁**（1回目の発言に対する他者の反応や、会話が進んだ後の新しい視点として書いてください）。`
                : '';
            const keyOrder = chunkIdxs.map(i => `"${STATE.characters[i].name}": "セリフ"`).join(',\n  ');

            const griefRule = (isDayOpening && STATE.day > 1 && STATE.lastNightVictim !== null && STATE.characters[STATE.lastNightVictim])
                ? `\n- 昨夜 ${STATE.characters[STATE.lastNightVictim].name} が殺されました。**このチャンクの発言者1は、必ずこの死へのそのキャラらしい感情反応（悲しみ・怒り・動揺・困惑など）から発言を始めること。**発言者2・3も、初手はこの死に触れてから本題に入ること。`
                : '';
            const dayGreetRule = isDayOpening
                ? `\n- このチャンクの**発言者1だけ**が「今日で${STATE.day}日目か」「もう${STATE.day}日目だね」のように日付（${STATE.day}日目という数字）に触れてよい。発言者2以降は日付に一切触れないこと。${griefRule}`
                : `\n- **このタイミングでは誰も「○日目」など日付には一切触れないこと**（既に今日の議論は始まっています）。「○」のようなプレースホルダを出力してはいけません。いきなり本題に入ってください。`;

            return `あなたは人狼ゲームの昼議論の脚本家です。以下の${chunkIdxs.length}件のセリフを、指定された発言順そのままで作成してください（同じキャラが2回出る場合は会話の流れを受けた別のセリフにすること）。${dayGreetRule}

【情報統制の絶対ルール】
- 各キャラは「自分の役職」と「このプロンプト内の会話ログで実際に口に出された内容」しか知りません。まだ誰も口にしていない占い結果・他人の役職を、知っているかのように書くのは厳禁です。例：占い師本人が結果を明かす前に、他者が「占い結果が出た」「○○が人狼だと結果が出た」と反応するのは禁止。
- 実際に言われていない発言を「言った」と反応するのも厳禁。例：誰も「○○は人狼」と言っていないのに「今度は私を人狼だって言うのか」と反応しない。

## 状況
- ${dayWord}・昼の議論 ${round}回目（生存${alive.length}人 / 全${n}人）
- 生存者: ${aliveNames.join('、')}
- ${deadInfo}${newDayNote}
${pastDigest}

## このラウンドで既に発言した人（時系列・これが全て）
${transcript}
${suspicionLine}${publicLine}

## 今回セリフを書くキャラクター（この番号順＝発言順）
${profiles}
${dupNote}

${coNote}

## 絶対ルール
0. **死亡者への言及禁止**: 上の「死亡者」リストに載っている人物は既に死んでいます。**死んだ人に話しかけたり・名前を出して質問したり・「○○さんはどう思う」と聞くのは絶対にやめてください**（死人に口なし）。死亡者に触れる場合は「○○がいなくなって寂しい」のような追悼の言及のみ許可します。
0.5. **話題に出せる人物の限定**: 言及できるのは上の「生存者」「死亡者」リストに載っている人物だけです。**このゲームに参加していない人物（原作の他キャラクターなど）の名前は絶対に出さないこと。**他者への同意・引用も、生存者リストにある人物の実際の発言に対してのみ行ってください。
0.6. **他人の口調の借用禁止**: 他のキャラクターの口癖・語尾・決め台詞を使ってはいけません。自分の設定にある口調だけを使うこと。
0.7. **白判定された側の反応**: 占い師・霊媒師から「○○は村人」と白判定された本人は、当然それを歓迎します（「ほら言った通りだろ」「ありがとう、信じてくれて助かる」など）。**白判定に対して「それ本当なのかよ」と動揺したり疑ったりするのはおかしい**——あなたは自分が村人陣営であることを知っているのですから。
0.8. **隠している役職名は口にしない**: 自分の役職をまだ名乗っていないキャラは、「俺は霊媒師なんて名乗ってない」「私は占い師とは言っていない」など、**自分の本当の役職名を否定文でも絶対に口にしないこと**（名乗っていないのに役職名が出る時点でバレています）。
1. **発言順の因果**: 各キャラが引用・同意・反論できるのは「このラウンドで既に発言した人」と、番号が自分より前のキャラの発言だけ。自分より後のキャラが「言った内容」に触れるのは厳禁（後のキャラに話を振る・質問するのはOK）。**特に自分の1つ前の発言者の内容には必ず何らかの反応を示すこと**（同意・反論・質問・補足のいずれか。完全に無視して別話題を始めるのは不自然）。また、**まだその話題に態度を示していない人物の行動を捏造するのも禁止**です（例: 誰も賛成していないのに「○○まで肩を持つのか」と言う等）。
1.5. **重大な宣告への即応答**: 直前の発言が役職CO（占い師・霊媒師などの名乗り）や占い・霊媒結果の公表を含む場合、**その次に喋るキャラは必ずその宣告に反応すること**（驚き・疑い・質問など）。重大な情報を全員がスルーするのは不自然です。
1.6. **COの重複は矛盾**: 同じ役職はこのゲームに1人しかいません。上の「COの記録」に占い師を名乗った人物がいるのに別の人が「私が占い師です」と言うのは、どちらかが嘘つきという重大な対立です。**真の役職持ちは偽COに対して必ず「私が本物です」と対抗主張してください**（本物同士が黙っていることはあり得ません）。
2. **キャラ再現の徹底**: 各キャラの【一人称】【語尾】【口癖】はもちろん、【他者の呼び方】も設定通りに厳密に守る。設定にない呼び方・口調は使わない。
3. **人間らしさ最重要**: 全員が「〜が怪しい」しか言わないのはNG。実際の議論では**雑談・観察・冗談・「まだ分からない」で終わる発言・話題の脱線**なども混ざる。設定の【疑心度】が「低」のキャラは擁護や場を和ませる発言を優先し、「高」のキャラだけが積極的に疑う。**チャンク内で「誰かを疑う」発言は多くても半分以下**にする（残りは反応・質問・観察・雑談・様子見）。**人間らしい話し言葉のために、言い淀み・ため息・短い相槌（「えっと」「……」「あー」「まあな」などそのキャラらしいフィラー）を自然に使ってよい。全員が整った完璧な文章で喋るのは不自然です。**

### 信用のバランス（重要）
人狼ゲームは疑心暗鬼だけのゲームではありません。**信頼も立派な戦略です**:
- 占い師・霊媒師が具体的な結果（「○○は村人だった」）を公表したら、**それを一つの信頼材料として受け入れるのが普通**です。「すぐ信じるのは危険」と全員が拒否し続けるのは不自然です。疑うなら「なぜ偽物だと思うか」の具体的根拠を述べること。
- 白判定された人物を「その人を信じる仲間」として扱い、残りの未判定者に推理を絞り込むのが健全な議論です。
- 「誰も信じられない」と言い続けるだけのキャラは、逆に**情報を出さずに場を濁す人狼**に見えます。**ただし、まだ誰も具体的に疑われていない状況で、根拠なくいきなり「○○が人狼」と断言したり疑いを捏造するのは厳禁**（「ちょっと様子が気になる」「もっと話を聞きたい」程度の違和感の表明や質問はOK）。すでに誰かへの疑いが議場に出ている場合は、それへの賛否を自分の視点で述べること。
3.5. **追随だけの発言を疑う**: 「〜の言う通り」「みんなで様子を見よう」ばかりで自分の意見を一度も言わない人物は、人狼が目立たないよう隠れている典型パターンです。誰かがそういう振る舞いを続けていたら、鋭いキャラは「お前は自分の意見を言わなさすぎじゃないか」と突っ込んでよい。
3.6. **自分の過去発言の言い換え禁止**: 過去の議論ログに自分自身の発言がある場合、それと同じ趣旨の発言を繰り返すのは厳禁。必ず新しい内容・新しい視点・新しい疑問を述べること（「また同じことを言っているキャラ」は壊れて見える）。
4. **カミングアウト(CO)の扱い（重要・自然に）**:
   - **占い師/霊媒師**: 自分の判定結果を活かすには「私は占い師だ」「私は霊媒師だ」と名乗る必要がある。ただし**名乗ると人狼に襲撃されるリスクが上がる**ため、タイミングはキャラの性格次第。慎重なキャラは温存し、直感的なキャラは早めに動く。**初日から即COする必要はない**——通常は2日目以降、疑いが強まった時や情報を出したい時に。
   - **人狼/狂人**: 「私は村人だ」「私は占い師だ（偽CO）」など騙りは自由。ただし本物とバッティングすると危険なので、キャラの性格に合った動きを。
   - **村人/騎士**: 自分から「私は村人だ」と言うのは自由（疑いを晴らしたい時など）。ただし**騎士は正体を明かすと即殺されるのでCOは基本避ける**。
   - 全員: 名乗る時は「私は占い師です。○○を占ったら人狼でした」のように**セリフの中に自然に混ぜる**。棒読みの宣言口調は避ける。
5. **同じ話題の反復を避ける**: 直前ラウンドで「お茶」「のんびり」など同じテーマが繰り返されていたら、必ず別の切り口（誰の発言が矛盾していたか・沈黙している人がいるか等）に議論を進める。**同じ雑談を全員で続けるのは厳禁**。
6. **太字のバランス**: 太字は「**人名＋疑い・指摘・推理の核心**」の最小部分だけを囲む（良い例:「**沙都子が人狼**だと思う」「**圭一の発言、さっきと矛盾してる**ぞ」／悪い例:「**私は沙都子が人狼だと思うのですわよ**」←長すぎ、「**今日はいい天気**」←重要でない文）。**1発言につき最大1箇所**。**チャンク全体（3件前後）の中で太字を含む発言は必ず1〜2件入れること**（議論の山場・核心が読み手に分かるようにするため。0件はダメ、3件全部もダメ）。占い師・霊媒師が結果を公表する時はその結果部分を太字にすること。
7. **長さ**: 1〜2文（40〜90文字目安・それを超えて延々と話さない）。**短くていい発言は短く**——「そうかもね」「……微妙だな」「様子見ようぜ」だけで終わる発言もOK。無理に長文にして同じことを繰り返したり不自然な言い回しをするのは厳禁。饒舌なキャラでも3文まで。前の人の発言をなぞった長い言い換えは禁止。
8. セリフに引用符（「」『』）は付けない。話し言葉そのままを書く。
9. **同一チャンク内で、全く同じ文・ほぼ同じ文を2回出力するのは厳禁**。各セリフは必ず内容の異なる独立した発言にすること。
10. **会話のパターンを混ぜる**: 以下のような実際の人狼らしいやり取りを意識的に織り交ぜること。
   - 意見の提示＋問いかけ: 「俺は○○が怪しいと思うけど、みんなはどう思う？」
   - 同調＋発展: 「自分もそう思う。しかも○○はさっき…」
   - 反論: 「いや、それは違うと思う。○○はむしろ…」
   - 観察のみ: 「○○がずっと黙ってるのが気になる」
   全員が「○○が怪しい」の断言だけを繰り返すのは厳禁。

## 出力（JSONのみ・前置き不要・キーの順序＝発言順）
{
  ${keyOrder}
}`;
        }

        function buildKnightNightPrompt() {
            const idx = STATE.knightIndex;
            const alive = STATE.aliveIndices;
            const cands = alive.filter(i => i !== idx);
            const lastGuardNote = (STATE.lastGuardedIdx !== -1 && STATE.characters[STATE.lastGuardedIdx])
                ? `\n※昨夜あなたは ${STATE.characters[STATE.lastGuardedIdx].name} を護衛しました。標準ルールにより同じ人物を2晩連続で護衛できないため、今夜は別の人物を選んでください。`
                : '';
            const info = cands.map(i => `${STATE.characters[i].name}（${STATE.characters[i].description.slice(0, 60)}）`).join('\n');
            const susp = suspicionRanking().filter(([nm]) => cands.some(i => STATE.characters[i].name === nm));
            const suspLine = susp.length ? `\n議論で疑われている人物: ${susp.map(([nm, c]) => `${nm}(${c})`).join('、')}` : '';
            return `あなたは騎士（${STATE.characters[idx].name}）です。今夜、人狼の襲撃から守りたい人物を1人選んでください（自分は選べない）。${lastGuardNote}

## 生存者（自分以外）
${info}
${suspLine}

## 選び方の指針
- 占い師や霊媒師と思われる（COした・COしそう）人物を優先
- 議論をリードしていて人狼に狙われそうな人物を優先
- 疑いが強すぎて処刑されそうな人物は避ける（護衛が無駄になる）

## 出力
{
  "knight_target": "守るキャラクターの名前"
}`;
        }

        function buildWolfNightPrompt() {
            const alive = STATE.aliveIndices;
            const wolves = STATE.werewolfIndices.filter(idx => STATE.characters[idx].alive);

                const c = STATE.characters[i];

                return `${c.name}（${isWolf ? '【仲間の人狼】' : '【襲撃候補】'} ${c.description}）`;
            }).join('\n');
            const wolfNames = wolves.map(i => STATE.characters[i].name).join('、');

                ? `あなたたち人狼（${wolfNames}）は協力して、今夜襲撃する村人を相談してください。`
                : `あなたは唯一の人狼（${wolfNames}）です。単独で襲撃対象を決めてください。`;

            const exampleJson = {};

                : '';

## 現在の生存者
${charInfo}
${wolfCo}

## 襲撃対象の選び方の指針
- **占い師・霊媒師をCOした人物を最優先で襲撃する**（真実を知る役職を早く潰す）
- 占い師と思われる人物を優先的に襲撃する（占い結果を公開されると不利になるため）
- 推理が鋭く、人狼に迫っている発言をしていた村人を狙う

## この日の議論で「怪しい」と疑われた人物
${suspicionRanking().length ? suspicionRanking().map(([name, cnt]) => `・${name}: ${cnt}回`).join('\n') : '・（まだなし）'}

人狼各自が「誰を襲撃したいか」をJSONで返してください。

        function buildFortuneNightPrompt() {
            const alive = STATE.aliveIndices;
            const idx = STATE.fortuneTellerIndex;
            const charInfo = alive.filter(i => i !== idx).map(i =>
                `${STATE.characters[i].name}（${STATE.characters[i].description}）`
            ).join('\n');
            const fortuned = (STATE.fortuned || []).map(i => STATE.characters[i] ? STATE.characters[i].name : '').filter(Boolean);
            const fortunedLine = fortuned.length ? `\nすでに占った人物（再占い禁止）: ${fortuned.join('、')}` : '';
            const aliveNames = alive.map(i => STATE.characters[i].name);
            const aliveRank = suspicionRanking().filter(([name]) => aliveNames.includes(name));
            const suspicionLine = aliveRank.length
                ? `\n最近の議論で疑われている人物:\n` + aliveRank.map(([name, cnt]) => `・${name}: ${cnt}回`).join('\n')
                : '';
            return `あなたは占い師（${STATE.characters[idx].name}）です。今夜誰を占いますか？

## 生存者（自分以外）
${charInfo}
${fortunedLine}${suspicionLine}

## 占い対象の選び方
- 議論で最も怪しい発言をしていた人物を優先
- まだ一度も占っていない人物を優先

## 出力
{
  "fortune_teller_target": "占うキャラクターの名前"
}`;
        }

        function buildVotePrompt() {
            const alive = STATE.aliveIndices;
            const n = STATE.characters.length;
            let charInfo = alive.map(i => {
                const c = STATE.characters[i];
                let desc = c.description;
                if (i === STATE.fortuneTellerIndex && STATE.characters[i].alive && STATE.fortuneSecret) {
                    desc += ` （占い師の秘密: ${STATE.fortuneSecret}）`;
                }
                const roleHint = STATE.werewolfIndices.includes(i) ? '【人狼】' : '';
                return `■ ${c.name}${roleHint}\n${desc}`;
            }).join('\n\n');

            // CO追跡の推理材料
            const coSection = buildCOInference();

            // 直近の議論ログ（自分で読んで判断させる材料）
            const recentLog = STATE.conversationLog.slice(-20);
            const logSection = recentLog.length
                ? `\n## 直近の議論ログ\n` + recentLog.map(e => `・${e.name}: 「${e.speech}」`).join('\n')
                : '\n## 議論ログはまだありません';

            const deadList = STATE.characters.filter(c => !c.alive).map(c => c.name).join('、') || 'なし';
            return `${STATE.day}日目の投票フェーズです。${n}人のキャラクターが「誰を処刑したいか」を投票します。（死亡者: ${deadList}）

## 現在の生存者
${charInfo}
${logSection}
${coSection}

## 投票の指針（重要）
- 各キャラは**上の議論ログを自分で読み、自分の役職・性格・相手との関係性から独自に**投票先を決めること。
- **全員が同じ人物に投票するのは不自然です。キャラごとに視点が違うはず**（感情的なキャラは自分を攻撃してきた相手へ、論理的なキャラは発言の矛盾を見た相手へ、日和見なキャラは流れに乗る、など）。**2〜4箇所に票が割れるのが自然な姿です。**
- 【日数ルール】**初日（1日目）はまだ誰も犠牲者が出ておらず決定的な手がかりがないため、慎重なキャラは「見送り」を選ぶのが普通です（半数以上が見送りでもOK）。2日目以降は犠牲者が出ているため、原則として全員が自分なりの推理で誰かに投票してください**（この日に見送りを選べるのは本当に判断がつかない1〜2人まで）。
- 【終盤ルール・超重要】**生存者が5人以下になったら「見送り」は禁止です。**この人数で処刑できなければ、夜の襲撃で人狼の勝利が決まってしまいます。「完全に確信は持てないが一番怪しい人物」に必ず投票してください。村人陣営にとって、ここで見送ることは敗北を選ぶのと同じです。
- 見送りとする場合は「見送り」とだけ出力すること。
- 村人・占い師: 最も人狼らしいと判断した人物に投票。占い師が人狼を確定させる情報を持っているなら、その人狼に投票する。**なお「誰かの意見に同意するだけで自分の推理を一度も言っていない人物」「話題をそらす雑談ばかりの人物」は人狼が隠れている典型パターンなので、過激な人物だけでなくそういう目立たない人物も候補として検討すること。**
- 人狼: 自分に疑いを向けてきた人物や鋭い推理者に投票する。ただし露骨すぎて自分が疑われない範囲で。
- 自分自身には投票できない。人狼は仲間の人狼に投票できない。
- **投票先の名前は必ず上記一覧のフルネーム表記そのままで出力すること**（「魅音」「悟史くん」等の略称・敬称付きは禁止）。

  "キャラ名A": "投票先の名前 または 見送り",
  "キャラ名B": "投票先の名前 または 見送り",
  ...
}`;

        async function callGemini(prompt, jsonMode = true, maxTokens = 1500) {
            if (!STATE.apiKey) throw new Error('APIキーなし');
            // 指定の2モデルを使用（先頭から順にフォールバック）
            const models = ['gemini-3.5-flash-lite', 'gemini-3.1-flash-lite'];
            let lastError = null;
            for (const model of models) {
                try {
                    const url =
                        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${STATE.apiKey}`;
                    const payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.85, maxOutputTokens: maxTokens }
                    };
                    const resp = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                    if (!resp.ok) {
                        const err = await resp.text();
                        throw new Error(`HTTP ${resp.status}: ${err}`);
                    }
                    const data = await resp.json();
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    let jsonText = text;
                    if (jsonMode) {
                        const codeMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
                        if (codeMatch) jsonText = codeMatch[1].trim();
                        else {
                            const braceMatch = text.match(/\{[\s\S]*\}/);
                            if (braceMatch) jsonText = braceMatch[0];
                        }
                    }
                    return jsonText;
                } catch (e) {
                    lastError = e;
                    console.warn(`モデル ${model} 失敗:`, e);
                    continue;
                }
            }
            addSystemMessage('⚠️ APIが利用できません。しばらく待ってから再試行してください。', 'info');
            throw lastError || new Error('API Error');
        }

        function renderCards() {
            const container = document.getElementById('charCards');
            if (!container) return;
            container.innerHTML = '';
            STATE.characters.forEach((c, idx) => {
                const card = document.createElement('div');
                card.className = `char-card ${c.alive ? '' : 'dead'}`;
                const safeName = escapeHtml(c.name);
                const safeAnime = escapeHtml(c.anime);
                const safeImg = escapeHtml(c.imageUrl);

                let avatarHtml = '';
                if (c.imageUrl) {
                    avatarHtml = `<img class="avatar" src="${safeImg}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div class="avatar-placeholder" style="display:none;">${escapeHtml(c.name.charAt(0))}</div>`;
                } else {
                    avatarHtml = `<div class="avatar-placeholder">${escapeHtml(c.name.charAt(0))}</div>`;
                }

                const roleLabel = {
                    werewolf: '🐺 人狼',
                    villager: '🏘️ 村人',
                    fortuneteller: '🔮 占い師',
                    medium: '👻 霊媒師',
                    knight: '🛡️ 騎士',
                    madman: '🎭 狂人'
                }[c.role] || '';
                const badgeClass = {
                    werewolf: 'werewolf',
                    villager: 'villager',
                    fortuneteller: 'fortuneteller',
                    medium: 'medium',
                    knight: 'knight',
                    madman: 'madman'
                }[c.role] || '';
                card.innerHTML = `
                    <span class="dead-ribbon">DEAD</span>
                    ${avatarHtml}
                    <div class="name">${safeName}</div>
                    <div class="anime">${safeAnime}</div>
                    <span class="role-badge ${badgeClass}">${roleLabel}</span>
                `;
                container.appendChild(card);
            });
        }

        function setPhase(text, styleClass) {
            const el = document.getElementById('phaseDisplay');
            el.innerHTML = text;
            el.className = 'phase-badge' + (styleClass ? ' ' + styleClass : '');
        }

        function wait(seconds) {
            const inverted = 10 - seconds;
            const base = 1.2 + (inverted / 10) * 6.8;
            const delay = base * 1000;
            return waitFor(delay);
        }

        const FAST_PHASE_DELAY_MS = 1400;
        function fastWait(ms = FAST_PHASE_DELAY_MS) {
            return waitFor(ms);
        }

        function waitUntilResume() {
            return new Promise(r => {
                const iv = setInterval(() => {
                    if (!STATE.paused) { clearInterval(iv); r(); }
                }, 150);
            });
        }

        function togglePause() {
            STATE.paused = !STATE.paused;
            document.getElementById('pauseBtn').innerHTML = STATE.paused
                ? '<i class="fas fa-play"></i> 再開'
                : '<i class="fas fa-pause"></i> 一時停止';
            addSystemMessage(STATE.paused ? '⏸ 一時停止' : '▶️ 再開', 'info');
        }

        function resetGame() {
            if (confirm('ゲームをリセットしてライブラリ画面に戻りますか？')) {
                STATE.gameToken++;  // 旧ループを無効化
                STATE.running = false;
                STATE.paused = false;
                document.querySelector('[data-tab="library"]').click();
                document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i> 一時停止';
                setPhase('⏳ 待機中', '');
                document.getElementById('dayCounter').textContent = '0日目';
                document.getElementById('messageArea').innerHTML = '';
                document.getElementById('charCards').innerHTML = '';
                STATE.suspicion = {};
                STATE.fortuned = [];
                STATE.fortuneHistory = [];
                STATE.mediumHistory = [];
                STATE.lastExecuted = -1;
                STATE.lastGuardedIdx = -1;
                STATE.daySchedule = [];
                STATE.fullLog = [];
                STATE.coClaims = []; STATE.publicResults = [];
                STATE.nightDeaths = [];
                STATE.lastNightVictim = null;
            }
        }
